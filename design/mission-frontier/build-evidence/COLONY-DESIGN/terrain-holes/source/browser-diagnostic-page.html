<!doctype html><title>terrain diag</title><style>body{margin:0;background:#173e4a}#info{position:fixed;top:4px;left:6px;color:#fff;font:13px monospace;background:#0008;padding:4px 6px}</style>

<script type="module">
import * as THREE from "three";

const q = new URLSearchParams(location.search);

  if (bf && o.name.startsWith("MF_Terrain")) { o.material = o.material.clone(); o.material.side = THREE.FrontSide; }

  if (flip && o.name === "MF_Terrain__terrain_gravel_sand") { const g = o.geometry; const idx = g.index.array; for (let i = 0; i < idx.length; i += 3) { const t = idx[i + 1]; idx[i + 1] = idx[i + 2]; idx[i + 2] = t; } g.index.needsUpdate = true; const n = g.attributes.normal.array; for (let i = 0; i < n.length; i++) n[i] = -n[i]; g.attributes.normal.needsUpdate = true; flipped++; } });
