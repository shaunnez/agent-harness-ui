<div id="frontier-workspace-study" aria-label="Mission Frontier task workspace design study">

    #frontier-workspace-study .fw-panel{border:1px solid var(--fw-edge);border-radius:7px;background:var(--fw-panel);min-width:0;overflow:clip}

    #frontier-workspace-study .fw-inspector .fw-metric{font-size:23px;color:var(--fw-text)}

    function content(){switch(state.viewed){case 0:return panel('Task assessment',`<div class="fw-document"><section><h3>Outcome</h3><p>Identify revision mismatches while preserving the selected drawings and source references.</p></section><section><h3>Scope & risk</h3><p>Bounded comparison behaviour. Existing data shapes and error handling need repository evidence before planning.</p></section><section><h3>Recommended investigation</h3>${kv([['Code path scout','Locate revision parsing and comparison'],['Test inventory scout','Identify missing-revision and source-preservation coverage']])}</section></div>`,badge('Recorded','green'))+panel('Retained output','<p>Triage report · v1</p><p class="fw-caption">Recorded routing rationale and source context.</p>',button('Open report','artifact'));
    case 1:return scouts();
    case 2:return grill();case 3:return specification();case 4:return plan();case 5:return packageView();case 6:return reviewView();case 7:return testView();
    case 8:return finalReviewView();
    case 9:return approvalView();
    case 10:return panel('Compare directions',`<div class="fw-half"><div class="fw-inset"><h3>Codex Design</h3><small>Sol · High</small><div class="fw-line"></div><p>Compact evidence-first workspace with persistent context and direct access to artifacts.</p><div style="margin-top:16px">${button('Inspect direction','design')}</div></div><div class="fw-inset"><h3>Claude Design</h3><small>Opus · High</small><div class="fw-line"></div><p>Plan-first presentation with explicit review checkpoints and delivery summaries.</p><div style="margin-top:16px">${button('Inspect direction','design')}</div></div></div><p class="fw-caption">Illustrative direction summaries. Full generated previews are outside this layout study.</p>`,badge('Optional subflow'))+panel('Selected direction',kv([['Provider','Codex Design'],['Model & reasoning','Sol · High'],['Supplied context','Task brief, repository evidence and recorded decisions']])+`<div class="fw-line"></div><label class="fw-field">Refinement feedback<textarea placeholder="What should change in this direction?"></textarea></label>`);
    case 11:return panel('Pull request #214',`<h2>Check drawing revisions</h2><div class="fw-line"></div>${kv([['Repository','shaunnez/plancheck'],['Approved candidate','C1 r3 · 9f1d2b7'],['Target','main'],['Last checked','09:47 · illustrative snapshot']])}<div class="fw-line"></div><div class="fw-actions">${button('View PR details','pr')}${button('Refresh status','refresh')}</div>`,badge('Awaiting merge','amber'))+panel('Delivery timeline',`<div class="fw-flow"><div class="fw-inset"><small>1 · Recorded</small><h3>Approved</h3><small>Exact candidate C1 r3</small></div><div class="fw-inset"><small>2 · Current</small><h3>PR opened</h3><small>Waiting for merge</small></div><div class="fw-inset"><small>3 · Future</small><h3>Merged</h3><small>Not yet confirmed</small></div></div>`)+panel('Retained artifacts',`<div class="fw-actions">${['Specification','Plan','Candidate diff','Review','Tests'].map(a=>button(a,'artifact')).join('')}</div>`);
    default:return '';}}
    function inspector(){const i=currentIndex();const role=i===9?'Human operator':i===4||i===6||i===8?'Sol · High':'Luna · XHigh';const runState=state.viewed===state.screen&&(state.viewed===1||(state.viewed===5&&!implementationComplete()))?'Running':i===9?'Publication gate':'Run finished';return `<section><h3>Task brief</h3><p>Detect drawing revision mismatches with source references. Preserve the original documents.</p></section><section><h3>Role & run</h3><div class="fw-worker">${i===9?icon('user-round'):`<img src="${art.portrait}" alt="">`}<div><strong>${role}</strong><small>${runState}</small></div></div><small>Viewed: ${screenNames[state.viewed]}<br>Active: ${screenNames[state.screen]}</small>${i!==9?`<div style="margin-top:10px">${button('Inspect run','watch')}</div>`:''}</section><section><h3>Usage <small>· task total</small></h3><p class="fw-metric">144K <small>tokens</small></p><small>Input 124K · Output 20K<br>Cached 62K · 50% cache rate</small><div class="fw-line"></div>${kv([['Elapsed','18m 42s'],['Approx. cost','Unavailable']])}<small>API-rate estimate needs a rate card.<br>All values here are illustrative.</small></section><section><h3>Run safeguards</h3><p>${i===5?'Writes limited to the isolated candidate worktree.':i===9?'Exact candidate and current gates revalidated before publication.':i===7?'Temporary test files may be created in the candidate; the exact revision must remain clean.':'Read-only repository access for this stage.'}</p><small>${i===9?'Publication requires operator confirmation.':'Attempts: 1 / 3'}</small></section><section><h3>Context & repository</h3>${kv([['Repository','plancheck'],['Captured base','50b6a90']])}<div class="fw-line"></div><small>Supplied context is recorded per artifact. Repository access alone does not establish what a model used.</small><div style="margin-top:10px">${button('Context manifest','context')}</div></section>${i>=2?'<section><h3>Recorded decisions</h3><p>Preserve source drawings.<br>Keep every mismatch traceable.</p></section>':''}`;}
    function render(){$('#fw-snapshot-label').hidden=state.screen!==5;$('#fw-snapshot').value=state.implementation;root.dataset.layout=state.layout;root.style.setProperty('--fw-pad',state.padding+'px');$('#fw-screen').value=state.screen;$('#fw-layout').value=state.layout;$('#fw-pin').textContent=state.pinned?'Pinned':'Pin task';$('#fw-pin').setAttribute('aria-pressed',String(state.pinned));const current=currentIndex(),active=activeIndex();$('#fw-stages').innerHTML=stageNames.map((n,i)=>`<button type="button" data-stage="${i}" class="${i===current?'fw-current':i<active?'fw-done':''}" ${i>active?'disabled':''} ${i===current?'aria-current="step"':''}><span class="fw-step">${i<active?'✓':i+1}</span><span>${n}<small>${i===active?'Active':i<active?'Recorded':'Not started'}</small></span></button>`).join('');$('#fw-compact-stage').innerHTML=stageNames.map((n,i)=>`<option value="${i}" ${i===current?'selected':''} ${i>active?'disabled':''}>${i+1}. ${n}${i===active?' · active':''}</option>`).join('');const history=state.viewed!==state.screen;$('#fw-history').hidden=!history;$('#fw-history').innerHTML=`Viewing recorded ${screenNames[state.viewed]}. Active work remains at ${screenNames[state.screen]}. <button type="button" id="fw-return">Return to active stage</button>`;const c=state.viewed===5&&implementationComplete()?['Implement','Candidate assembled','green','Qualified slices are assembled. Dev review is the next gate for this revision.','Start dev review','confirm']:configs[state.viewed];$('#fw-command').innerHTML=`<div><div class="fw-command-title"><h2>${c[0]}</h2>${badge(history?'Recorded history':c[1],history?'':c[2])}</div><p>${history?'Retained stage evidence. Actions for active work are available after returning to the active stage.':c[3]}</p></div><div class="fw-actions">${button(history?'Open retained artifact':c[4],history?'artifact':c[5],c[5]==='repair'&&!history?'fw-danger':'fw-primary')}${!history&&state.viewed===7?'<button type="button" disabled aria-describedby="fw-retry-reason">Retry same candidate</button><small id="fw-retry-reason">Unavailable: code repair required</small>':''}</div>`;$('#fw-main').innerHTML=content()+`<section class="fw-journal"><button type="button" id="fw-activity" aria-expanded="${state.activity}"><span>Run activity <small>· recorded telemetry</small></span><span>${state.activity?'−':'+'}</span></button>${state.activity?'<div class="fw-journal-content"><div class="fw-line"></div><small>09:45 · Current stage entered<br>09:46 · Stage evidence retained<br>Illustrative timeline; no live connection.</small></div>':''}</section>`;$('#fw-inspector').innerHTML=inspector();if(history){root.querySelectorAll('#fw-main textarea,#fw-main input,#fw-main [data-dialog="answer-confirm"],#fw-main [data-dialog="remaining"]').forEach(e=>e.disabled=true);}$('#fw-layout-status').textContent=`Shared shell · ${state.layout} navigation · ${history?'historical stage':screenNames[state.screen]}`;enrichVisuals();root.querySelectorAll('button,select,.fw-answer').forEach(e=>e.classList.add('cursor-interaction'));}
    const dialogs={policies:['Task role policies','<p>Illustrative policy snapshot. Worker roles use Luna · XHigh; planning and review roles use Sol · High.</p><p>In the application, started runs retain their recorded policy. Eligible future policies remain accessible here.</p>'],manage:['Manage task','<p>Task lifecycle controls stay in one consistent location. The live application determines whether cancel, close, retry or archive is eligible.</p><small>No task action can run from this design study.</small>'],watch:['Worker inspection','<p>Watch opens the selected recorded run and preserves task/package identity.</p><small>In this layout study, the world and live worker activity are not connected.</small>'],artifact:['Retained evidence','<p>Open the recorded artifact in a wide read-only viewer. Keep version, originating stage and context manifest with the content.</p><pre class="fw-code">PC-142 · illustrative artifact\nVersion and source are preserved on return.</pre>'],diff:['Candidate diff · C1 r3','<pre class="fw-code">backend/revisions.py\n<span class="fw-add">+ if revision is None:\n+     return []</span></pre><small>Illustrative candidate diff. No repository changes are performed.</small>'],repair:['Repair candidate · preview','<p>A repair creates a new candidate revision and invalidates the affected downstream review and test gates.</p><small>Production would revalidate eligibility and request confirmation. This study does not start a repair.</small>'],confirm:['Confirm action · preview','<p>The production confirmation would identify the exact task, candidate or artifact, eligible action and resulting state change.</p><small>No approval, execution, push or pull request occurs here.</small>'],context:['Supplied context manifest','<p>Task brief, selected repository evidence and recorded decisions.</p><small>The full application retains source identity, size and truncation for each artifact. Permission to read files is recorded separately.</small>'],pr:['PR #214 · illustrative identity','<p>Repository: shaunnez/plancheck<br>Candidate: C1 r3 · 9f1d2b7<br>Target: main<br>State: Awaiting PR merge</p><small>This is fictional study data and does not open a real pull request.</small>'],refresh:['Status refresh · preview','<p>The production application would check the exact PR identity and merge state.</p><small>No network request is made in this study.</small>'],design:['Design direction','<p>The full application opens the generated direction with provider, model, reasoning and supplied-context provenance.</p><small>This study compares the task shell; the provider thumbnails are not fabricated.</small>'],'answer-confirm':['Answer selected · preview','<p>Your selected answer and rationale would be recorded, then the next question would open.</p><small>This study does not persist an answer to a task.</small>'],remaining:['Accept remaining recommendations · preview','<p>This remains a deliberate manual action. Each accepted answer would record its provenance.</p><small>This study does not submit any decisions.</small>']};
    function openPreview(title,body){$('#fw-detail').hidden=false;$('#fw-detail').innerHTML=`<div><h3>${title}</h3><button type="button" id="fw-close-detail">Close preview</button></div>${body}`;if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18}});$('#fw-close-detail').focus();}
    function showDialog(name){if(name==='diff'){const c=candidateIdentity();openPreview(`Candidate diff · ${c.label} · ${c.sha}`,candidateDiff()+'<p class="fw-caption">Two-file excerpt · fictional retained diff · read-only preview.</p>');return;}if(name==='approve-preview'){const c=candidateIdentity();openPreview('Review approval & PR publication',kv([['Task','PC-142 · Check drawing revisions'],['Repository','shaunnez/plancheck'],['Candidate',`${c.label} · ${c.sha}`],['Target','main'],['Operator note',esc(state.note)||'No note']])+`<p>Publish this approved head to a task-specific branch and open its pull request. The task then waits for the matching merge.</p><div class="fw-actions">${button('Confirm approval & raise PR · preview','approve-done','fw-primary')}</div><small>Design preview only. This does not publish or approve a real task.</small>`);return;}if(name==='approve-done'){openPreview('Approval interaction previewed','<p>No task was changed and no pull request was created.</p><button type="button" data-preview-delivery>Preview the awaiting-merge screen</button>');return;}if(name==='implementation-report'){openPreview('Implementation report','<p>Retained implementation output and its self-assessment belong here. A self-score is separate from the independent Dev review verdict.</p><small>No structured rubric score is supplied in this study.</small>');return;}if(name==='answer'){const field=$('#fw-note');field?.focus();return;}const d=dialogs[name]||dialogs.artifact;$('#fw-detail').hidden=false;$('#fw-detail').innerHTML=`<div><h3>${d[0]}</h3><button type="button" id="fw-close-detail">Close preview</button></div>${d[1]}`;$('#fw-close-detail').focus();}
    $('#fw-screen').innerHTML=screenNames.map((n,i)=>`<option value="${i}">${i<10?`${i+1}. `:''}${n}</option>`).join('');
    $('#fw-screen').addEventListener('change',e=>{state.screen=Number(e.target.value);state.viewed=state.screen;state.package='S2';state.source=false;state.result=2;state.diffFile='detector';state.note='';state.activity=false;$('#fw-detail').hidden=true;render();persist();});
    $('#fw-snapshot').addEventListener('change',e=>{state.implementation=e.target.value;$('#fw-detail').hidden=true;render();});
    $('#fw-layout').addEventListener('change',e=>{state.layout=e.target.value;render();persist();});
    $('#fw-compact-stage').addEventListener('change',e=>{state.viewed=Number(e.target.value);render();});
    root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.journey!==undefined){const row=journeyRows[Number(b.dataset.journey)];openPreview(`${row[0]} · retained evidence`,kv([['State',row[1]],['Tokens',row[2]],['Summed agent time',row[3]],['Outcome',row[4]]])+`<p class="fw-caption">${Number(b.dataset.journey)>=6?'Current candidate: C1 r3 · 9f1d2b7':'Retained prior-stage output'} · fictional study record.</p>`);return;}if(b.dataset.diffFile){state.diffFile=b.dataset.diffFile;if(!$('#fw-detail').hidden){showDialog('diff');}else render();return;}if(b.hasAttribute('data-preview-delivery')){state.screen=11;state.viewed=11;$('#fw-detail').hidden=true;render();persist();return;}if(b.dataset.dialog){showDialog(b.dataset.dialog);return;}if(b.dataset.stage!==undefined){state.viewed=Number(b.dataset.stage);render();return;}if(b.dataset.package){state.package=b.dataset.package;render();return;}if(b.dataset.planPackage){state.package=b.dataset.planPackage;render();return;}if(b.dataset.finding!==undefined){state.finding=Number(b.dataset.finding);render();return;}if(b.dataset.result!==undefined){state.result=Number(b.dataset.result);render();return;}if(b.hasAttribute('data-results')){state.result=null;render();root.querySelector('[data-result]')?.focus();return;}if(b.id==='fw-activity'){state.activity=!state.activity;render();return;}if(b.id==='fw-pin'){state.pinned=!state.pinned;render();return;}if(b.id==='fw-source'){state.source=!state.source;render();return;}if(b.id==='fw-return'){state.viewed=state.screen;render();return;}if(b.id==='fw-close-detail'){$('#fw-detail').hidden=true;$('#fw-screen').focus();}});
    root.addEventListener('input',e=>{if(e.target.id==='fw-note')state.note=e.target.value;if(e.target.name==='fw-answer')state.answer=e.target.value;});
    window.addEventListener('openai:set_globals',e=>{const w=e.detail?.globals?.widgetState;if(w){restore(w);render();}});
    render();
    if(globalThis.Tweak){const t=new Tweak({container:root,onChange:()=>{render();persist();}});t.addSelect(state,'layout',{label:'Stage navigation',options:[{label:'Top — proposed',value:'top'},{label:'Side — compare',value:'side'}]});t.addToggle(state,'workshop',{label:'Workshop illustration'});t.addSlider(state,'padding',{label:'Panel padding',min:14,max:22,step:4,unit:'px'});if(!t.supported)$('#fw-layout-fallback').hidden=false;}else{$('#fw-layout-fallback').hidden=false;}
  })();
  </script>
