<text class="k" x="20" y="1218">Hub: 12.0 m corner to corner, 10.39 m flat to flat, six 2.4 m doors, central table radius 1.5, six columns, 1.1 m parapets.</text>
<text class="k" x="20" y="1238">Clearances: doors 2.4 m (personnel) / 4.0 m (loading), 3.8 m clear height; robot 3.1 m tall, min spacing 3.3 m; every route lane >= 2.4 m; robots stay 0.6 m off walls and fixtures.</text>
<text class="k" x="20" y="1258">Cutaway hides MF_Roof + MF_ShellCutaway: flats 30 and 90 outer walls, bay front/right walls, all glazed partition uppers (above 1.2 m). Hub has columns and 1.1 m parapets only.</text>
<text class="k" x="20" y="1278">Capacity: briefing 3, planning 6, implementation 12, review 6, testing 6, dispatch 4, hub overflow 6, court 10 = 53 robot positions before the overflow-lane proposal applies.</text>
