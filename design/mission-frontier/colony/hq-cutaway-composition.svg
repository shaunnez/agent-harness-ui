<polygon points="1231.2,295.5 1098.8,331.9 983.6,276.4 1000.8,184.5 1133.2,148.1 1248.4,203.6" fill="#d9d4c7" fill-opacity="0.9" stroke="#333"/>
<text class="k" x="860" y="418">Cutaway framing at 1280x800: the hex (36 m) spans about 570 px; target (0, 4.3, -1) sits at 50/50; the bay and court fall below centre, clear of the dock unless a task is selected.</text>
<text class="k" x="860" y="438">Right-hand HUD keeps the review/testing side partially covered at laptop width; the cutaway camera view offset of 65 px (existing) shifts content left.</text>
<text class="k" x="860" y="458">Exterior framing: target (0, 4.3, 6), span 58; the HQ and court occupy the middle 60 percent; base label at y 19.5 stays under the top HUD.</text>
</svg>