<text class="dim" x="779.5619204831831" y="373.99026575238753" text-anchor="end" fill="#9fe">exterior 28.4 deg (span 58)</text>
<text class="dim" x="502" y="571.8" fill="#9fe">hides 2.2 m of floor behind a 1.2 m partition, 8.9 m behind a 4.8 m wall</text>
