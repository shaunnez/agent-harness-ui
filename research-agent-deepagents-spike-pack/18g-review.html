<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Research review — unpriced scenarios</title>
<style>
:root{--bg:#11131a;--panel:#191c25;--line:#2a2f3d;--ink:#e6e8ee;--dim:#98a0b3;
 --ok:#4ade80;--warn:#fbbf24;--none:#94a3b8;--acc:#60a5fa;--bad:#f87171;
 --mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;gap:24px;align-items:baseline;flex-wrap:wrap}
h1{font-size:17px;margin:0;font-weight:600}
.meta{color:var(--dim);font-size:12px}
.counts{margin-left:auto;display:flex;gap:14px;font-size:12px}
.counts b{font-variant-numeric:tabular-nums}
main{display:grid;grid-template-columns:minmax(380px,44%) 1fr;height:calc(100vh - 62px)}
@media(max-width:900px){main{grid-template-columns:1fr;height:auto}#detail{border-left:0;border-top:1px solid var(--line)}}
#list{overflow:auto;border-right:1px solid var(--line)}
#detail{overflow:auto;padding:22px 26px}
.filters{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);z-index:2}
button.f{background:transparent;border:1px solid var(--line);color:var(--dim);padding:4px 10px;border-radius:99px;cursor:pointer;font-size:12px}
button.f.on{background:var(--panel);color:var(--ink);border-color:var(--acc)}
.row{padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.row:hover{background:var(--panel)}
.row.sel{background:var(--panel);box-shadow:inset 3px 0 0 var(--acc)}
.row .t{font-weight:500}
.row .b{font-family:var(--mono);font-size:13px;white-space:nowrap}
.row .s{grid-column:1/-1;display:flex;gap:10px;align-items:center;color:var(--dim);font-size:12px;flex-wrap:wrap}
.badge{font-size:11px;padding:1px 7px;border-radius:4px;font-weight:600;letter-spacing:.02em}
.agreed{background:rgba(74,222,128,.15);color:var(--ok)}
.disputed{background:rgba(251,191,36,.15);color:var(--warn)}
.not_established{background:rgba(148,163,184,.15);color:var(--none)}
.decided{font-size:11px;padding:1px 7px;border-radius:4px;font-weight:600}
.d-approved{background:rgba(74,222,128,.2);color:var(--ok)}
.d-rejected{background:rgba(248,113,113,.2);color:var(--bad)}
.d-rescope{background:rgba(96,165,250,.2);color:var(--acc)}
h2{font-size:19px;margin:0 0 2px}
.sub{color:var(--dim);font-size:12px;margin-bottom:18px}
.dis{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 18px}
.dis span{background:var(--panel);border:1px solid var(--line);padding:5px 10px;border-radius:6px;font-size:12px;font-family:var(--mono)}
.big{font-family:var(--mono);font-size:26px;font-weight:600;margin:4px 0}
.big small{font-size:13px;color:var(--dim);font-weight:400}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin:24px 0 8px;font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:10px}
.basis{color:var(--dim);font-size:13px;line-height:1.6}
table{width:100%;border-collapse:collapse;font-size:12.5px}
td,th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
td.n{font-family:var(--mono);white-space:nowrap}
a{color:var(--acc)}
ul{margin:6px 0;padding-left:18px}li{margin:5px 0;color:var(--dim);font-size:13px}
pre{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;overflow:auto;font-size:12px;color:var(--dim);white-space:pre-wrap}
.act{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 22%);padding:22px 0 8px;margin-top:26px}
.act .btns{display:flex;gap:8px;flex-wrap:wrap}
.act button{padding:9px 16px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;font-size:13px;font-weight:500}
.act button.on{border-color:var(--acc);background:rgba(96,165,250,.18)}
textarea{width:100%;margin-top:9px;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:9px;font:13px/1.5 inherit;resize:vertical}
.empty{color:var(--dim);padding:60px 0;text-align:center}
.hash{font-family:var(--mono);font-size:11px;color:var(--dim)}
</style>

th and hole diameter are not published, so pole-hole spoil volume could not be checked against the wall rate","QV does not publish what table t24 (Retaining Walls: Pole) includes - whether drainage fill, subsoil drain and general wall-line excavation sit inside the $727/m2 rate is unknown, and it is the main driver of the band width","Quantities for drainage fill, spoil volume, geotextile area and batter area - these are my take-off from the stated geometry, not QV quantities.","Whether QV row t24:r6 is inclusive or exclusive of excavation, free-draining backfill, subsoil drain and spoil cartage - the table carries no inclusions note in the indexed data. This is the entire width of the band.","Whether QV table t24 (Retaining Walls: Pole) includes excavation, spoil cartage, concrete pole footings, free-draining backfill and subsoil drain, or only the pole and lagging structure - no inclusion preamble is published against the table","Whether the 1.0m pole centres in the QV rows suit 1.8m retention in firm clay without design confirmation (design is excluded from scope)"],"review":{"state":"pending","decision":null,"reviewer":null,"note":null,"decided_at":null},"record_sha256":"3f159f36118c5625"},{"scenario_id":"channel-drain-installation","title":"Channel drain installation to paving","family":"drainage","unit":"m of channel run","claims_covered":23,"status":"agreed","range":{"min":570,"max":800},"consensus":{"low":580,"high":700},"agreement":{"low_ratio":1.088,"high_ratio":1.29,"runs_with_band":3,"runs_total":3},"currency":"NZD","gst_basis":"exclusive","centre":"Auckland","as_of":"2026-09-22","basis":"Sum of five QV rows: t16:r14 channel installed ($416) + 2 x t17:r40 sawcut ($28.20) + t5:r8 break-out over 0.45-0.60m width ($79-106) + t6:r5 paving reinstatement over 0.10-0.25m residual strip ($14-36) + t9:r2 connection amortised over 20m ($31.85). Band width comes from break-out and reinstatement WIDTH assumptions only; all unit rates are taken as published, unadjusted. 20m run total $11,400-12,400. WLG $555-600/m ($11,100-12,000); CHC $575-625/m ($11,500-12,500). Excludes GST, preliminaries, margin, design, consent, contaminated spoil, dewatering, traffic management, second connection, sump or cesspit, per scope. Expect the real figure at or above the top of the band because the small-quantity patching premium is unpriced.","pinned_scope":"SCENARIO\nid: channel-drain-installation-pinned\ntitle: Channel drain installation to paving\nfamily: drainage\ncatalogue unit: m (per lineal metre of channel run)\n\nSCOPE - these parameters are FIXED. Do not substitute your own.\n  duty class:       light commercial (vehicle car-park / service yard, not heavy transport)\n  channel width:    100mm nominal\n  nominal run:      20 lineal metres, in one continuous run\n  existing surface: 150mm reinforced concrete paving\n  connection:       ONE connection point to an existing stormwater line at 1.0m invert depth\n\nINCLUDED in the rate, amortised over the 20m run where the item is not per-metre:\n  - proprietary channel and grate, supplied and installed\n  - concrete haunch / surround to the channel\n  - trench excavation and spoil cart\n  - sawcut and break out the existing concrete paving along the channel line\n  - reinstate concrete paving 150mm to match\n  - the single stormwater connection, amortised across the 20m\n\nEXCLUDED - do not price these:\n  - GST, preliminaries, margin, design, consent fees\n  - contaminated spoil, dewatering, traffic management\n  - any second connection point, sump or cesspit\n\nGive the band as $/m of channel run for this exact scope. State the total for the\n20m run as well, so the amortisation is auditable.\n\nPrice it, or tell us honestly why you cannot.\n","runs":[{"run":"run1","low":570,"high":620,"resolved_from":"qv+web","confidence":"medium","basis":"Sum of five QV rows: t16:r14 channel installed ($416) + 2 x t17:r40 sawcut ($28.20) + t5:r8 break-out over 0.45-0.60m width ($79-106) + t6:r5 paving reinstatement over 0.10-0.25m residual strip ($14-36) + t9:r2 connection amortised over 20m ($31.85). Band width comes from break-out and reinstatement WIDTH assumptions only; all unit rates are taken as published, unadjusted. 20m run total $11,400-12,400. WLG $555-600/m ($11,100-12,000); CHC $575-625/m ($11,500-12,500). Excludes GST, preliminaries, margin, design, consent, contaminated spoil, dewatering, traffic management, second connection, sump or cesspit, per scope. Expect the real figure at or above the top of the band because the small-quantity patching premium is unpriced.","components":[{"role":"proprietary channel and grate, light commercial duty, 100mm nominal, installed (inferred to include concrete haunch and trench excavation)","row_id":"915613f8a816d7765d17ab80b3f84417d8a74eda796620a26ab02c98421b1e70:t16:r14","source":null,"unit":"m","amount":{"low":416.0,"high":416.0},"centre":"Auckland","caveat":"Table heading rows absent from index, so inclusions could not be read. Inferred as fully installed rate because same table prices residential 100mm at $310/m against ~$29/m retail supply for a residential channel-and-grate unit. If supply-and-fix only, add t8:r2 ($102/m surround) and t0:r3 ($16.20/m trench excavation). WLG 403.00, CHC 412.00."},{"role":"sawcut existing reinforced concrete paving, 150mm deep, two cuts per metre of run","row_id":"3012e40c988aa035c47e34ff2ff827c2bcb29af24240a7bd826ab798d7476014:t17:r40","source":null,"unit":"m of run (2 x 14.10)","amount":{"low":28.2,"high":28.2},"centre":"Auckland","caveat":"Published rate is based on 100m of cutting; this job cuts ~40m, so the unit rate is optimistic. Rate is flat across AKL/WLG/CHC."},{"role":"break up and cart away existing 150mm concrete along channel line","row_id":"1e431d3e9f4822173217f03e52bdab07b323b92dd9046304b513b2875344218e:t5:r8","source":null,"unit":"m of run (0.45-0.60 m2 at $176/m2)","amount":{"low":79.2,"high":105.6},"centre":"Auckland","caveat":"Row is 'concrete floor topping' under Demolition and Alterations, an internal-works rate, not external reinforced paving. Break-out width 0.45-0.60m is my geometry assumption (100mm channel + ~150mm haunch each side + working space), not a QV figure. WLG $178/m2, CHC $196/m2."},{"role":"reinstate 150mm in-situ concrete paving to residual strip each side of channel","row_id":"f8d9cf5aa0d2fe887d830f8c558cf798e2e97ca147ce5dffa40fba65e82bb294:t6:r5","source":null,"unit":"m of run (0.10-0.25 m2 at $144/m2)","amount":{"low":14.4,"high":36.0},"centre":"Auckland","caveat":"Row is 17.5MPa 19mm new paving on prepared ground, priced on a large-area basis and with no reinforcing stated. Matching 150mm REINFORCED paving over a 2-5m2 patch with mesh and dowel tie-in will exceed this; the small-quantity premium is unpublished and is NOT in the band. WLG $137/m2, CHC $136/m2."},{"role":"single stormwater connection at 1.0m invert, amortised over 20m","row_id":"915613f8a816d7765d17ab80b3f84417d8a74eda796620a26ab02c98421b1e70:t9:r2","source":null,"unit":"m of run ($637 each / 20m)","amount":{"low":31.85,"high":31.85},"centre":"Auckland","caveat":"Row is 'Locate and Break into Existing 100mm Pipe and make new connection in trench, not exceeding 1.5m deep'. Covers the 1.0m invert but assumes the existing line is 100mm; QV publishes no larger-pipe equivalent in this table. WLG $583, CHC $632."},{"role":"supply price cross-check on channel component (used only to test whether t16:r14 is an installed rate)","row_id":null,"source":"https://www.bunnings.co.nz/everhard-easydrain-1m-compact-channel-and-polymer-grate_p4770222","unit":"m","amount":{"low":29.0,"high":29.0},"centre":"NZ retail","caveat":"Residential plastic channel with polymer grate, Class A, GST-inclusive retail. NOT a light-commercial equivalent and not used in the band. Used only to infer that QV's $310/m residential row must carry excavation, surround and labour."}],"not_established":["What QV row t16:r14 actually includes - the 'Light commercial use' heading rows (r13, r16) and any table preamble are absent from the local index, so the excavation and concrete-surround inclusion boundary is inferred, not read. This is the single largest uncertainty and decides between $570-620/m and $690-740/m.","Trade supply price for a light-commercial Class B/C 100mm polymer concrete channel and grate in NZ. ACO NZ and Allproof both decline to publish pricing; Allproof states costs are released only via installer or merchant. Ring ACO NZ, Allproof Industries, or Hynds Pipe Systems for a project quote.","Small-quantity premium for patching 2-5m2 of 150mm reinforced concrete paving with mesh and dowelled tie-in to the existing slab. Not published in QV; t6:r5 is a large-area new-work rate.","Length of connecting pipe from the channel outlet to the existing stormwater line. Scope specified a connection point and invert depth but no run length, so only the break-in is priced.","Diameter of the existing stormwater line. t9:r2 assumes 100mm; QV's Breaking Into Existing Pipelines table publishes no larger-diameter equivalent.","Ground conditions. Light soil assumed throughout; QV t0:r70 shows hand excavation in clay at roughly 2.8x the light-soil rate."]},{"run":"run2","low":620,"high":700,"resolved_from":"qv","confidence":"medium","basis":"Sum of seven QV CostBuilder rows. Channel and grate is a direct row match on duty class and nominal width (t16:r14); the other six are borrowed rows applied over an assumed 0.40-0.60m wide breakout and reinstatement strip. 20m run total: $12,400-$14,000 excl GST. Wellington approx $640/m, Christchurch approx $661/m on the same build-up. Conditional adjustment: if the t16 table header excludes the concrete surround, add approx $100/m (t8:r2 proxy) taking the rate to approx $790/m and the run to approx $15,800 - not included in the band because combining t8:r2 with t16:r14 would double count if the surround is already inside the channel rate.","components":[{"role":"channel_and_grate_installed","row_id":"915613f8a816d7765d17ab80b3f84417d8a74eda796620a26ab02c98421b1e70:t16:r14","source":null,"unit":"m","amount":{"low":416.0,"high":416.0},"centre":"Auckland","caveat":"Exact duty class and width match. Parent header row (t16:r13/r8) not returned by the index - cannot confirm whether concrete haunch/surround is inside this rate. Price stepping across duty tiers suggests it is. Unreviewed."},{"role":"sawcut_existing_paving","row_id":"3012e40c988aa035c47e34ff2ff827c2bcb29af24240a7bd826ab798d7476014:t17:r40","source":null,"unit":"m of run (2 cuts at $14.10/m)","amount":{"low":28.2,"high":28.2},"centre":"Auckland","caveat":"QV rate is stated as based on 100m runs; this job has 40m of cutting, so the real rate is higher."},{"role":"break_out_and_remove_150mm_rc_paving","row_id":"1e431d3e9f4822173217f03e52bdab07b323b92dd9046304b513b2875344218e:t5:r8","source":null,"unit":"m of run (0.40-0.60 m2/m at $176/m2)","amount":{"low":70.4,"high":105.6},"centre":"Auckland","caveat":"Row is an interior 'concrete floor topping' demolition rate applied to external paving. Its 'break up and remove' wording may overlap the separately priced sawcut. Strip width is my assumption, not QV."},{"role":"trench_excavation","row_id":"915613f8a816d7765d17ab80b3f84417d8a74eda796620a26ab02c98421b1e70:t0:r3","source":null,"unit":"m","amount":{"low":16.2,"high":16.2},"centre":"Auckland","caveat":"Shallowest published band is '1.5m total depth, average depth 1m, light soil' - deeper than a 100mm channel trench needs, so slightly overstated. Parent pipe-size header row not returned."},{"role":"spoil_cart_away","row_id":"d2f8402515bbdf813cdb14f78c04616b2379638bb82729718b17c996ec0683a1:t7:r3","source":null,"unit":"m of run (0.25-0.30 m3/m at $30.80/m3)","amount":{"low":0,"high":9.24},"centre":"Auckland","caveat":"Carried at zero in the low case because the trench excavation row may already include disposal. Concrete arisings are already inside the break-out row."},{"role":"reinstate_concrete_paving_150mm","row_id":"f8d9cf5aa0d2fe887d830f8c558cf798e2e97ca147ce5dffa40fba65e82bb294:t6:r5","source":null,"unit":"m of run (0.40-0.60 m2/m at $144/m2)","amount":{"low":57.6,"high":86.4},"centre":"Auckland","caveat":"17.5MPa bulk new paving on prepared ground, not a narrow reinstatement strip against a saved edge with dowels and edge formwork. Weakest line in the build-up; likely understated."},{"role":"stormwater_connection_amortised","row_id":"915613f8a816d7765d17ab80b3f84417d8a74eda796620a26ab02c98421b1e70:t9:r2","source":null,"unit":"m of run ($637 each over 20m)","amount":{"low":31.85,"high":31.85},"centre":"Auckland","caveat":"'Locate and break into existing 100mm pipe, not exceeding 1.5m deep' - covers the 1.0m invert. Any length of connecting pipe between the channel outlet and the existing line is not separately priced."}],"not_established":["Whether the concrete haunch/surround is inside QV row t16:r14 - the parent header row is not returned by the index and must be read in CostBuilder","Whether QV trench excavation rows t0:r3 include cart-away disposal","A QV rate for narrow-strip concrete paving reinstatement against a saved sawcut edge (dowelled, edge-formed) - no such row published","Short-run premium for a 20m job on rates QV states are based on 100m continuity","Named proprietary channel system (ACO, Stormtech, Hydro Tech) - QV publishes duty-class rows only, no branded product rates in this table"]},{"run":"run3","low":580,"high":800,"resolved_from":"qv","confidence":"medium","basis":"Sum of the QV build-up above, GST exclusive, NZD, Auckland. Excludes prelims, margin, design, consent fees, contaminated spoil, dewatering, traffic management, second connection, sump/cesspit. 20m run total = $11,600 to $16,000. Mid-case approx $690/m = $13,800. Band width is dominated by one unresolved question: whether QV row t16:r14 already includes the concrete surround. If it does, use $580-690/m; if not, use $690-800/m. Wellington approx 3% below, Christchurch approx 1% below.","components":[{"role":"proprietary channel and grate, light commercial duty, 100mm nominal, supplied and installed","row_id":"915613f8a816d7765d17ab80b3f84417d8a74eda796620a26ab02c98421b1e70:t16:r14","source":null,"unit":"m","amount":{"low":416,"high":416},"centre":"Auckland","caveat":"Exact duty-class and width match. UNREVIEWED QV row. Unresolved whether the rate already includes the concrete haunch/surround - this single ambiguity drives most of the band width."},{"role":"sawcut existing 150mm reinforced concrete paving, two cuts per lineal metre","row_id":"3012e40c988aa035c47e34ff2ff827c2bcb29af24240a7bd826ab798d7476014:t17:r40","source":null,"unit":"m","amount":{"low":28.2,"high":42.3},"centre":"Auckland","caveat":"QV rate $14.10/m is based on 100m runs; only 40m of cut here, so high column carries a 1.5x small-quantity uplift. Saw mobilisation may not be recovered."},{"role":"break out and cart away 150mm reinforced concrete paving along channel line","row_id":"1e431d3e9f4822173217f03e52bdab07b323b92dd9046304b513b2875344218e:t5:r8","source":null,"unit":"m","amount":{"low":70.4,"high":105.6},"centre":"Auckland","caveat":"$176/m2 is an internal 'floor topping' partial-demolition proxy, conservative. Breakout strip width 0.4-0.6m per metre is my assumption, not a QV quantity."},{"role":"concrete haunch/surround to channel, including all additional excavation and spoil","row_id":"915613f8a816d7765d17ab80b3f84417d8a74eda796620a26ab02c98421b1e70:t8:r2","source":null,"unit":"m","amount":{"low":0,"high":125},"centre":"Auckland","caveat":"Volumetric proxy: t8:r2 (100mm pipe, 0.13m3/m, $102/m) to t8:r3 (150mm pipe, 0.16m3/m, $125/m). Low set to 0 for the case where t16:r14 already includes surround. These rows state 'including all additional excavation', so NO separate trench-excavation line has been added along the channel - doing so would double count."},{"role":"reinstate concrete paving 150mm, 17.5MPa 19mm, to match","row_id":"f8d9cf5aa0d2fe887d830f8c558cf798e2 approx 300mm) trench excavation specific to a channel drain line - no matching row exists; covered instead by the concrete surround rows which state 'including all additional excavation'","Breakout strip width and reinstatement strip width - assumed 0.4-0.6m and 0.15-0.30m respectively, not sourced from QV","Diameter of the existing stormwater line. t9:r2 assumes 100mm; QV's Breaking Into Existing Pipelines table publishes no larger-diameter equivalent.","Ground conditions. Light soil assumed throughout; QV t0:r70 shows hand excavation in clay at roughly 2.8x the light-soil rate.","Length of connecting pipe from the channel outlet to the existing stormwater line. Scope specified a connection point and invert depth but no run length, so only the break-in is priced.","Length of spur pipe from channel outlet to the existing stormwater line - not given in the scenario; 2-5m assumed","Named proprietary channel system (ACO, Stormtech, Hydro Tech) - QV publishes duty-class rows only, no branded product rates in this table","Published NZ list pricing for proprietary 100mm polymer concrete channel (ACO KlassikDrain K100, Drainline 100, Allproof) - no vendor publishes rates; supplier quote needed to cross-check the $416/m row","Short-run premium for a 20m job on rates QV states are based on 100m continuity","Small-quantity / mobilisation uplift for a single 20m run (saw hire, concrete part-load, plant float) - not separable from QV rates, which assume larger quantities","Small-quantity premium for patching 2-5m2 of 150mm reinforced concrete paving with mesh and dowelled tie-in to the existing slab. Not published in QV; t6:r5 is a large-area new-work rate.","Trade supply price for a light-commercial Class B/C 100mm polymer concrete channel and grate in NZ. ACO NZ and Allproof both decline to publish pricing; Allproof states costs are released only via installer or merchant. Ring ACO NZ, Allproof Industries, or Hynds Pipe Systems for a project quote.","What QV row t16:r14 actually includes - the 'Light commercial use' heading rows (r13, r16) and any table preamble are absent from the local index, so the excavation and concrete-surround inclusion boundary is inferred, not read. This is the single largest uncertainty and decides between $570-620/m and $690-740/m.","Whether QV row t16:r14 (light commercial channel, 100mm) is supply-only, supply-and-fix, or supply-and-fix-including-concrete-surround - the table preamble is not in the indexed data and must be read in QV CostBuilder directly","Whether QV trench excavation rows t0:r3 include cart-away disposal","Whether the concrete haunch/surround is inside QV row t16:r14 - the parent header row is not returned by the index and must be read in CostBuilder"],"review":{"state":"pending","decision":null,"reviewer":null,"note":null,"decided_at":null},"record_sha256":"85fcd2e208315c83"},{"scenario_id":"suspended-ceiling-tile-grid","title":"Suspended tile ceiling supply install","family":"fitout","unit":"m2","claims_covered":19,"status":"disputed","range":{"min":100,"max":164},"consensus":{"low":100,"high":120},"agreement":{"low_ratio":1.0,"high_ratio":1.562,"runs_with_band":3,"runs_total":3},"currency":"NZD","gst_basis":"exclusive","centre":"Auckland","as_of":"2026-09-22","basis":"QV 24mm exposed grid 600x600 (standard to heavyweight, $41.90-$46.90) plus square-edge medium acoustic mineral fibre tile proxy ($58-$60, extrapolated from the 1200x600 SK 19mm Acoustic row with a 3% module uplift), with an allowance to the high side for perimeter wall angle if priced separately. EXCLUDES seismic back-bracing, which is not established anywhere. Total for 120 m2: $12,000-$14,400 GST exclusive, Auckland. Wellington roughly 5% lower, Christchurch roughly 2% lower.","pinned_scope":"SCENARIO\nid: suspended-ceiling-tile-grid-pinned\ntitle: Suspended tile ceiling supply and install\nfamily: fitout\ncatalogue unit: m2\n\nSCOPE - FIXED. Do not substitute your own.\n  grid:             exposed 24mm tee grid, standard duty\n  tile:             600 x 600 mineral fibre lay-in, square edge, medium acoustic grade\n  area:             120 m2, one regular open office area, rectangular\n  ceiling height:   2.7m finished, suspended 600mm below the slab soffit\n  seismic:          NZS 1170.5 restraint required, standard commercial back-bracing\n  perimeter:        wall angle to all edges, 46 lineal metres\n\nINCLUDED, amortised over the 120 m2 where not already per-m2:\n  - grid, hangers and fixings to the soffit\n  - lay-in tiles\n  - perimeter wall angle\n  - seismic back-bracing to the current standard\n  - cutting tiles around a nominal 12 recessed light fittings and 4 diffusers\n\nEXCLUDED - do not price:\n  - GST, preliminaries, margin, design\n  - the light fittings, diffusers, sprinkler heads or detectors themselves\n  - bulkheads, shadowline or concealed-grid detailing\n  - access equipment above 4m\n\nGive the band as $/m2 for this exact scope, and state the total for the 120 m2.\n\nPrice it, or tell us honestly why you cannot.\n","runs":[{"run":"r1","low":100,"high":120,"resolved_from":"qv","confidence":"medium","basis":"QV 24mm exposed grid 600x600 (standard to heavyweight, $41.90-$46.90) plus square-edge medium acoustic mineral fibre tile proxy ($58-$60, extrapolated from the 1200x600 SK 19mm Acoustic row with a 3% module uplift), with an allowance to the high side for perimeter wall angle if priced separately. EXCLUDES seismic back-bracing, which is not established anywhere. Total for 120 m2: $12,000-$14,400 GST exclusive, Auckland. Wellington roughly 5% lower, Christchurch roughly 2% lower.","components":[{"role":"grid_standard","row_id":"2f69cd6fc3148a59e4a1d63e299e323cb928f7a20b9b2fcddb15bb7192dff8f1:t1:r6","source":null,"unit":"m2","amount":{"low":41.9,"high":41.9},"centre":"Auckland","caveat":"Two-way exposed aluminium 24mm standard grid, 600x600 module, powder coated. Descriptor does not state whether hangers, wall angle or seismic restraint are included. Unreviewed row."},{"role":"grid_heavyweight_alt","row_id":"2f69cd6fc3148a59e4a1d63e299e323cb928f7a20b9b2fcddb15bb7192dff8f1:t1:r7","source":null,"unit":"m2","amount":{"low":46.9,"high":46.9},"centre":"Auckland","caveat":"Heavyweight 24mm alternative; used as the high side of the grid range. Not summed with the standard grid row."},{"role":"tile_proxy","row_id":"2f69cd6fc3148a59e4a1d63e299e323cb928f7a20b9b2fcddb15bb7192dff8f1:t2:r10","source":null,"unit":"m2","amount":{"low":58.0,"high":60.0},"centre":"Auckland","caveat":"AMF Thermatex SK (square) edge 19mm Acoustic, published only at 1200x600. No 600x600 square-edge row exists in QV. High side applies a 3% module uplift derived from QV's own 600x600 vs 1200x600 VT pair (t2:r3 $122 vs t2:r6 $118). Tile grade is the dominant variable: same family spans $26.40 (15mm Star, t2:r9) to $107 (24mm Alpha One, t2:r11)."},{"role":"aggregate_cross_check","row_id":"81310588732937020e50ae66e1c909b338b2d4a2a9ccf31b80332d286c630fbb:t3:r2","source":null,"unit":"m2","amount":{"low":161.0,"high":161.0},"centre":"Auckland","caveat":"Grid plus tile complete, but with 24mm VT tegular Acoustic tile, above the specified square edge. Cross-check only. NOT added to the grid or tile rows above and not used to form the band."},{"role":"perimeter_wall_angle","row_id":null,"source":null,"unit":"m","amount":{"low":0,"high":0},"centre":"Auckland","caveat":"46 lineal metres. No QV row for ceiling perimeter wall angle. Conventionally inside the grid m2 rate. QV aluminium angle trim rows (5c692a5a1ee23430c4ed8c04e6ec20a57f0a82bfbf11ae7f5c9496df4374b5cc:t0:r3, $26.10/m AKL) are 3mm anodised structural trim, a different product, and were deliberately not applied."},{"role":"seismic_back_bracing","row_id":null,"source":null,"unit":"m2","amount":{"low":0,"high":0},"centre":"Auckland","caveat":"NOT PRICED. No QV row for suspended ceiling seismic restraint. Web returned design guidance only (Comfortech NZ Seismic Bracing Guide, T&R seismic calculator) and a design-an ted_by":1},{"url":"https://costbuilder.qv.co.nz/detailed-rates/carpentry/carpentry/","section":"Carpentry / Interior Trim, Architrave and Skirting","group":"Bevel/bullnose, MUF PP","desc":"85mm x 18mm","unit":"m","regional":{"Auckland":"22.00","Christchurch":"20.80","Dunedin":"19.10","Hamilton":"18.80","Palmerston North":"18.00","Wellington":"20.40"},"row_id":"9bd8f998e94fb5e52699ed2b20902f0ecc410fad78bb9c156213c3ff5b2a2711:t60:r22","cited_by":1}],"web_sources":[],"open_questions":["A QV-published architrave quantity per door opening","A rebated pine frame to the exact spec - QV publishes only plain and grooved profiles, neither matching","A true 'rebated' pine jamb row - QV offers plain and grooved only","Any published non-rated internal doorset aggregate rate - QV publishes aggregates only for acoustic and fire doorsets","Any quantity/repetition discount for a 12-doorset run","Any repetition/bulk factor for 12 identical doorsets - not published by QV","Hang-and-adjust labour as a standalone rate - no such row exists in the 9,816-row capture","Leaf dimensions for row 78c8...:t5:r3 (uncaptured table preamble)","Leaf dimensions on rows t5:r3 / t5:r4 - not stated in the capture","Planted door stop, needed if the plain 115x25 frame is used (t3:r2 $17.80/m, ~5.1m, ~$91) - excluded from the band","Reconciliation between the component build-up (~$795-890) and the elemental doorset row a20c...:t0:r6 (AKL $1910)","The duplicate price tiers in the frame table (e.g. 125x40 plain $459 vs 125x40 grooved $228) - no species or grade distinguisher captured","The leaf size and thickness the Doors, Timber, Solid Core table applies to (preamble not indexed)","Whether QV Doors section rates are supply-only or supply-and-fix - drives the $203 spread at the top of the band","Whether QV Doors-chapter leaf and frame rates are supply-only or supply-and-fix","Whether QV row 78c8fd...:t5:r3 is supply-only or supply-and-hang, and whether hinges are inside it","Whether the 125x40 grooved frame row at 228 or the 150mm grooved rows at 459-506 are the correct order of magnitude"],"review":{"state":"pending","decision":null,"reviewer":null,"note":null,"decided_at":null},"record_sha256":"0845aeccef066db0"},{"scenario_id":"solar-mounting-structural-design","title":"Solar array mounting structural support","family":"structure","unit":"sum","claims_covered":12,"status":"agreed","range":{"min":11000,"max":23500},"consensus":{"low":11250.0,"high":23250.0},"agreement":{"low_ratio":1.045,"high_ratio":1.022,"runs_with_band":2,"runs_total":3},"currency":"NZD","gst_basis":"exclusive","centre":"Auckland","as_of":"2026-09-22","basis":"Mounting system NZD6,500-12,000 (hardware not established from NZ sources) + supplementary purlins and cleats NZD1,490-2,145 base x 1.5-2.0 retrofit factor = NZD2,200-4,500 + design and PS1 NZD3,000-6,500. GST, preliminaries and margin excluded. PV modules, inverters, cabling, all electrical work, roof sheet works, scaffolding, edge protection, roof access and consent fees excluded. Approx NZD380-770 per kWp. Only the strengthening line is QV-rooted; the other two thirds of the sum rest on non-NZ aggregates and derived rates, so the band should not be relied on without the supplier and engineer quotes named in the answer.","pinned_scope":"SCENARIO\nid: solar-mounting-structural-design-pinned\ntitle: Solar array mounting structural support\nfamily: structure\ncatalogue unit: sum (for the whole array)\n\nSCOPE - FIXED. Do not substitute your own.\n  array:            30 kWp, approximately 60 panels, roughly 120 m2 of panel area\n  roof:             existing steel portal warehouse, trapezoidal 0.55mm steel sheet\n                    on steel purlins at 1200mm centres, 8 degree pitch\n  mounting:         proprietary rail system on non-penetrating or clamped brackets\n                    to the sheet ribs\n  strengthening:    assume supplementary purlins to one third of the array footprint\n  design:           PS1 producer statement and wind/uplift calculation to AS/NZS 1170\n                    for an Auckland site, high wind zone\n\nINCLUDED:\n  - proprietary rails, clamps, brackets and fixings\n  - installation labour for the mounting system only\n  - supplementary purlins to one third of the footprint, supplied and fixed\n  - structural engineer's design and PS1\n\nEXCLUDED - do not price:\n  - GST, preliminaries, margin\n  - the PV modules, inverters, cabling or any electrical work\n  - roof sheet replacement, repair or recoating\n  - scaffolding, edge protection or roof access systems\n  - consent fees\n\nGive the band as a lump sum for this exact scope, broken into the mounting system,\nthe strengthening and the design fee so a reviewer can reject one part without the\nothers.\n\nPrice it, or tell us honestly why you cannot.\n","runs":[{"run":"r1","low":11500,"high":23000,"resolved_from":"qv+web","confidence":"low","basis":"Mounting system NZD6,500-12,000 (hardware not established from NZ sources) + supplementary purlins and cleats NZD1,490-2,145 base x 1.5-2.0 retrofit factor = NZD2,200-4,500 + design and PS1 NZD3,000-6,500. GST, preliminaries and margin excluded. PV modules, inverters, cabling, all electrical work, roof sheet works, scaffolding, edge protection, roof access and consent fees excluded. Approx NZD380-770 per kWp. Only the strengthening line is QV-rooted; the other two thirds of the sum rest on non-NZ aggregates and derived rates, so the band should not be relied on without the supplier and engineer quotes named in the answer.","components":[{"role":"proprietary rails, clamps, brackets, fixings (supply)","row_id":null,"source":"https://pvrack.com/cost/","unit":"sum","amount":{"low":4000,"high":7500},"centre":"Auckland","caveat":"NOT ESTABLISHED FROM NZ PUBLISHED PRICES. QV holds zero solar mounting rows. NZ trade prices (Ideal Electrical, Smiths NZ) sit behind trade logins and were not reachable. Figure is a US-published racking aggregate (NREL ~USD0.10/W; USD2,000-4,000 per 30kW flush mount) converted at ~1.7. Treat as an order-of-magnitude placeholder only. Assumes non-penetrating rib clamps survive the uplift check; if the engineer requires penetrating fixings to purlins, bracket type and count change."},{"role":"mounting system installation labour only","row_id":"77a9ea2e8b0f174651de8bdceb3c87c8c288ba10a5f707ee5c36267bf7395a8e:t0:r27","source":null,"unit":"sum","amount":{"low":2400,"high":4400},"centre":"Auckland","caveat":"QV Labour Rates, Roofer all types AKL 74.30/hr, banded up to Steel Erector 77a9ea2e...:t0:r31 AKL 91.50/hr. Rows UNREVIEWED. Hours (32-48, two installers over 2-3 days for 60 modules) are my build-up, not a QV quantity. Excludes access, scaffold and edge protection per scope."},{"role":"supplementary purlins supply and fix, 40 m2 of footprint","row_id":"52d4a068b2aced2722dab3e921b35879d1a60fc34fe3b6d61a4a3aec5c10b994:t7:r25","source":null,"unit":"sum","amount":{"low":1700,"high":2900},"centre":"Auckland","caveat":"QV DHS 200/15 galvanised purlin bolted to steel AKL 34.60/m; banded to :t7:r28 DHS 250/15 at 38.60/m and :t7:r29 DHS 250/18 at 43.80/m. Rows UNREVIEWED and EXCLUDE BOLTS. Quantity ~33 m derived from 40 m2 with one intermediate purlin between existing 1200 crs purlins - my take-off, not QV. QV rate assumes new-build erection with crane access; a retrofit factor of 1.5-2.0x is applied in the band below and is my judgement, not a published figure. Do not add the erector hourly rate on top - the per-metre rate already contains its labour."},{"role":"purlin cleats, brackets and bolts","row_id":"52d4a068b2aced2722dab3e921b35879d1a60fc34fe3b6d61a4a3aec5c10b994:t2:r45","source":null,"unit":"sum","amount":{"low":500,"high":1600},"centre":"Auckland","caveat":"QV Purlin cleats 120 hours fabrication/tonne AKL 20.80/kg; upper bound from :t2:r46 at 250 hrs/tonne AKL 38.60/kg. Rows UNREVIEWED. Cleat weight (~1.5 kg each) and count (~12) are my assumptions. Includes the bolts the purlin row explicitly excludes; QV structural bolt rows were not located."},{"role":"structural engineer design, AS/NZS 1170 wind and uplift, PS1","row_id":null,"source":"https://solarscout.co.nz/solar-for-business/","unit":"sum","amount":{"low":3000,"high":6500},"centre":"Auckland","caveat":"NOT IN QV - QV publishes no consultant fees, and no NZ practice publishes a fee schedule for this. Built from 15-30 engineer hours at NZD160-220/hr charge-out, the charge-out derived from published salary data at a conventional 2.5-3x multiplier. Corroborated only loosely by NZ solar industry commentary quoting NZD2,000-10,000 for commercial structural assessment. A CPEng design or review is mandatory here, not optional: since 23 Oct 2025 a roof array over 40 m2 (this is ~120 m2) is exempt from building consent only with CPEng involvement."}],"not_established":["NZ published price for proprietary solar mounting rails, rib clamps and brackets - QV holds no rows, NZ distributor pricing is behind trade login","NZ published rate for solar mounting system installation labour per panel or per kWp","NZ published structural engineer fee or charge-out rate for PS1 and AS/NZS 1170 wind assessment","QV rate for structural bolts to purlin cleats","Whether non-penetrating clamped brackets satisfy uplift on 0.55mm trapezoidal sheet in Auckland high wind zone - this is the engineer's call and it moves the mounting cost"]},{"run":"r2","low":11000,"high":23500,"resolved_from":"qv+web","confidence":"low","basis":"GST exclusive, NZD, excludes preliminaries, margin, PV modules, inverters, cabling, all electrical work, roof sheet works, scaffolding, edge protection, roof access, internal EWP hire and consent fees. Mounting system $5,000-$10,500 + supplementary purlins to one third of footprint $3,000-$6,000 + engineer's design and PS1 $3,000-$7,000. Only the purlin steel is QV-sourced; the mounting hardware and the design fee are web-derived and the retrofit factor is judgement.","components":[{"role":"mounting_hardware_and_install","row_id":null,"source":"https://nuwattenergy.com/en/commercial-solar/cost-guide + https://sunergise.nz/how-much-does-commercial-solar-cost-a-practical-guide-for-businesses-in-nz/","unit":"sum","amount":{"low":5000,"high":10500},"centre":"Auckland","caveat":"No QV row exists for PV racking. Derived from racking = 8-15% of NZ commercial installed cost ($1,400-$1,800/kW), cross-checked bottom-up at $50-$110/panel hardware plus 24-42 hrs labour. The two methods disagree at the low end; no quoted bill of materials obtained."},{"role":"install_labour_rate_basis","row_id":"77a9ea2e8b0f174651de8bdceb3c87c8c288ba10a5f707ee5c36267bf7395a8e:t0:r27","source":null,"unit":"hour","amount":{"low":74.3,"high":74.3},"centre":"Auckland","caveat":"QV Roofer all types, unreviewed row, used only as the labour rate basis inside the mounting component - not added separately."},{"role":"install_labour_rate_basis_alt","row_id":"77a9ea2e8b0f174651de8bdceb3c87c8c288ba10a5f707ee5c36267bf7395a8e:t0:r31","source":null,"unit":"hour","amount":{"low":91.5,"high":91.5},"centre":"Auckland","caveat":"QV Steel Erector, unreviewed row, upper bound of the blended labour rate. Not added separately."},{"role":"supplementary_purlins","row_id":"52d4a068b2aced2722dab3e921b35879d1a60fc34fe3b6d61a4a3aec5c10b994:t7:r22","source":null,"unit":"m","amount":{"low":27.1,"high":34.6},"centre":"Auckland","caveat":"QV DHS galvanised purlin 150/15 ($27.10/m, row t7:r22) to 200/15 ($34.60/m, row t7:r25), bolted to steel, EXCLUDING bolts. Unreviewed rows. New-build erection basis - assumes open frame before sheeting."},{"role":"purlin_cleats","row_id":"52d4a068b2aced2722dab3e921b35879d1a60fc34fe3b6d61a4a3aec5c10b994:t2:r45","source":null,"unit":"kg","amount":{"low":20.8,"high":38.6},"centre":"Auckland","caveat":"QV purlin cleats, 120 hrs fab/tonne ($20.80/kg, t2:r45) to 250 hrs fab/tonne ($38.60/kg, t2:r46). Unreviewed. ~15 kg assumed for 33 m of purlin."},{"role":"purlin_bolts","row_id":"52d4a068b2aced2722dab3e921b35879d1a60fc34fe3b6d61a4a3aec5c10b994:t8:r19","source":null,"unit":"each","amount":{"low":8.6,"high":8.6},"centre":"Auckland","caveat":"QV HSFG bolt grade 8.8, M16 x 50. Unreviewed. ~20 no. assumed. Needed because the purlin rate excludes bolts."},{"role":"strengthening_total","row_id":null,"source":null,"unit":"sum","amount":{"low":3000,"high":6000},"centre":"Auckland","caveat":"33 m of purlin over 40 m2 (one third of 120 m2 footprint) at 0.83 m/m2. QV new-build buildup is $1,400-$1,900; I applied a 2x to 3x retrofit factor for overhead bolting under a live sheeted roof in an occupied warehouse. That factor is my judgement - QV publishes no add-extra for steelwork in existing buildings. Internal EWP hire excluded as roof access."},{"role":"structural_design_and_ps1","row_id":null,"source":"https://cybotixenergy.co.nz/commercial-solar-installation-costs-in-nz/","unit":"sum","amount":{"low":3000,"high":7000},"centre":"Auckland","caveat":"NZ 2026 guidance is $2,000-$10,000 for a commercial structural report; a simple Auckland single-member design starts at $800-$1,500. Narrowed to $3,000-$7,000 for AS/NZS 1170.2 wind/uplift in a high wind zone plus purlin and clamp design plus PS1. QV carries no consultant fee scale; ACENZ publishes no public rate. Not a quote."}],"not_established":["Any published NZ rate for proprietary PV rail, rib clamp or non-penetrating bracket - QV carries none and Clenergy/Ideal Electrical/LUX Solar do not publish trade prices","Published uplift factor for structural steelwork retrofitted into an existing sheeted roof - the 2x-3x used is my judgement","Firm PS1 fee for wind/uplift design of a 30 kWp array on an existing Auckland high-wind-zone warehouse","Whether the mounting hardware percentages sourced from overseas cost guides transfer to NZ landed pricing","Quoted bill of materials for 60 panels - suppliers to ring: Ideal Electrical (Clenergy NZ), Smiths NZ, Dimond Structural, Steel & Tube, Landmark Consultants, Stable Structure"]},{"run":"r3","low":null,"high":null,"resolved_from":"qv","confidence":"low","basis":"Overall lump sum NOT established: two of the three requested parts (mounting system, design fee) have no published source. Strengthening component alone bands at $3,200-6,000 GST exclusive Auckland, built from QV rows t7:r6/t7:r26 (30-36 m purlin), t2:r45/t2:r46 (18-26 kg cleats), t2:r2 (20% small-quantity uplift) and t0:r31 (retrofit labour premium, hours by judgement). Drops toward $1,400 low if the t7 rate already includes site erection.","components":[{"role":"proprietary rails, clamps, brackets and fixings","row_id":null,"source":null,"unit":"sum","amount":{"low":null,"high":null},"centre":"Auckland","caveat":"QV CostBuilder has no PV mounting rows whatsoever; 8 query variants returned only solar blinds and louvres. No NZ supplier published a retrievable price. Whole-system commercial figures ($1,400-1,800/kW installed, solarscout.co.nz) cannot be decomposed to mounting-only without inventing a percentage."},{"role":"installation labour, mounting system only","row_id":null,"source":null,"unit":"sum","amount":{"low":null,"high":null},"centre":"Auckland","caveat":"Not separable from the unpriced mounting package; bracket count at Auckland high wind zone is the driver and is not established."},{"role":"supplementary purlin, galvanised, bolted to steel","row_id":"52d4a068b2aced2722dab3e921b35879d1a60fc34fe3b6d61a4a3aec5c10b994:t7:r6","source":null,"unit":"m","amount":{"low":26.3,"high":38.3},"centre":"Auckland","caveat":"Range spans HST 150/15 ($26.30) at t7:r6 to DHS 200/18 ($38.30) at t7:r26; section not designed. Row states 'bolted to steel, excluding bolts' - QV does not state whether site erection labour is included. UNREVIEWED."},{"role":"purlin cleats","row_id":"52d4a068b2aced2722dab3e921b35879d1a60fc34fe3b6d61a4a3aec5c10b994:t2:r45","source":null,"unit":"kg","amount":{"low":20.8,"high":38.6},"centre":"Auckland","caveat":"Low = 120 hr fab/tonne (t2:r45), high = 250 hr fab/tonne (t2:r46). Shop-fabrication new-build rates, not site retrofit through an existing roof. UNREVIEWED."},{"role":"small quantity uplift, steelwork below 1000 kg","row_id":"52d4a068b2aced2722dab3e921b35879d1a60fc34fe3b6d61a4a3aec5c10b994:t2:r2","source":null,"unit":"percent","amount":{"low":20,"high":20},"centre":"Auckland","caveat":"Published against the Major Steel Works table, applied by judgement to the Proprietary Purlins package (~150 kg total). UNREVIEWED."},{"role":"retrofit access and working-over-existing-roof premium","row_id":"eb0a74bf1a2048f73c2f6f997f7b8674d2646a00874236613c599b2dd62087c8:t0:r31","source":null,"unit":"hour","amount":{"low":91.5,"high":91.5},"centre":"Auckland","caveat":"Steel Erector rate is a QV row; the 20-34 man-hour allowance is my judgement, not published. Risks double-counting labour already inside the t7 purlin rate. Strike this first on review."},{"role":"structural engineer design and PS1 to AS/NZS 1170","row_id":null,"source":"https://www.acenz.org.nz/knowledge-hub/producer-statements/","unit":"sum","amount":{"low":null,"high":null},"centre":"Auckland","caveat":"QV publishes no consultant fees; only reference is an exclusion note on underpinning (1c23e19067b6cad9d69a8c660e34f046fe69efae7d8be73b0f3e711626fac154:t5:r2). ACE NZ and Auckland Council document the PS1 process but publish no fee. Available NZ rate data is employee salary, not consulting chargeout."}],"not_established":["proprietary rail, clamp and bracket package for 60 modules on 0.55mm trapezoidal sheet - no QV row, no retrievable NZ published price","bracket/clamp spacing and count for Auckland high wind zone - governs the mounting price, needs the supplier's wind calc","installation labour for the mounting system only","structural engineer design fee and PS1 for a 30 kWp rooftop array, Auckland","hold-down capacity of the existing 0.55mm sheet ribs to clamped brackets - determines whether non-penetrating mounting is viable at all on this roof","supplementary purlin section size and actual s ns the mounting price, needs the supplier's wind calc","hold-down capacity of the existing 0.55mm sheet ribs to clamped brackets - determines whether non-penetrating mounting is viable at all on this roof","installation labour for the mounting system only","proprietary rail, clamp and bracket package for 60 modules on 0.55mm trapezoidal sheet - no QV row, no retrievable NZ published price","structural engineer design fee and PS1 for a 30 kWp rooftop array, Auckland","supplementary purlin section size and actual strengthened footprint geometry - quantity of 30-36 m is derived from 0.83 m/m2 at 1200 crs, not from a design"],"review":{"state":"pending","decision":null,"reviewer":null,"note":null,"decided_at":null},"record_sha256":"ff7b04d192c9747e"},{"scenario_id":"facade-coating-application","title":"Facade and soffit coating","family":"envelope","unit":"m2","claims_covered":9,"status":"disputed","range":{"min":41,"max":76},"consensus":{"low":43,"high":71},"agreement":{"low_ratio":1.39,"high_ratio":1.134,"runs_with_band":3,"runs_total":3},"currency":"NZD","gst_basis":"exclusive","centre":"Auckland","as_of":"2026-09-22","basis":"QV build-up: prep t4:r13/r14 weighted 480 wall / 120 soffit = 17.48; coating t8:r3 soffit-loaded 13% = 29.34 at the low end, or t16:r2 high-build at 45.80 at the top; height adder t5:r3 = 3.00; EWP t8:r11-r15 over 15 working days = 5.05-6.68; mobile scaffold t10:r46 3 weeks = 1.99. Masking, protection and clean-up NOT included in either end - add roughly 5/m2 if allowed. Water blast t4:r19 not stacked, to avoid double-counting the wash inside t4:r13. Wellington runs about 8-10 percent lower on labour-bearing rows, roughly 52-70/m2. Over 600m2 Auckland: 34,200-45,600. This brackets the pinned band 52-76 but sits higher at the midpoint (~66 vs the pinned 62), driven by QV's prep row at 17.48 against the pinned 12.","pinned_scope":"SCENARIO\nid: facade-coating-application-pinned\ntitle: Facade and soffit coating\nfamily: envelope\ncatalogue unit: m2 (per square metre of coated face area, measured flat, no deduction under 0.5 m2)\n\nSCOPE - FIXED. Do not substitute your own.\n  substrate:        existing solid plaster over concrete block, sound and previously painted\n  nominal quantity: 600 m2 of coated area on one building - 480 m2 wall face plus 120 m2 soffit\n  building height:  3 levels, 9.5m to the highest coated line\n  coating system:   100% acrylic, low-sheen, elastomeric-modified exterior wall coating\n                    (Resene X-200 grade or equal), 2 finish coats at 35 microns DFT each\n                    over 1 coat solvent-borne acrylic sealer to bare or chalked areas\n  colour / tint:    one mid-tone colour, standard tint base, light-reflectance value 40-60%\n                    (no deep-base, no two-tone banding, no feature colour)\n  preparation:      water blast to 3000 psi, spot-scrape flaking paint to 5% of area,\n                    fill and sand cracks to 2mm width over 60 lineal metres total\n  access:           mobile aluminium scaffold and a 13m knuckle-boom EWP, 3 weeks on site\n\nINCLUDED, amortised over the 600 m2 where not already per-unit:\n  - water blast, scrape, sand and dust-off of the full 600 m2\n  - crack fill and sand, 60 lineal metres\n  - sealer coat to bare and chalked areas (assume 15% of area)\n  - two finish coats to the full 600 m2, sprayed with back-roll to walls, sprayed to soffits\n  - EWP hire, delivery and pickup, 3 weeks, amortised across the 600 m2\n  - mobile scaffold hire for low-level and soffit work, amortised across the 600 m2\n  - masking and protection of windows, joinery and ground surfaces, and daily clean-up\n  - paint, sundries, drop sheets and waste-water containment on site\n\nEXCLUDED - do not price:\n  - GST, preliminaries, margin, design and consent fees\n  - lead or asbestos-containing paint testing, containment or removal\n  - plaster repair, re-rendering, remedial weathertightness work or sealant replacement\n  - fixed or shrink-wrapped scaffold, gantries, or traffic and pedestrian management\n  - coating of steel panel, metal roofing, joinery, handrails or downpipes\n  - anti-graffiti coating, anti-carbonation systems, or third and subsequent coats\n\n**Band: $52 - $76 /m2, midpoint $62 /m2**\n**Total for the 600 m2 nominal quantity: $31,200 - $45,600, midpoint $37,200**\n\nAudit of the midpoint:\n\n| Component | $/m2 | Total over 600 m2 |\n|---|---|---|\n| Preparation (blast, scrape, sand, crack fill) | 12 | 7,200 |\n| Sealer to 15% of area | 3 | 1,800 |\n| Two finish coats, applied | 30 | 18,000 |\n| EWP, 3 weeks at ~$1,400/wk + delivery | 8 | 4,800 |\n| Mobile scaffold, 3 weeks | 4 | 2,400 |\n| Masking, protection, clean-up | 5 | 3,000 |\n\nDrivers of the spread: soffit work runs 20-30% slower than wall face, so a job with more soffit sits at the top; a substrate needing sealer over 40% rather than 15% adds $5-6/m2; and a sub-300 m2 job cannot amortise the access plant and lands above $76/m2.","runs":[{"run":"r1","low":57,"high":76,"resolved_from":"qv","confidence":"medium","basis":"QV build-up: prep t4:r13/r14 weighted 480 wall / 120 soffit = 17.48; coating t8:r3 soffit-loaded 13% = 29.34 at the low end, or t16:r2 high-build at 45.80 at the top; height adder t5:r3 = 3.00; EWP t8:r11-r15 over 15 working days = 5.05-6.68; mobile scaffold t10:r46 3 weeks = 1.99. Masking, protection and clean-up NOT included in either end - add roughly 5/m2 if allowed. Water blast t4:r19 not stacked, to avoid double-counting the wash inside t4:r13. Wellington runs about 8-10 percent lower on labour-bearing rows, roughly 52-70/m2. Over 600m2 Auckland: 34,200-45,600. This brackets the pinned band 52-76 but sits higher at the midpoint (~66 vs the pinned 62), driven by QV's prep row at 17.48 against the pinned 12.","components":[{"role":"preparation - wash, cut out cracks, make good, walls","row_id":"a4bbf7211339ad80044429f4a2aa721d5ac5c61f6fe4a34f6afb9ccae5475570:t4:r13","source":null,"unit":"m2","amount":{"low":13.2,"high":16.0},"centre":"WLG low / AKL high","caveat":"Unreviewed QV row. Already includes washing - do not also add the water-blast row at full value. Scope silent on 3000 psi pressure and on spot-scraping flaking paint."},{"role":"preparation - same, soffits/ceilings","row_id":"a4bbf7211339ad80044429f4a2aa721d5ac5c61f6fe4a34f6afb9ccae5475570:t4:r14","source":null,"unit":"m2","amount":{"low":19.2,"high":23.4},"centre":"WLG low / AKL high","caveat":"Unreviewed. Ceiling row used as soffit proxy; QV publishes no exterior soffit prep row."},{"role":"water blast, exterior clean, min 200m2","row_id":"a4bbf7211339ad80044429f4a2aa721d5ac5c61f6fe4a34f6afb9ccae5475570:t4:r19","source":null,"unit":"m2","amount":{"low":8.0,"high":9.4},"centre":"WLG low / AKL high","caveat":"Unreviewed. Overlaps the washing already inside t4:r13/r14 - stacking both double-counts by roughly 6-9/m2. Row sits under a 'Strip Existing Wallpaper' parent label, a likely data artefact."},{"role":"coating - three coats acrylic, exterior wall, one face","row_id":"ad97526a9f2e9df8f44acad2f5da73798cfee57e55cb5d96bb1c070094ea1f25:t8:r3","source":null,"unit":"m2","amount":{"low":24.5,"high":28.6},"centre":"WLG low / AKL high","caveat":"Unreviewed elemental new-work rate, plain acrylic not elastomeric-modified. Three coats vs the scenario's sealer to 15% plus two finish coats. Alternative to t16:r2, never additive to it."},{"role":"coating alternative - Flexicote high-build acrylic 3-coat system to concrete, plaster or blockwork, plain finish","row_id":"a4bbf7211339ad80044429f4a2aa721d5ac5c61f6fe4a34f6afb9ccae5475570:t16:r2","source":null,"unit":"m2","amount":{"low":45.8,"high":45.8},"centre":"AKL/WLG/CHC same","caveat":"Unreviewed. Nearest published analogue to an elastomeric-modified high-build system, but a specialist applied system on new substrate, not a repaint. Alternative to t8:r3, never additive."},{"role":"height and access productivity adder, working off scaffolding, not exceeding 9m","row_id":"a4b xport-limit relay package with CTs configured for zero export, and inverter interface - no NZ published price; ring solar distributors or SolarEdge/Fronius NZ channel","Export-limit relay, CT set and inverter interface - QV publishes no PV or AS/NZS 4777.2 items; only non-NZ vendor indications found on the web","Export-limit relay, CT set and zero-export controller - no QV row; NZ resellers (Taspac, Scott Electrical, Advance Electrical, Go Active) publish trade-login prices only","Out-of-hours / penal electrician labour rate - QV Labour Rates table t0 publishes ordinary time only","Penal / out-of-hours labour multiplier - QV Labour Rates table publishes straight time only","Switchboard relabelling as a discrete rate - absorbed into electrician hours","Vector Auckland DG application and connection charges for >10kW - no published schedule; per-case network study (excluded by scope in any event)","Whether QV table t1 lower block (r37-r63) is supply-only or supply-and-install; the sub-heading is not carried in the row text and this materially moves the board line","Whether QV table t1 rows r37-r63 are distribution boards rather than main switchboards - block header not present in indexed row text"],"review":{"state":"pending","decision":null,"reviewer":null,"note":null,"decided_at":null},"record_sha256":"1fccc0a0a3819da4"},{"scenario_id":"switchboard-fault-rating-protection","title":"Switchboard fault rating and protection","family":"electrical","unit":"ea","claims_covered":9,"status":"not_established","range":null,"consensus":null,"agreement":{"low_ratio":null,"high_ratio":null,"runs_with_band":0,"runs_total":3},"currency":"NZD","gst_basis":"exclusive","centre":"Auckland","as_of":"2026-09-22","basis":null,"pinned_scope":"SCENARIO\nid: switchboard-fault-rating-protection-pinned\ntitle: Switchboard fault rating and protection\nfamily: electrical\ncatalogue unit: ea (one existing main switchboard, fault-rated and re-protected)\n\nSCOPE - FIXED. Do not substitute your own.\n  board:            existing main switchboard, 400A TP&N 415V, floor-mounted indoor\n                    plantroom board, Form 3b segregation, IP41, 3-storey Auckland office\n  supply:           300 kVA padmount transformer, 15m of 2 x 185mm2 Cu tails,\n                    assessed prospective fault current 18 kA at the board\n  bracing target:   busbar, droppers and chassis braced to Icw 25 kA for 1 second\n  incomer:          1 x 400A MCCB, Icu 36 kA at 415V, LSI electronic trip unit\n  outgoing ways:    12 MCCBs - 4 x 250A and 8 x 100A, all Icu 36 kA, thermal-magnetic\n  nominal quantity: ONE board, 13 devices total (1 incomer + 12 outgoing ways)\n  access:           ONE 8-hour weekend shutdown, board de-energised, no live work\n\nINCLUDED, amortised over the nominal quantity where not already per-unit:\n  - fault level assessment: network data request, PSCC calculation and report\n  - protection coordination and discrimination study across all 13 devices,\n    to AS/NZS 3000 using manufacturer let-through curves\n  - chartered electrical engineer's design and PS1 for the protection scheme\n  - busbar bracing upgrade: new insulated busbar supports, spreaders, chassis stiffening\n  - supply and install 13 MCCBs, reusing existing cable lugs and terminations\n  - trip unit settings applied, secondary injection testing, insulation resistance test\n  - updated board schedule, protection settings schedule and as-built schematic\n  - the single weekend shutdown, isolation, lock-out and re-energisation\n\nEXCLUDED - do not price:\n  - GST, preliminaries, margin, consent and network application fees\n  - new enclosure, new cubicle, extension or full switchboard replacement\n  - sub-main or outgoing cable replacement, or re-termination beyond existing lugs\n  - arc flash hazard study, incident-energy labelling or arc-rated PPE\n  - temporary generator, UPS or any alternative supply during the shutdown\n  - asbestos or lead paint removal, switchroom building or fire-rating work\n  - power factor correction, metering, transformer or network-side upgrades\n\nGive the band as $/ea for this exact scope, broken into the fault study and design fee,\nthe busbar bracing upgrade and the 13 protection devices supplied and installed, so a\nreviewer can reject one part without the others. State the total for the one board and\nthe implied rate per protection device, so the amortisation is auditable.\n\nPrice it, or tell us honestly why you cannot.","runs":[{"run":"r1","low":null,"high":null,"resolved_from":"qv+web","confidence":"low","basis":"Not established. Two of the three requested parts (fault study + coordination + PS1 fee, and the busbar bracing upgrade to Icw 25kA/1s) have no published price in QV CostBuilder or anywhere on the NZ web, and the 400A LSI incomer has only a single lower-tier proxy point with no upper bound. Only the 12 outgoing ways are established: $11,640-$18,767 ex GST supply only, implying $970-$1,564 per outgoing device as material. Adding the one published incomer point gives $13,744 as a floor on 13 devices supply-only, i.e. $1,057/device, with the top open. No total for the board is stated because it cannot be built from published data without inventing the two missing parts.","components":[{"role":"outgoing ways, 8 x 100A 3P 36kA thermal-magnetic MCCB, supply only","row_id":null,"source":"https://nz.rs-online.com/web/p/mccbs/8319172 ; https://express.ecsnz.com/en/abb-xt1n-mccb-100a","unit":"ea (8 off)","amount":{"low":4648,"high":7312},"centre":"Auckland","caveat":"Two published NZ vendors for the same ABB part number 1SDA067416R1 differ by 57% ($581.05 vs $914.00). Single-unit web-shop prices, not trade net on a 13-device order. Supply only, no install."},{"role":"outgoing ways, 4 x 250A 3P 36kA thermal-magnetic MCCB, supply only","row_id":null,"source":"https://express.ecsnz.com/en/abb-xt3n-mccb-250a ; https://nz.rs-online.com/web/p/mccbs/2546357","unit":"ea (4 off)","amount":{"low":6992,"high":11455},"centre":"Auckland","caveat":"Low is ABB XT3N 250 TMD (ECS NZ, listed 'on request'), high is Schneider ComPacT NSX250F C25F3TM250 (RS NZ). Different brands, both 36kA at 415VAC. Supply only."},{"role":"incomer, 1 x 400A 3P MCCB Icu 36kA with LSI electronic trip, supply only","row_id":null,"source":"https://express.ecsnz.com/en/ts400n-ets33-3p-400a-65ka-mccb963-963","unit":"ea","amount":{"low":2104,"high":null},"centre":"Auckland","caveat":"Single published point and it is a proxy: LS Susol TS400N ETS33 is a 65kA frame, not 36kA, and a lower brand tier than the Schneider NSX400N MicroLogic or ABB XT5N Ekip Dip LSI the scope implies. No NZ published price found for either of those. Upper bound not established."},{"role":"install labour, one 8-hour weekend shutdown","row_id":"77a9ea2e8b0f174651de8bdceb3c87c8c288ba10a5f707ee5c36267bf7395a8e:t0:r10","source":null,"unit":"hour","amount":{"low":83.65,"high":83.65},"centre":"Auckland","caveat":"UNREVIEWED QV row, hourly rate only, ordinary time. QV publishes no weekend, shutdown or overtime loading. 2 electricians x 8 hr = $1,338 ex GST is my arithmetic on my own assumed crew and hours, not a QV price for this work. Excludes secondary injection test set and tester, and excludes the 13 device installations themselves."},{"role":"QV reference only - NOT a price for this scope","row_id":"ac5fef027b3b97701b4e6d5f0228aeef6bc2088d99f06141256ba95cd2e107b0:t29:r37","source":null,"unit":"ea","amount":{"low":257,"high":257},"centre":"Auckland","caveat":"UNREVIEWED. MCB 415V 50-63A triple pole 4.5kA - a DIN-rail MCB at 4.5kA, not a 36kA MCCB. QV has no MCCB rows at any rating. Listed so a reviewer can see what QV does and does not hold. Do not substitute into this scope."}],"not_established":["fault level assessment, PSCC calculation and report - no NZ published fee","protection coordination and discrimination study across 13 devices to AS/NZS 3000 - no NZ published fee; only North American arc-flash study figures exist and those cover an excl a256":"8fc979de4e43657a"},{"scenario_id":"concrete-paving-slab","title":"External concrete paving and slabs","family":"civil","unit":"$/m2 of finished slab","claims_covered":8,"status":"agreed","range":{"min":175,"max":240},"consensus":{"low":190,"high":240},"agreement":{"low_ratio":1.2,"high_ratio":1.091,"runs_with_band":3,"runs_total":3},"currency":"NZD","gst_basis":"exclusive","centre":"Auckland","as_of":"2026-09-22","basis":"SE92 mesh reading. Span of two independent QV routes: Route A adjusts composite row f0968d72...:t3:r3 to the stated scope (213.55-236.78/m2); Route B builds up from discrete QV component rows (190.18-199.16/m2). 300 m2 total 57,000-72,000, midpoint ~215/m2 / ~64,500. Routes disagree by 20-40/m2 because Route B's placing-and-screeding line is derived rather than published. If the mesh is 665 rather than SE92 the band becomes 158-205/m2 (47,400-61,500). Excludes GST, preliminaries, margin, design, engineering and consent fees, bulk earthworks, drainage, sealers, kerbs, thickened edges, dowels, demolition, traffic management and dewatering per scope.","pinned_scope":"SCENARIO\nid: concrete-paving-slab-pinned\ntitle: External concrete paving and slabs\nfamily: civil\ncatalogue unit: m2 (per square metre of finished slab, measured on plan)\n\nSCOPE - FIXED. Do not substitute your own.\n  slab:             150mm thick reinforced concrete, 25 MPa, 19mm aggregate, 100mm slump\n  reinforcement:    SE92 mesh (665 grade), single layer, 40mm bottom cover on bar chairs\n  subbase:          150mm GAP40 hardfill, compacted to 95% MDD, on trimmed subgrade\n  finish:           broomed non-slip finish, wood float edges, cured with sprayed curing compound\n  joints:           sawcut control joints at 4.0m centres both ways, 1/4 slab depth,\n                    plus one isolation joint strip at the building interface\n  falls:            1:100 falls to design levels, formed by subgrade profiling\n  nominal area:     300 m2 in one pour area, roughly 20m x 15m, level open site,\n                    truck access to the pour face\n\nINCLUDED, amortised over the 300 m2 where not already per-m2:\n  - concrete supply, place, screed, finish and cure\n  - SE92 mesh, chairs, laps and tying\n  - 150mm GAP40 subbase, supplied, spread and compacted\n  - trim and compact existing subgrade to level, cart of trim spoil\n  - edge formwork to the slab perimeter, set, strip and clean\n  - sawcutting of all control joints and the isolation joint filler\n  - concrete pump hire for the pour, amortised across the 300 m2\n  - set out and level control to the design falls\n\nEXCLUDED - do not price:\n  - GST, preliminaries, margin, design, engineering and consent fees\n  - bulk earthworks, cut/fill, undercut of soft spots or imported fill below the subbase\n  - drainage, sumps, channel drains, service trenching or ducts under the slab\n  - sealer, hardener, line marking, kerbs, thickened edges or dowelled construction joints\n  - demolition or removal of any existing surface\n  - traffic management, dewatering, contaminated spoil\n\nGive the band as $/m2 of finished slab for this exact scope, and state the total for the\n300 m2 so the amortisation is auditable.\n\n---\n\n**PRICE \u2014 Auckland, Q3 2026, subcontract rate, excl. GST**\n\n| Component | $/m2 | 300 m2 total |\n|---|---|---|\n| Subgrade trim + 150mm GAP40 subbase | $28 \u2013 $38 | $8,400 \u2013 $11,400 |\n| Concrete supply (150mm + 5% waste, 25 MPa) | $46 \u2013 $56 | $13,800 \u2013 $16,800 |\n| Place, screed, broom finish, cure | $38 \u2013 $50 | $11,400 \u2013 $15,000 |\n| SE92 mesh, chairs, tying | $15 \u2013 $19 | $4,500 \u2013 $5,700 |\n| Edge formwork (70 lm over 300 m2) | $7 \u2013 $10 | $2,100 \u2013 $3,000 |\n| Sawcut joints (~150 lm) + isolation strip | $5 \u2013 $7 | $1,500 \u2013 $2,100 |\n| Pump hire, one pour | $6 \u2013 $8 | $1,800 \u2013 $2,400 |\n| Set out and level control | $3 \u2013 $4 | $900 \u2013 $1,200 |\n\n**Band: $148 \u2013 $192 /m2. Midpoint $170 /m2.**\n**300 m2 total: $44,400 \u2013 $57,600. Midpoint $51,000.**\n\nTwo amortisation checks a reviewer can run: pump hire is a ~$1,800\u2013$2,400 day rate divided by 300, so it collapses to ~$7/m2 and would roughly double at 150 m2. Edge formwork is ~70 lineal metres at $30\u2013$43/lm \u2014 it scales with perimeter, not area, so a long thin slab of the same area prices higher.\n\nConfidence: good. This is a high-volume, well-tendered trade in Auckland with stable published rates. The band widens to roughly $135\u2013$230/m2 once area drops below 150 m2 or access forces barrow/line-pump placement.","runs":[{"run":"r1","low":190,"high":240,"resolved_from":"qv","confidence":"medium","basis":"SE92 mesh reading. Span of two independent QV routes: Route A adjusts composite row f0968d72...:t3:r3 to the stated scope (213.55-236.78/m2); Route B builds up from discrete QV component rows (190.18-199.16/m2). 300 m2 total 57,000-72,000, midpoint ~215/m2 / ~64,500. Routes disagree by 20-40/m2 because Route B's placing-and-screeding line is derived rather than published. If the mesh is 665 rather than SE92 the band becomes 158-205/m2 (47,400-61,500). Excludes GST, preliminaries, margin, design, engineering and consent fees, bulk earthworks, drainage, sealers, kerbs, thickened edges, dowels, demolition, traffic management and dewatering per scope.","components":[{"role":"base composite - 25MPa 150mm slab on 150mm hardfill, pumped, edge formwork, mesh","row_id":"f0968d722af3d033d91c79c47fe7ecbea989e5abaecc3422c66d853ac075ca53:t3:r3","source":null,"unit":"m2","amount":{"low":199,"high":199},"centre":"Auckland","caveat":"Unreviewed QV row. Includes polythene vapour barrier and 25mm sand blinding (both out of scope, deducted) and power float rather than broom. Reinforcement is Economesh, not SE92. Excludes sawcut joints, curing compound and subgrade trim to falls. Formwork assumed at 0.4 lm/m2 vs actual 0.233 lm/m2."},{"role":"reinforcement - SE92 mesh supply","row_id":"d31e428f9f70fc099d Auckland","caveat":"Unreviewed and explicitly a RETAIL supply rate. A 47 m3 commercial order will be bought below this. 100mm slump not specified in the row. 0.15 m3 + 5% waste = 53.24/m2."},{"role":"broom finish","row_id":"3012e40c988aa035c47e34ff2ff827c2bcb29af24240a7bd826ab798d7476014:t6:r4","source":null,"unit":"m2","amount":{"low":9,"high":9},"centre":"Auckland","caveat":"Unreviewed. Broom finish U5. Wood float edges would be row :t6:r6 (12.80/m2) if measured separately; taken as within the broom labour here. Non-slip performance not stated."},{"role":"curing compound sprayed","row_id":"3012e40c988aa035c47e34ff2ff827c2bcb29af24240a7bd826ab798d7476014:t10:r3","source":null,"unit":"m2","amount":{"low":3.1,"high":4.1},"centre":"Auckland","caveat":"Unreviewed. Low end Antisol E (3.10), high end Rendacure :t10:r2 (4.10). Both at 1 litre/6m2."},{"role":"edge formwork to slab perimeter","row_id":"15a23f8a873157dfec6a6eca2ff324908388517417e9eec426ab050f7d825a80:t2:r28","source":null,"unit":"m","amount":{"low":65,"high":65},"centre":"Auckland","caveat":"Unreviewed and an UPPER BOUND: this is F4-finish formwork to edges of slabs not exceeding 100mm high, dearer than a paving edge form. QV publishes no rough edge-form rate for external paving. 70 lm over 300 m2 = 0.233 lm/m2 = 15.15/m2."},{"role":"sawcut control joints","row_id":"3012e40c988aa035c47e34ff2ff827c2bcb29af24240a7bd826ab798d7476014:t17:r35","source":null,"unit":"m","amount":{"low":2.2,"high":2.2},"centre":"Auckland","caveat":"Unreviewed. 40mm deep (1/4 of 150mm = 37.5mm), rate based on 100m runs using a floor saw. 120 lm measured = 4 joints x 15m + 3 joints x 20m = 264 total = 0.88/m2."},{"role":"isolation joint at building interface","row_id":"3012e40c988aa035c47e34ff2ff827c2bcb29af24240a7bd826ab798d7476014:t14:r10","source":null,"unit":"m","amount":{"low":12.4,"high":27.2},"centre":"Auckland","caveat":"Unreviewed. Low end LUMBERLOK Krack-mate crack inducer (12.40), high end :t14:r7 10mm expansion joint with
