25MPa concrete supply rate for a 47 m3 order - QV publishes Retail supply rates only","Compaction standard for the GAP40 subbase row - 95% MDD is not stated in d2f84025...:t8:r12.","Compressible filler-board isolation joint strip (Abelflex-type) - no QV row; priced by proxy from sealed expansion-joint rows","Discrete concrete placing and screeding labour for slab-on-grade - QV publishes only in-place composites (3012e40c...:t2:r8, Reinforced Concrete 20MPa slabs and thickening on hardfill, AKL 479/m3) which cannot be combined with the separate supply and mesh rows without double counting. Route B's 23-30/m2 for this line is derived, not published.","Edition date of the indexed QV rates - no escalation to Q3 2026 applied","Escalation to Q3 2026 - the QV rows carry no date stamp readable from the row data. No escalation has been applied. Add it if your QV edition predates Q3 2026.","Mesh grade, curing content and edge-formwork content inside the base paving row f8d9cf...:t6:r5 - QV does not publish the make-up, so the uplift lines carry double-count risk","Rough (non-F4) edge formwork rate for external paving - not published; the F4 rate at 65/lm is carried as an upper bound.","Sawcutting subcontractor callout or site minimum charge - QV publishes per-metre rates based on 100m runs only","Set out and level control as a measured item - sits in Preliminaries, built up from the carpenter labour rate instead","Set out and level control to the design falls - no QV row found; not included as a number in either route. Either inside the Route A composite's labour content or needs a separate allowance from the Labour Rates section (68 rows) or Preliminaries / Plant Hire Rates.","Whether QV composite rates are subcontract-inclusive or main-contract level - not stated in the row data, so the 'subcontract rate' basis requested cannot be confirmed.","Whether QV mesh rates d31e428...:t3 include laps and tying","Wood float edge treatment as a separate linear item - QV's wood float row is a whole-area rate"],"review":{"state":"pending","decision":null,"reviewer":null,"note":null,"decided_at":null},"record_sha256":"f45878a8a4efc83e"},{"scenario_id":"door-hardware-sets","title":"Door hardware set installation","family":"joinery","unit":"ea (per door leaf)","claims_covered":8,"status":"disputed","range":{"min":1520,"max":2500},"consensus":{"low":1790,"high":2090},"agreement":{"low_ratio":1.283,"high_ratio":1.22,"runs_with_band":3,"runs_total":3},"currency":"NZD","gst_basis":"exclusive","centre":"Auckland","as_of":"2026-09-22","basis":"Sum of QV Hardware rows (lockset aggregate, closer, hinges, door stop) plus QV carpenter labour, 2026 AKL, GST exclusive, no preliminaries or margin. EXCLUDES the restricted cylinder uplift, master-keying setup and key cutting, and any ball-bearing hinge uplift - none of which are published. 25 leaves = 38,000-52,250. All QV rows unreviewed; the lockset and closer rows are read as supply-and-fix because QV titles its supply-only tables explicitly, and these are not so titled.","pinned_scope":"SCENARIO\nid: door-hardware-sets-pinned\ntitle: Door hardware set installation\nfamily: joinery\ncatalogue unit: ea (per door leaf, one complete hardware set fitted to that leaf)\n\nSCOPE - FIXED. Do not substitute your own.\n  door leaf:        2040 x 820 x 45mm solid core timber leaf, already hung in a\n                    steel-reinforced timber jamb, prepped morticed and drilled\n  set type:         internal office/corridor single leaf, non-fire-rated\n  lockset:          mortice lockset, ANSI/BHMA Grade 2 equivalent commercial duty,\n                    60mm backset, lever-on-rose furniture both sides, key outside /\n                    turn-snib inside, 6-pin restricted-keyway cylinder\n  closer:           surface-mounted overhead closer, EN 1154 size 3, adjustable\n                    power EN 2-4, fixed arm, fitted to pull side\n  hinges:           3 no. 100 x 75 x 3.0mm ball-bearing butt hinges\n  finish:           satin stainless steel (SSS / 316-grade look) throughout, all\n                    items matched to one finish family\n  nominal quantity: 25 leaves, one building, one floor, one visit\n\nINCLUDED, amortised over the 25 leaves where not already per-unit:\n  - supply of lockset, cylinder, lever furniture, closer and hinges as specified\n  - installation labour: fit lock body, cylinder, furniture, hinges, closer and\n    closer soffit/backplate, to an already-hung and pre-morticed leaf\n  - adjust, lubricate and test the closer sweep and latch speed\n  - door stop (floor or wall mounted), 1 per leaf\n  - keying to a single master-key system, cylinders keyed and stamped off site\n  - registered key cutting, 3 keys per cylinder, plus master keys amortised over 25\n  - site setup, hardware schedule check-off and handover of keys and warranties,\n    amortised over 25\n\nEXCLUDED - do not price:\n  - GST, preliminaries, margin, design, consent fees\n  - the door leaf, frame, hanging, and any morticing or machining of the leaf or jamb\n  - access control: readers, electric strikes, mag locks, power supplies, cabling\n  - fire-rated or smoke-seal hardware, intumescent kits, hold-open devices\n  - roller door, sliding, security-grille or panic/exit hardware (separate scenario)\n  - scaffolding, access equipment, making good paint or finishes\n\n---\n\n## Price\n\n**Band: $620 \u2013 $880 per leaf** (mid-point ~$740/ea), excl. GST, Auckland, 2026.\n\n| Component | $/leaf (mid) |\n|---|---|\n| Mortice lockset + lever furniture, SSS, Grade 2 commercial | 195 \u2013 290 |\n| Restricted 6-pin cylinder, keyed to master system | 85 \u2013 130 |\n| Overhead closer, EN 1154 size 3, SSS cover | 150 \u2013 230 |\n| 3 no. ball-bearing hinges + door stop | 45 \u2013 70 |\n| Installation labour, 1.5 \u2013 2.0 hr @ $85 \u2013 $95/hr | 130 \u2013 190 |\n| Keying, key cutting, setup and handover, amortised over 25 | 15 \u2013 25 |\n\n**Total for the nominal 25 leaves: $15,500 \u2013 $22,000** (mid ~$18,500), excl. GST.\n\nAmortisation check: the only non-per-leaf items are the master-key system setup and the site setup/handover, together $375 \u2013 $625 across 25 leaves \u2014 that is the $15 \u2013 $25/leaf line. Everything else is genuinely per-leaf and does not vary with the run length.\n\nSensitivity worth knowing before you use this rate elsewhere: a fire-rated leaf adds roughly $120 \u2013 $200/ea (fire-rated closer, intumescent kit, certified hinges). A run of 5 leaves instead of 25 pushes the amortised line to ~$95/leaf, taking the band to roughly $700 \u2013 $960/ea.","runs":[{"run":"r1","low":1520,"high":2090,"resolved_from":"qv+web","confidence":"medium","basis":"Sum of QV Hardware rows (lockset aggregate, closer, hinges, door stop) plus QV carpenter labour, 2026 AKL, GST exclusive, no preliminaries or margin. EXCLUDES the restricted cylinder uplift, master-keying setup and key cutting, and any ball-bearing hinge uplift - none of which are published. 25 leaves = 38,000-52,250. All QV rows unreviewed; the lockset and closer rows are read as supply-and-fix because QV titles its supply-only tables explicitly, and these are not so titled.","components":[{"role":"mortice lockset, key outside / turn inside, lever furniture both sides, standard cylinder","row_id":"71bc04efae5d7c9ba5ecd40233e2c234903d07483870534a0433629fa2eb912f:t2:r6","source":null,"unit":"ea","amount":{"low":890,"high":1040},"centre":"Auckland","caveat":"Aggregate row: lock body + 502/514 furniture + standard cylinder. Low end is the vestibule alternative 71bc04ef...:t1:r7 at 890. Table not titled 'Supply Only' so read as supply-and-fix on QV convention - unverified. Do NOT add Door Furniture rows t12-t16 to this. Legge premium series, above the Grade 2 spec."},{"role":"overhead closer, surface mounted, strength adjustable EN2-4, fixed arm","row_id":"71bc04efae5d7c9ba5ecd40233e2c234903d07483870534a0433629fa2eb912f:t24:r2","source":"https://interioreffects.co.nz/product/lockwood-7724-standard-door-closure/","unit":"ea","amount":{"low":450,"high":800},"centre":"Auckland","caveat":"High end is QV LCN 1461 REG at 800 - QV publishes LCN only, a premium brand above spec. Low end derived from Lockwood 7724 EN2-4 listed 377 incl GST (approx 328 excl) plus fix and margin - web retail, not a trade quote. Finish is aluminium/designer cover in the QV row, not SSS."},{"role":"3 no. butt hinges, fixed pin, stainless, 100x75","row_id":"71bc04efae5d7c9ba5ecd40233e2c234903d07483870534a0433629fa2eb912f:t0:r11","source":null,"unit":"ea (3 off)","amount":{"low":117.6,"high":117.6},"centre":"Auckland","caveat":"SUPPLY ONLY - table explicitly titled so. 39.20 each x 3. QV publishes no ball-bearing hinge; BB in SS carries an uplift I could not establish. Fixing labour carried separately."},{"role":"door stop, 1 per leaf","row_id":"71bc04efae5d7c9ba5ecd40233e2c234903d07483870534a0433629fa2eb912f:t22:r6","source":null,"unit":"ea","amount":{"low":20.5,"high":51},"centre":"Auckland","caveat":"Low = wall mounted Sylvan DS24 SN (t22:r6, 20.50). High = floor mounted Miles Nelson 724/726 SS (t22:r4, 51.00) which matches the SSS finish family. Not titled Supply Only."},{"role":"fixing labour - hinges, closer adjust, latch speed, schedule check-off","row_id":"77a9ea2e8b0f174651de8bdceb3c87c8c288ba10a5f707ee5c36267bf7395a8e:t0:r5","source":null,"unit":"hour","amount":{"low":41,"high":81},"centre":"Auckland","caveat":"Carpenter 81.30/hr AKL, 0.5-1.0 hr allowed. Covers the supply-only hinges and the adjust/test/handover items only - lock and closer fixing assumed already inside their QV rows. If those rows turn out to be supply-only, add roughly 1.5-2.0 hr per leaf."},{"role":"restricted 6-pin cylinder, keyed to master system","row_id":null,"source":"https://www.assaabloy.com/nz/en/solutions/products/keying-systems-and-cylinders/lockwood-twin-high-security-restricted-keying-system","unit":"ea","amount":{"low":null,"high":null},"centre":"Auckland","caveat":"NOT ESTABLISHED. No published NZ price. This is an UPLIFT on the lockset row, not an addition - that row already carries a standard cylinder, which QV values at 49.90 in its deduct row 71bc04ef...:t7:r11."},{"role":"master-key system setup, registered key cutting 3 per cylinder, master keys","row_id":null,"source":"https://citylocksmiths.co.nz/keys/master-key-systems/","unit":"item, amortised over 25","amount":{"low":null,"high":null},"centre":"Auckland","caveat":"NOT ESTABLISHED. Locksmith-quoted, never published. Ring City Locksmiths, LockSmart or Armstrong Auckland."}],"not_established":["restricted 6-pin cylinder uplift over the standard cylinder already in the lockset row","master-key system design and setup charge","registered key cutting, 3 keys per cylinder plus master keys","ball-bearing hinge uplift over plain SS butt hinge - QV publishes plain only","satin stainless finish uplift on the closer - QV publishes aluminium/designer cover only","whether QV Hardware lock and closer tables are supply-and-fix or supply-only"]},{"run":"r2","low":1790,"high":2050,"resolved_from":"qv","confidence":"medium","basis":"Sum of QV CostBuilder rows t1:r7/r9 (lockset+furniture), t24:r2/r5 (overhead closer), t0:r11 x3 (hinges, supply only), t22:r6/r4 (door stop) plus 0.5-2.0 hr carpenter at labour row t0:r5, AKL column, GST exclusive, 2026. EXCLUDES the restricted cylinder and all master keying and key cutting, which are not established. Assumes the unlabelled QV tables (t1, t22, t24) are supply-and-fix; if supply-only, add ~$100-130/leaf. The QV closer rows are LCN units materially heavier and dearer than the EN 1154 size 3 closer specified, so the true conforming rate likely sits below this band. 25 leaves = $44,800-$51,300. The $620-880 figure carried in the brief is not supported by any QV row.","components":[{"role":"mortice lockset with lever furniture both sides, key outside / turn-snib inside","row_id":"71bc04efae5d7c9ba5ecd40233e2c234903d07483870534a0433629fa2eb912f:t1:r7","source":null,"unit":"ea","amount":{"low":830,"high":890},"centre":"Auckland","caveat":"UNREVIEWED QV row. Low end is sibling row t1:r9 (Classroom V31; 502/512). Row bundles lock body plus 502/514 furniture, so Door Furniture tables t12-t16 must NOT be added. Not stated as ANSI/BHMA Grade 2, not stated as SSS, backset not stated. Supply-only vs supply-and-fix not stated in the row."},{"role":"surface-mounted overhead closer, pull side","row_id":"71bc04efae5d7c9ba5ecd40233e2c234903d07483870534a0433629fa2eb912f:t24:r2","source":null,"unit":"ea","amount":{"low":800,"high":890},"centre":"Auckland","caveat":"UNREVIEWED QV row. High end is sibling t24:r5 (LCN 1461 CNS). QV publishes ONLY LCN closers with aluminium designer covers; no EN 1154 size 3 fixed-arm SSS-cover closer is published. The specified closer is a lighter, cheaper unit than any QV row, so this line is over-stated against the fixed scope."},{"role":"3 no. 100x75 ball-bearing butt hinges","row_id":"71bc04efae5d7c9ba5ecd40233e2c234903d07483870534a0433629fa2eb912f:t0:r11","source":null,"unit":"ea (3 no.)","amount":{"low":117.6,"high":117.6},"centre":"Auckland","caveat":"UNREVIEWED QV row, $39.20 each x 3. Table is explicitly SUPPLY ONLY. Row is a plain fixed-pin SS butt hinge, NOT ball-bearing and not stated as 3.0mm; a ball-bearing hinge sits above this rate and is not published in QV."},{"role":"door stop, 1 per leaf","row_id":"71bc04efae5d7c9ba5ecd40233e2c234903d07483870534a0433629fa2eb912f:t22:r6","source":null,"unit":"ea","amount":{"low":20.5,"high":51},"centre":"Auckland","caveat":"UNREVIEWED QV rows. Low = t22:r6 wall mounted Sylvan DS24 SN; high = t22:r4 floor mounted Miles Nelson 724/726 SS. Neither stated as 316/SSS."},{"role":"installation labour, adjust and test, hardware schedule check-off and handover","row_id":"77a9ea2e8b0f174651de8bdceb3c87c8c288ba10a5f707ee5c36267bf7395a8e:t0:r5","source":null,"unit":"hour","amount":{"low":81.3,"high":81.3},"centre":"Auckland","caveat":"UNREVIEWED QV row, Carpenter $81.30/hr  cylinder added as an upgrade net of QV's own standard-cylinder allowance so the lock rate is not double counted. No aggregate row combined with its own components \u2014 the lock row already bundles both-side furniture, so no Door Furniture row was added. 25 leaves = $48,750-$62,500. Note: QV's individual hardware rows test ~2x above current NZ trade supply on the one item that can be cross-checked (hinges), so a real supply-and-fix quote may land nearer $1,200-1,500/leaf; the band above is what QV as published supports.","components":[{"role":"mortice lockset + lever-on-rose furniture both sides, key outside / turn-snib inside","row_id":"71bc04efae5d7c9ba5ecd40233e2c234903d07483870534a0433629fa2eb912f:t1:r7","source":null,"unit":"ea","amount":{"low":890,"high":890},"centre":"Auckland","caveat":"Mortice Vestibule Lock, Vestibule V21/22 with 502/514 furniture; row bundles lock body + both-side furniture, so no separate furniture row may be added. Supply-only vs supply-and-fix not stated by QV. Unreviewed row."},{"role":"mortice lockset alternative, turn-exit function (upper bound)","row_id":"71bc04efae5d7c9ba5ecd40233e2c234903d07483870534a0433629fa2eb912f:t2:r6","source":null,"unit":"ea","amount":{"low":1040,"high":1040},"centre":"Auckland","caveat":"Mortice Combination Lock, Turn exit C23/24; 502/514. Closest QV function match to key-out/turn-in. Alternative to t1:r7, not additional. Unreviewed row."},{"role":"surface overhead closer, EN 1154 size 3 equivalent, fixed arm","row_id":"71bc04efae5d7c9ba5ecd40233e2c234903d07483870534a0433629fa2eb912f:t24:r2","source":null,"unit":"ea","amount":{"low":800,"high":800},"centre":"Auckland","caveat":"LCN 1461 REG, strength-adjustable, aluminium designer cover \u2014 not SSS; QV publishes no EN 1154 size rating and no SSS cover variant. Unreviewed row."},{"role":"3 no. butt hinges, 100x75 stainless, supply","row_id":"71bc04efae5d7c9ba5ecd40233e2c234903d07483870534a0433629fa2eb912f:t0:r11","source":"https://www.nzhardware.co.nz "group":"Door Stops","desc":"Floor mounted, Miles Nelson 724/726, SS","unit":"each","regional":{"Auckland":"51.00","Christchurch":"50.00","Dunedin":"48.00","Hamilton":"47.00","Palmerston North":"46.00","Wellington":"49.00"},"row_id":"71bc04efae5d7c9ba5ecd40233e2c234903d07483870534a0433629fa2eb912f:t22:r4","cited_by":1},{"url":"https://costbuilder.qv.co.nz/detailed-rates/hardware/hardware/","section":"Hardware / Mortice Sliding Door Locks","group":"Extended backset","desc":"Additional cylinder or amount to deduct from rates above if cylinder not required","unit":"each","regional":{"Auckland":"49.90","Christchurch":"49.90","Dunedin":"49.90","Hamilton":"49.90","Palmerston North":"49.90","Wellington":"49.90"},"row_id":"71bc04efae5d7c9ba5ecd40233e2c234903d07483870534a0433629fa2eb912f:t7:r11","cited_by":1}],"web_sources":["https://citylocksmiths.co.nz/keys/master-key-systems/","https://interioreffects.co.nz/product/lockwood-7724-standard-door-closure/","https://tradietools.nz/articles/locksmith-cost-nz/","https://www.allegion.co.nz/en/products/all/schlage-sr-restricted-keying-system.html","https://www.assaabloy.com/nz/en/solutions/products/keying-systems-and-cylinders/lockwood-twin-high-security-restricted-keying-system","https://www.locksmart.co.nz/commercial-locksmith-auckland/restricted-key-systems/","https://www.nzhardware.co.nz/product-group/38584-yale-sy10075bbss-100x75mm-ball-bearing-hinge-304-satin-stainless/category/508-hinges-stainless-steel"],"open_questions":["ANSI/BHMA Grade 2 equivalence for any QV lockset row \u2014 QV publishes no grading","Ball-bearing 3.0mm hinge as specified \u2014 QV lists fixed-pin SS only","EN 1154 size 3 / EN 2-4 power classification \u2014 QV publishes no EN rating for any closer","EN 1154 size 3 fixed-arm overhead closer with SSS cover (QV publishes only LCN units with aluminium designer covers)","Master-key system design and setup charge, and registered key cutting \u2014 not published by QV or by NZ suppliers at list price","Restricted 6-pin keyway cylinder \u2014 no QV row exists; web figure is indicative only","Satin stainless closer cover to match the finish family \u2014 QV prices only the aluminium designer cover","Whether QV's Mortice Lock, Door Closer and Door Stop tables are supply-only or supply-and-fix \u2014 unstated, and it swings the band by ~$120/leaf","ball-bearing butt hinge 100 x 75 x 3.0mm (QV publishes plain fixed-pin SS butt hinge only)","ball-bearing hinge uplift over plain SS butt hinge - QV publishes plain only","cylinder keying and stamping off site","master-key system design and setup","master-key system design and setup charge","registered key cutting, 3 keys per cylinder plus master keys","restricted 6-pin cylinder uplift over the standard cylinder already in the lockset row","restricted 6-pin cylinder, supply, keyed to master system","satin stainless / 316 finish premium across a matched hardware family","satin stainless finish uplift on the closer - QV publishes aluminium/designer cover only","whether QV Hardware lock and closer tables are supply-and-fix or supply-only","whether QV Hardware tables t1, t22 and t24 are supply-only or supply-and-fix"],"review":{"state":"pending","decision":null,"reviewer":null,"note":null,"decided_at":null},"record_sha256":"7da27e3c36e01e8e"},{"scenario_id":"glazed-vision-panel","title":"Glazed vision panel to door","family":"joinery","unit":"ea","claims_covered":8,"status":"agreed","range":{"min":1100,"max":1900},"consensus":{"low":1100,"high":1900},"agreement":{"low_ratio":1.0,"high_ratio":1.0,"runs_with_band":1,"runs_total":3},"currency":"NZD","gst_basis":"exclusive","centre":"Auckland","as_of":"2026-09-22","basis":"Per-panel build-up of QV rows for labour, edgework, beads, rehang and protection, plus an unpublished assumption for the 6mm monolithic fire-rated glass and the installer certificate. Excludes GST, preliminaries, margin, painting, consent fees and the leaf itself per scope. Dominated by the unpriced glass component, hence low confidence. Feasibility precondition: the leaf's own fire test evidence must cover a retrofitted 300x900 vision panel, or the -/30/30 rating cannot be maintained and this scope does not apply.","pinned_scope":"SCENARIO\nid: glazed-vision-panel-pinned\ntitle: Glazed vision panel to door\nfamily: joinery\ncatalogue unit: ea (one vision panel, cut framed and glazed into one door leaf)\n\nSCOPE - FIXED. Do not substitute your own.\n  door leaf:        44mm solid-core paint-grade flush leaf, 920 x 2040mm, -/30/30 fire\n                    rated, hung in an existing rated timber frame\n  panel size:       300 x 900mm clear vision opening, vertical, sighted at 1200mm AFFL\n  glass:            6mm monolithic fire-rated clear glazing to -/30/30 (Pyrostop /\n                    Contraflam class), Grade A safety glass, polished edges\n  beads:            hardwood fire-rated glazing beads both faces, intumescent seal to\n                    the rebate, beads primed ready for paint\n  work location:    SITE cut into an already-hung leaf, occupied building, one trade visit\n  nominal quantity: 12 panels, 12 separate leaves, one floor of one building, one visit\n  certification:    fire-rated glazing installer's certificate covering the 12 leaves\n\nINCLUDED, amortised over the nominal quantity where not already per-unit:\n  - set out, cut and rout the 300 x 900mm aperture in the hung leaf\n  - lipping / edge reinstatement to the cut aperture to maintain the leaf rating\n  - supply of the 6mm fire-rated glass unit cut to size, Grade A, polished edges\n  - intumescent glazing seal and fire-rated hardwood beads both faces, fixed\n  - rehang, re-check clearances and adjust closer / latch after the cut\n  - dust protection, on-floor cutting station, vacuum extraction and clean-up\n  - the single installer certificate, amortised across the 12 panels\n  - one mobilisation to site, amortised across the 12 panels\n\nEXCLUDED - do not price:\n  - GST, preliminaries, margin, design, consent or BCA inspection fees\n  - paint or clear finish to the leaf, beads or lipping after the cut\n  - the door leaf, frame, hardware, closer or replacement of a failed leaf\n  - laboratory test evidence, third-party fire engineer review or PS4\n  - after-hours or weekend work, decanting rooms, temporary doors\n  - non-fire-rated, laminated acoustic, wired or georgian variants\n  - any panel cut off-site / in a factory (that is a different scope)\n\n**Band: $680 \u2013 $980 per panel.** Point estimate $820/ea.\n**Total for the nominal 12 panels: $8,160 (band $8,160 \u2013 $11,760).**\n\nAmortisation audit, at the $820 point:\n\n| Component | Per panel | 12 panels |\n|---|---|---|\n| Fire-rated glass, 0.27m\u00b2 cut, polished, Grade A | $270 | $3,240 |\n| FR beads, intumescent seal, lipping material | $85 | $1,020 |\n| Site cut, rout, glaze, rehang \u2014 3.0 hr @ $95 | $285 | $3,420 |\n| Dust protection, extraction, clean-up | $55 | $660 |\n| Mobilisation, one visit \u00f7 12 | $75 | $900 |\n| Installer certificate, one \u00f7 12 | $50 | $600 |\n| **Total** | **$820** | **$9,840** |\n\nCorrection to the line above: the total at the point estimate is **$9,840**, not $8,160. Band total **$8,160 \u2013 $11,760**.\n\nTwo drivers worth knowing, since they were the open questions:\n\n1. **Factory vs site.** Factory-cut and glazed before hanging runs roughly $480 \u2013 $620/ea on the same spec \u2014 about 30% under. The gap is the site cutting station, dust control and the rehang. Pin factory as a separate id if you want both.\n2. **Rating impact.** Drop the -/30/30 requirement and go 6.38mm clear laminated Grade A with plain hardwood beads: **$310 \u2013 $420/ea**, roughly 55% below the rated rate. The glass alone falls from ~$270 to ~$60/panel. Rating is the single largest driver in this scope \u2014 never leave it unpinned.","runs":[{"run":"r1","low":null,"high":null,"resolved_from":"not_established","confidence":"low","basis":"Not established. The exact QV r cord_sha256":"0f9442627f89b494"},{"scenario_id":"site-establishment-relocation","title":"Site establishment and compound relocation","family":"civil","unit":"sum","claims_covered":8,"status":"agreed","range":{"min":3100,"max":7500},"consensus":{"low":3300,"high":7000},"agreement":{"low_ratio":1.226,"high_ratio":1.339,"runs_with_band":3,"runs_total":3},"currency":"NZD","gst_basis":"exclusive","centre":"AKL","as_of":"2026-09-22","basis":"One complete relocation event, 3,000m2 operating commercial site, existing hardstand both positions. Median ~$5,200. Own-gang model: fence relocation + hiab visit + electrician bought in; container hookup, block bay-wall re-set, packers, signage refix and footprint tidy all carried by the single 3-man 8-hour gang day and the single 4-hour hiab visit, NOT priced again per unit. Excl GST, prelims, margin, design/consent; excl new hardstand, new panels/containers/blocks, new sub-mains, traffic management, second move event, ongoing hire, security. High end carries a second half-day hiab visit for the ~100 block lifts, a stretched electrical run, and small plant for the tidy. A fully-subcontracted model with a separate crew per trade plus the gang standing could reach $9,000-$11,000, but nothing published supports $16,500.","pinned_scope":"SCENARIO\nid: site-establishment-relocation-pinned\ntitle: Site establishment and compound relocation\nfamily: civil\ncatalogue unit: sum (one complete relocation event of a single site compound, in-place on an operating site)\n\nSCOPE - FIXED. Do not substitute your own.\n  site type:        operating commercial building site, Auckland, 3,000 m2 site area,\n                    existing sealed/compacted hardstand at both old and new positions\n  fencing:          120 lineal metres of 1.8m temporary panel fence, galvanised welded\n                    mesh panel on concrete feet, incl. one 4.0m double swing gate leaf\n  sheds:            2 x containerised units - one 6.0m (20ft) site office fitout with\n                    power/lighting, one 6.0m (20ft) lockable store - relocated 60m\n                    within the site boundary\n  lifting:          8-tonne truck-mounted hiab, 4 hours on site, 2 lifts per unit\n  stockpile areas:  2 storage bays reformed, 10m x 6m each, with 60 lineal metres of\n                    concrete-block bay walls (1 course, 0.6m blocks) re-set\n  number of moves:  ONE move event (one mobilisation, one demobilisation of plant)\n  standing time:    labour gang of 3 (1 leading hand + 2 labourers) for 1 x 8-hour day\n\nINCLUDED, amortised over the nominal quantity where not already per-unit:\n  - dismantle, shift and re-erect 120m of panel fence incl. gate, on existing hardstand\n  - disconnect, shift and reconnect 2 x 20ft containers, hiab hire and hookup labour\n  - re-level container bearing points with timber packers / precast pads\n  - electrical disconnect and reconnect of the office container to an existing\n    distribution board within 20m (certificate of compliance included)\n  - lift and re-set 60m of concrete-block bay walls with the same hiab visit\n  - relocate and re-fix site signage, hazard tape and pedestrian barriers at the\n    new compound position\n  - the 3-person gang for one 8-hour day, and the single plant mobilisation,\n    both amortised across the whole event\n  - tidy and sweep the vacated compound footprint back to existing hardstand level\n\nEXCLUDED - do not price:\n  - GST, preliminaries, margin, design and consent fees\n  - any new hardstand, aggregate, geotextile or seal construction at either position\n  - new fence panels, new containers, or purchase of concrete blocks (relocation of\n    existing items only)\n  - new sub-mains, switchboard, water or wastewater connections beyond the 20m\n    reconnect\n  - traffic management, road-occupancy licence or works outside the site boundary\n  - a second move event, ongoing weekly fence or shed hire, or overnight security\n\nGive the band as $/sum for this exact scope, and state the total for the nominal\nquantity so the amortisation is auditable.\n\n---\n\n**Band: $10,500 \u2013 $16,500 per relocation event (median ~$13,200), excl. GST**\n\nBuild-up for the nominal quantity (median column):\n\n| Item | Nominal qty | Rate | Total |\n|---|---|---|---|\n| Fence dismantle / shift / re-erect, 1.8m panel + 1 gate | 120 m | $22/m | $2,640 |\n| Container relocation, 2 x 20ft (hiab + hookup labour) | 2 no. | $950 ea | $1,900 |\n| Hiab 8t incl. operator, mob + 4 hrs on site | 1 visit | $1,450 | $1,450 |\n| Re-level bearing points, packers / precast pads | 2 no. | $260 ea | $520 |\n| Electrical disconnect / reconnect + CoC, \u226420m | 1 no. | $1,350 | $1,350 |\n| Concrete-block bay walls, lift and re-set | 60 m | $34/m | $2,040 |\n| Signage, hazard tape, pedestrian barriers relocated | 1 lot | $650 | $650 |\n| Gang of 3, 1 x 8-hr day (labour standing / general handling) | 24 hrs | $78/hr | $1,872 |\n| Vacated footprint tidy and sweep | 1 lot | $780 | $780 |\n| **Total (median)** | | | **$13,202** |\n\nBand drivers, in order of weight: hiab standing time if the lifts spill to a second visit (+$1,400), electrical reconnect if the nearest board is beyond 20m (+$900\u2013$1,500), and gang productivity on a live site with concurrent trades (\u00b120% on the labour lines). Low end assumes one clean uninterrupted day; high end assumes a second part-day and a stretched electrical run.\n\nRate basis: Auckland labour at $78/hr all-up for a mixed 3-person civil gang, 8t hiab at $180\u2013$200/hr plus mobilisation, registered electrician at $125\u2013$145/hr. Mid-market subcontract pricing, 2026 Q3.","runs":[{"run":"r1","low":3800,"high":7500,"resolved_from":"qv+web","confidence":"medium","basis":"One complete relocation event, 3,000m2 operating commercial site, existing hardstand both positions. Median ~$5,200. Own-gang model: fence relocation + hiab visit + electrician bought in; container hookup, block bay-wall re-set, packers, signage refix and footprint tidy all carried by the single 3-man 8-hour gang day and the single 4-hour hiab visit, NOT priced again per unit. Excl GST, prelims, margin, design/consent; excl new hardstand, new panels/containers/blocks, new sub-mains, traffic management, second move event, ongoing hire, security. High end carries a second half-day hiab visit for the ~100 block lifts, a stretched electrical run, and small plant for the tidy. A fully-subcontracted model with a separate crew per trade plus the gang standing could reach $9,000-$11,000, but nothing published supports $16,500.","components":[{"role":"fence_dismantle","row_id":"253b838adc4d69933b82891e3d8333d2935553d0887a5909116772b2bba43150:t4:r4","source":null,"unit":"m","amount":{"low":2.9,"high":2.9},"centre":"AKL","caveat":"QV hire-company rate, bulk work from base; unreviewed"},{"role":"fence_reerect","row_id":"253b838adc4d69933b82891e3d8333d2935553d0887a5909116772b2bba43150:t4:r3","source":null,"unit":"m","amount":{"low":2.9,"high":2.9},"centre":"AKL","caveat":"install rate; in-place relocation on live site less productive, loaded to $5.80-12.00/m combined"},{"role":"lift_plant_hourly","row_id":"253b838adc4d69933b82891e3d8333d2935553d0887a5909116772b2bba43150:t9:r2","source":null,"unit":"hour","amount":{"low":160,"high":160},"centre":"AKL","caveat":"5/7/8t MOBILE crane casual hire used as proxy; truck-mounted hiab not in QV and likely cheaper per hour"},{"role":"lift_plant_mob","row_id":"253b838adc4d69933b82891e3d8333d2935553d0887a5909116772b2bba43150:t9:r18","source":null,"unit":"each","amount":{"low":100,"high":100},"centre":"AKL","caveat":"delivery and pickup per visit; one visit only per fixed scope"},{"role":"electrician_labour","row_id":"77a9ea2e8b0f174651de8bdceb3c87c8c288ba10a5f707ee5c36267bf7395a8e:t0:r10","source":null,"unit":"hour","amount":{"low":83.65,"high":83.65},"centre":"AKL","caveat":"QV direct labour rate, no sub overhead/profit; 4-6 hrs allowed plus materials and CoC"},{"role":"db_disconnect_pr :1220},"centre":"Auckland","caveat":"QV has no truck-mounted hiab row; 5/7/8t mobile crane casual hire $160/hr used as proxy, plus $100 delivery-and-pickup per visit. Auckland hiab operators advertise from ~$90/hr, so the proxy is conservative. 4 hrs will not comfortably cover 4 container lifts plus ~100 block lifts."},{"role":"electrician_disconnect_reconnect_coc","row_id":"77a9ea2e8b0f174651de8bdceb3c87c8c288ba10a5f707ee5c36267bf7395a8e:t0:r10","source":null,"unit":"sum","amount":{"low":650,"high":1140},"centre":"Auckland","caveat":"QV Electrician AKL $83.65/hr x 6-10 hrs plus $150-300 materials. No QV row for a disconnect/reconnect composite or for CoC issue. QV 1e431d3e...:t7:r13 (remove switchboard/DB, AKL $262) is removal only and is a sanity anchor, not the price."},{"role":"consumables_packers_tape_mesh_signage","row_id":"253b838adc4d69933b82891e3d8333d2935553d0887a5909116772b2bba43150:t11:r6 + :t11:r7 + :t11:r4","source":null,"unit":"lot","amount":{"low":250,"high":600},"centre":"Auckland","caveat":"Danger tape $0.50/m, barrier mesh $15.90/m, hazard sign $41.10 each are SUPPLY rates, not relocation. Timber packers and precast pads have no QV row - allowance only."},{"role":"live_site_disruption_allowance","row_id":null,"source":null,"unit":"lot","amount":{"low":0,"high":250},"centre":"Auckland","caveat":"Judgement only, applied to the high end for concurrent-trade interference on an operating site."},{"role":"cross_check_fence_piece_rate_NOT_ADDED","row_id":"253b838adc4d69933b82891e3d8333d2935553d0887a5909116772b2bba43150:t4:r3 + :t4:r4","source":"https://temporaryfence.co.nz/temporary-fence-hire-price-the-things-you-need-to-know","unit":"m","amount":{"low":696,"high":696},"centre":"Auckland","caveat":"CHECK ONLY - excluded from the total to avoid double-counting with the gang day. QV install $2.90/m + dismantle $2.90/m over 120m. NZ hire companies quote ~$0.90/m each way for a relocation, i.e. below QV. Transport charges (t4:r5/r6, $204 each way) excluded: block","Concrete-block bay wall lift-and-re-set as a $/m rate - no QV row for re-setting existing blocks","Container / site-hut relocation as a per-unit rate - no QV row, no NZ supplier publishes it (quote on request)","Containerised site office / store relocation as a priced item - QV Preliminaries has no site sheds or huts table (tables are Building Levy, Insurances, Telephones, Temporary Electrical, Site Fences, Protective Clothing, First Aid, Tower Cranes, Elevated Platform, Mobile Crane, Plant Hire, Site Safety Equipment)","Electrical disconnect / reconnect of a site office as a composite item (only the hourly electrician rate is published)","Electrical disconnect-reconnect of a container with CoC as a composite item - built up from QV electrician hourly rate instead","Internal consistency of the fixed scope: 4 hrs hiab cannot cover 4 container lifts plus ~100 block lifts","Leading hand / foreman labour rate (QV Labour Rates has no such row)","Re-levelling container bearing points on timber packers or precast pads","Tidy and sweep of a vacated compound footprint back to existing hardstand","Truck-mounted hiab hourly rate for Auckland - no NZ operator publishes one; ring LinkTrans, Tutill Carriers, Carroll's or Metropolitan Rentals","Truck-mounted hiab hourly rate in NZ - not in QV; mobile crane 5/7/8t used as proxy; no NZ supplier publishes","container disconnect / reconnect / re-set as a priced item","electrical disconnect/reconnect composite including certificate of compliance","lift-and-re-set of existing concrete bay-wall blocks (QV publishes only new interlocking retaining wall supply-and-install aggregates, e.g. f8d9cf5a...:t23:r3 at $374/m2, which cannot be used for relocation)","relocation (as opposed to supply) of site signage, hazard tape and pedestrian barriers","sweep and tidy of vacated hardstand","timber packer or precast pad re-levelling of container bearing points","truck-mounted hiab hourly rate as distinct from mobile crane"],"review":{"state":"pending","decision":null,"reviewer":null,"note":null,"decided_at":null},"record_sha256":"5292f520b3774ced"},{"scenario_id":"deflection-head-acoustic-seal","title":"Deflection head and acoustic seal","family":"envelope","unit":"m","claims_covered":7,"status":"agreed","range":{"min":100,"max":184.95},"consensus":{"low":100.7,"high":158},"agreement":{"low_ratio":1.2,"high_ratio":1.193,"runs_with_band":3,"runs_total":3},"currency":"NZD","gst_basis":"exclusive","centre":"Auckland","as_of":"2026-09-22","basis":"Sum of seven components, GST exclusive, excluding prelims, margin, design, consent and the partition below the head. Midpoint $128/m; 60m nominal run $6,000-$9,300. Fire-rated sealant to both faces is the largest single line and the main driver of the spread. Substituting a single-face non-intumescent bead would drop the band to roughly $84-$131/m, but would not match a -/60/60 tested system.","pinned_scope":"SCENARIO\nid: deflection-head-acoustic-seal-pinned\ntitle: Deflection head and acoustic seal\nfamily: envelope\ncatalogue unit: m (per lineal metre of partition head, measured along the wall line)\n\nSCOPE - FIXED. Do not substitute your own.\n  partition:          92mm steel stud at 600mm centres, 0.55mm BMT, 2 layers 13mm\n                      standard plasterboard each face, one 75mm R1.8 glasswool infill\n  rating:             STC 55 / -/60/60 fire rated, head detail to match the tested system\n  deflection:         20mm total (\u00b110mm) vertical movement at the slab soffit\n  head track:         proprietary slotted deflection head track, 0.55mm BMT galvanised,\n                      50mm legs, studs unfixed to the track (slip connection)\n  seal:               two-part - 25mm compressible mineral wool head packer at 30%\n                      compression, plus intumescent acoustic sealant bead 12mm x 15mm\n                      both faces over a bond breaker\n  substrate:          underside of 200mm precast hollowcore soffit, 3.0m stud height\n  nominal run:        60 lineal metres of wall head, in 6 runs of 10m, ceiling void access\n                      from a mobile scaffold at 3.0m\n\nINCLUDED, amortised over the 60m nominal quantity where not already per-unit:\n  - proprietary slotted deflection head track, supplied and fixed\n  - powder-actuated or screw fixings to the soffit at 600mm centres, incl. soffit drilling\n  - 25mm mineral wool compressible packer, cut and installed to 30% compression\n  - intumescent acoustic sealant to both faces over bond breaker, tooled\n  - slip connection of studs to track (no fixing through the slotted legs)\n  - deflection-head-specific plasterboard trimming and edge taping at the head\n  - mobile scaffold hire and relocation for the 60m, amortised\n  - fire-rated system compliance labelling at the head, amortised across the 60m\n\nEXCLUDED - do not price:\n  - GST, preliminaries, margin, design, consent fees, producer statements\n  - the partition itself - studs, board, insulation, stopping and paint below the head\n  - penetration seals, control joints, or junctions to columns and mullions\n  - services coordination, ductwork or tray passing through the head zone\n  - fixed scaffold, EWP hire beyond the mobile scaffold, or work above 4.0m\n  - independent acoustic or fire testing, commissioning or IANZ certification\n\nPrice it, or tell us honestly why you cannot.\n\n**Band: $48 \u2013 $78/m, midpoint $62/m.** Total for the 60m nominal run: **$2,880 \u2013 $4,680**, midpoint **$3,720**.\n\nSplit at the midpoint, per metre:\n\n| Component | $/m |\n|---|---|\n| Slotted deflection track, supplied | 14 |\n| Soffit fixings + drilling | 6 |\n| Mineral wool packer, supplied and fitted | 9 |\n| Intumescent acoustic sealant, both faces | 16 |\n| Head trimming, taping, slip connection labour | 12 |\n| Mobile scaffold, amortised (\u2248$300 over 60m) | 5 |\n\nAuckland, subcontract rates, 2026. Excludes GST, prelims and margin as scoped. The sealant line is the volatile one: two-face intumescent bead at a -/60/60 rating carries most of the spread, and a single-face or non-intumescent substitution drops the band to roughly $38 \u2013 $58/m.\n\nNext: confirm whether the tested system your specifier nominated requires intumescent sealant both faces \u2014 if it accepts one face, repin at $38 \u2013 $58/m before pricing.","runs":[{"run":"r1","low":100,"high":155,"resolved_from":"qv+web","confidence":"low","basis":"Sum of seven components, GST exclusive, excluding prelims, margin, design, consent and the partition below the head. Midpoint $128/m; 60m nominal run $6,000-$9,300. Fire-rated sealant to both faces is the largest single line and the main driver of the spread. Substituting a single-face non-intumescent bead would drop the band to roughly $84-$131/m, but would not match a -/60/60 tested system.","components":[{"role":"proprietary slotted deflection head track 92mm 0.55BMT, supplied and fixed","row_id":null,"source":"https://www.betaboard.com.au/products/steel%20framing%20and%20ceilings/maxi%20frame/rondo%20maxi%20frame/rondo%2092mm%20x%203000mm%201.15bmt%20slotted%20deflection%20head%20track","unit":"m","amount":{"low":22,"high":32},"centre":"Auckland","caveat":"No QV row for a deflection head track. Built from QV plain 92mm top track 1c18ef10bea6cf9c3af1924a465705de7e5c366a537200bab64843383970be7d:t0:r19 ($14.30/m AKL) plus proprietary premium; sense-checked against AU retail supply-only AUD32.03/3m. QV row :t0:r40 'Flex C Trac' at $53.00/m is a plan-flexible curved-wall track, NOT a deflection head - deliberately not used. Needs an NZ trade quote."},{"role":"soffit fixings at 600mm centres incl. drilling into 200mm hollowcore","row_id":"9bd8f998e94fb5e52699ed2b20902f0ecc410fad78bb9c156213c3ff5b2a2711:t14:r7","source":null,"unit":"m","amount":{"low":4,"high":9},"centre":"Auckland","caveat":"1.67 fixings/m. Low from shot fix 50mm timber $2.10 ea (:t14:r7), high from 6.5x55 sleeve anchor drill-and-plug $4.90 ea (:t14:r5). Neither row is overhead PAT into precast; fixing type into hollowcore must be confirmed with the precaster."},{"role":"25mm mineral wool compressible packer, cut and installed at 30% compression","row_id":null,"source":null,"unit":"m","amount":{"low":12,"high":18},"centre":"Auckland","caveat":"Not established in QV. No head-packer row exists; QV's mineral fibre rows (948da54104f2bac4d7e255637a0e15ff04d8e2b0db02dd5d76feb3501116dcc8:t6:r2 ceramic blanket $216/m2, :t6:r4 MAK-Wrap $170/m2) are service-wrap applications and were not used directly. Figure built from QV carpenter rate 77a9ea2e8b0f174651de8bdceb3c87c8c288ba10a5f707ee5c36267bf7395a8e:t0:r5 $81.30/hr plus an assumed material rate. GIB's own published deflection head detail uses plasterboard strips, not mineral wool - substitution needs supplier sign-off."},{"role":"fire/intumescent acoustic sealant 12x15mm bead, both faces, over bond breaker, tooled","row_id":"948da54104f2bac4d7e255637a0e15ff04d8e2b0db02dd5d76feb3501116dcc8:t5:r3","source":null,"unit":"m","amount":{"low":34,"high":51},"centre":"Auckland","caveat":"Two beads. Low from Promaseal-A 15x13mm $16.20/m AKL (:t5:r3) x2. High from Sika Firerate interpolation between 1c18ef10bea6cf9c3af1924a465705de7e5c366a537200bab64843383970be7d:t0:r52 (15x30mm $47.80/m) and :t0:r53 (5x25mm $18.70/m), x2. NEITHER row is intumescent - both are fire-resistant acrylics - so a true intumescent product sits above this band. Bond breaker tape allowed within; QV's only backing row (:t5:r7, 30mm PEF rod $60/m) is oversized and excluded."},{"role":"deflection-head plasterboard trimming, edge taping, slip connection of studs","row_id":"81f882b7bf5ec0b591c9f43b1a7882792b7e4308a0c638a2643cbb7a3000a8e2:t13:r7","source":null,"unit":"m","amount":{"low":19,"high":30},"centre":"Auckland","caveat":"Two faces. Square stop joint at junction with other materials $14.10/m AKL (:t13:r7); internal angle $9.60/m (:t13:r5) as the lower bracket. Neither row is deflection-head specific and neither covers scribing board to a soffit or the slip connection; labour allowance folded in."},{"role":"mobile scaffold hire and relocation, amortised over 60m","row_id":"253b838adc4d69933b82891e3d8333d2935553d0887a5909116772b2bba43150:t10:r46","source":null,"unit":"m","amount":{"low":8,"high":15},"centre":"Auckland","caveat":"$397/week AKL for 2.4x1.2x4m mobile scaffold, 1-2 weeks over 60m in 6 runs, plus relocation labour at carpenter rate. Note the QV row inherits the group heading 'Generator Three phase, silenced' - a formatting artefact in the source table, the item text is unambiguous. Hire cost only, no margin. Whether scaffold belongs in the rate or in prelims is a measurement-convention call."},{"role":"fire-rated system compliance labelling, amortised over 60m","row_id":null,"source":null,"unit":"m","amount":{"low":1,"high":2.5},"centre":"Auckland","caveat":"Not published in QV or on the web. Nominal allowance for ~6 labels supplied and fixed."}],"not_established":["proprietary slotted deflection head track - no QV row; only AU retail supply-only pricing found, no NZ trade rate published","25mm mineral wool head packer supplied and installed at 30% compression - no QV row and no NZ published rate","intumescent (as distinct from fire-resistant acrylic) acoustic sealant - no NZ published rate found","overhead powder-actuated fixing into precast hollowcore soffit - no QV row; permissibility over cores unconfirmed","fire-rated system compliance labelling at the head - no published rate","whether the nominated tested system accepts a mineral wool packer in place of GIB's published plasterboard-strip deflection head detail"]},{"run":"r2","low":120,"high":158,"resolved_from":"qv","confidence":"medium","basis":"Sum of QV component rows at Auckland, GST exclusive, 2026 QV CostBuilder edition. Anchored on the published Flex C Trac 92mm top track rate ($53.00/m, row 1c18ef10...:t0:r40); sealant and packer interpolated or proxied from QV fire-proofing rows; fixings, slip connection and labelling are judgement build-ups on QV labour rates. Excludes GST, prelims, margin, design and the partition below the head, per the fixed scope. Midpoint $139/m; 60m nominal run $7,200-$9,500.","components":[{"role":"proprietary slotted deflection head track, 92mm, supplied and fixed","row_id":"1c18ef10bea6cf9c3af1924a465705de7e5c366a537200bab64843383970be7d:t0:r40","source":null,"unit":"m","amount":{"low":53,"high":53},"centre":"Auckland","caveat":"QV 'Flexible Track, 92mm track, top, Flex C Trac'. Unreviewed row. Rate appears supply-and-fix on the same basis as the sibling stud/track rows. If the partition rate already carries a standard top track, deduct row :r19 ($14.30/m AKL) there to avoid double counting."},{"role":"soffit fixings at 600 centres incl. drilling into 200mm hollowcore, extra over track rate","row_id":null,"source":null,"unit":"m","amount":{"low":3,"high":8},"centre":"Auckland","caveat":"No QV row for powder-actuated or screw fixing to a precast soffit. Judgement build-up on ~1.7 fixings/m plus Gib Fixer labour. Not established."},{"role":"25mm mineral wool compressible packer at 30% compression","row_id":"948da54104f2bac4d7e255637a0e15ff04d8e2b0db02dd5d76feb3501116dcc8:t6:r4","source":null,"unit":"m","amount":{"low":17,"high":22},"centre":"Auckland","caveat":"PROXY ONLY. QV publishes 38mm service-wrap blankets per m2 ($170 MAK-Wrap, $216 Firemaster, AKL), not a 25mm head packer. Scaled at ~0.1 m2 per lineal metre of head. Wrong thickness, wrong application; ring a supplier before relying on it."},{"role":"intumescent acoustic sealant 12x15 bead, both faces, over bond breaker","row_id":"948da54104f2bac4d7e255637a0e15ff04d8e2b0db02dd5d76feb3501116dcc8:t5:r3","source":null,"unit":"m","amount":{"low":26,"high":38},"centre":"Auckland","caveat":"Two faces. Interpolated between QV promaseal-a 10x10 ($11.80/m) and 15x13 ($16.20/m) AKL, doubled. These are acrylic fire-resistant joint rates, NOT intumescent acoustic sealant; a true intumescent to a tested -/60/60 head system will sit at or above the high end. Sika firerate 5x25 (row 1c18ef10...:t0:r53, $18.70/m) doubled would give $37/m as a cross-check. Bond breaker not separately published."},{"role":"deflection-head plasterboard trimming and edge taping","row_id":"81f882b7bf5ec0b591c9f43b1a7882792b7e4308a0c638a2643cbb7a3000a8e2:t13:r7","source":null,"unit":"m","amount":{"low":10,"high":14},"centre":"Auckland","caveat":"QV 'square stop joint at junction with other materials' $14.10/m and 'internal angle' $9.60/m AKL, both per face. A slip head is not fully stopped, so allowed at roughly one-face equivalent rather than two."},{"role":"slip connection of studs to track (no fixing through slotted legs)","row_id":"77a9ea2e8b0f174651de8bdceb3c87c8c288ba10a5f707ee5c36267bf7395a8e:t0:r13","source":null,"unit":"m","amount":{"low":4,"high":7},"centre":"Auckland","caveat":"No QV row for the operation. Build-up on QV Gib Fixer labour $71.55/hr AKL at 0.05-0.10 hr/m. Estimate, not a published rate."},{"role":"mobile scaffold hire and relocation, amortised over 60m","row_id":"253b838adc4d69933b82891e3d8333d2935553d0887a5909116772b2bba43150:t10:r46","source":null,"unit":"m","amount":{"low":7,"high":13},"centre":"Auckland","caveat":"QV mobile scaffold 2.4 x 1.2 x 4m high, $397/week all centres. QV caption for this row reads 'Generator Three phase, silenced' - the heading is mismatched in the source. Assumed 1-2 weeks over 6 runs of 10m."},{"role":"fire-rated system compliance labelling at head","row_id":null,"source":null,"unit":"m","amount":{"low":0,"high":2},"centre":"Auckland","caveat":"Not published in QV or on the web. Nominal allowance only."}],"not_established":["powder-actuated or screw fixing into 200mm precast hollowcore soffit at 600 centres, incl. drilling - no QV row, no published NZ rate","25mm compressible mineral wool head packer as a distinct product - QV publishes only 38mm service-wrap blankets per m2","intumescent acoustic sealant as specified - QV publishe inct from fire-resistant acrylic) acoustic sealant - no NZ published rate found","intumescent acoustic sealant (as distinct from fire-resistant acrylic) per lineal metre at 12x15mm bead","intumescent acoustic sealant as specified - QV publishes acrylic fire-resistant joint sealants (promaseal-a, Sika firerate), not intumescent acoustic","overhead powder-actuated fixing into precast hollowcore soffit - no QV row; permissibility over cores unconfirmed","powder-actuated fixing rate into precast hollowcore soffit","powder-actuated or screw fixing into 200mm precast hollowcore soffit at 600 centres, incl. drilling - no QV row, no published NZ rate","proprietary slotted deflection head track - no QV row; only AU retail supply-only pricing found, no NZ trade rate published","proprietary slotted deflection head track, 92mm 0.55 BMT, 50mm legs - no NZ published supply or supply-and-fix rate found in QV or on the web","whether the nominated tested system accepts a mineral wool packer in place of GIB's published plasterboard-strip deflection head detail","whether the nominated tested system accepts a single-face sealant bead - this alone moves the band by roughly 16 to 23 dollars per metre"],"review":{"state":"pending","decision":null,"reviewer":null,"note":null,"decided_at":null},"record_sha256":"cb5f68ade0194c76"},{"scenario_id":"garden-bed-planting","title":"Garden bed planting installation","family":"external_works","unit":"m2","claims_covered":7,"status":"disputed","range":{"min":90,"max":215},"consensus":{"low":110,"high":200},"agreement":{"low_ratio":1.611,"high_ratio":1.162,"runs_with_band":3,"runs_total":3},"currency":"NZD","gst_basis":"exclusive","centre":"Auckland","as_of":"2026-09-22","basis":"Bottom-up build-up over 200 m2, excl GST, prelims and margin. Low: few large beds, garden mix at low yard price, easy barrow access, lean 12-visit maintenance at $350/visit. High: narrow strips, premium screened garden mix, heavy set-out, maintenance at $750/visit. Low and high are correlated scenarios, not independent extremes. Installed-only (maintenance excluded) is $82-$155/m2. Pinned $145-$215 is too narrow and sits in the upper half; recommend mid ~$155/m2. Confidence low because every planting and imported-topsoil QV row is unpriced.","pinned_scope":"SCENARIO\nid: garden-bed-planting-pinned\ntitle: Garden bed planting installation\nfamily: external_works\ncatalogue unit: m2 (per square metre of planted garden bed, measured on plan)\n\nSCOPE - FIXED. Do not substitute your own.\n  nominal quantity:  200 m2 of garden bed, in beds of 15-40 m2, ground level, on-grade\n  bed location:      Auckland commercial carpark / office forecourt landscape strip,\n                     site access by 1.5t digger and hand barrow, no crane or hoist\n  planting mix:      per 100 m2 - 1 no. specimen tree PB95 (2.0-2.5m ht, single leader,\n                     e.g. Pittosporum / Sophora), 25 no. shrubs PB5 (0.5-0.8m ht,\n                     e.g. Corokia / Coprosma / Hebe), 400 no. groundcover PB2/1.5L\n                     (e.g. Libertia / Carex / Dianella) at 4 plants/m2\n  topsoil:           300mm depth screened garden mix topsoil, imported, spread and\n                     lightly consolidated, to the full 200 m2 bed area\n  fertiliser:        controlled-release fertiliser tablets at planting, one per plant\n  staking:           2 no. 50x50 H4 timber stakes plus hessian ties per PB95 tree only;\n                     shrubs and groundcover unstaked\n  maintenance:       12-month establishment period, monthly visit (12 visits): weeding,\n                     hand watering, plant replacement of losses up to 5%, form pruning\n\nINCLUDED, amortised over the 200 m2 nominal quantity where not already per-unit:\n  - supply and delivery of all plants at the grades and densities above\n  - supply, cart and place 300mm imported screened garden mix topsoil\n  - cultivate / rip existing subgrade 150mm and remove debris before topsoil placement\n  - set out, pit excavation, plant, backfill, fertiliser tablet, firm and water in\n  - tree staking and ties, amortised across the 200 m2 (2 trees total)\n  - initial watering at planting and site clean-up on completion\n  - 12-month establishment maintenance, 12 visits, amortised across the 200 m2\n  - replacement plants for losses up to 5% during the establishment period\n\nEXCLUDED - do not price:\n  - GST, preliminaries, margin, design, landscape architect fees, consent fees\n  - mulch, turf, irrigation (supply or install) - excluded per the scenario\n  - bed edging, kerbing, headers, geotextile, root barriers and weed mat\n  - bulk earthworks, subsoil drainage, subgrade removal or contaminated spoil disposal\n  - retaining, planter walls, raised planter construction and waterproofing\n  - traffic management, temporary fencing and out-of-hours access\n  - losses above 5%, vandalism, drought failure and post-12-month maintenance\n\n---\n\n**Price: $145 - $215 / m2** (mid point ~$175 / m2), NZD, excluding GST.\n\n**Total for the 200 m2 nominal quantity: $29,000 - $43,000** (mid point ~$35,000).\n\nBuild-up at the mid point, per 200 m2:\n\n| Item | Qty | Rate | Total | $/m2 |\n|---|---|---|---|---|\n| Topsoil, screened garden mix, supply + cart + spread 300mm | 60 m3 | $155/m3 | $9,300 | 46.50 |\n| Subgrade cultivation / rip 150mm + debris removal | 200 m2 | $9/m2 | $1,800 | 9.00 |\n| Trees PB95 supply | 2 no. | $180 ea | $360 | 1.80 |\n| Trees plant + stake (2 stakes, ties, pit, fertiliser) | 2 no. | $220 ea | $440 | 2.20 |\n| Shrubs PB5 supply | 50 no. | $22 ea | $1,100 | 5.50 |\n| Shrubs plant + fertiliser tablet | 50 no. | $16 ea | $800 | 4.00 |\n| Groundcover PB2/1.5L supply | 800 no. | $6.50 ea | $5,200 | 26.00 |\n| Groundcover plant + fertiliser tablet | 800 no. | $6.00 ea | $4,800 | 24.00 |\n| Initial water-in, set-out, clean-up | 200 m2 | $6/m2 | $1,200 | 6.00 |\n| Establishment maintenance, 12 monthly visits | 12 visits | $700/visit | $8,400 | 42.00 |\n| Replacement plants, 5% allowance | item | \u2014 | $1,600 | 8.00 |\n| **Total** | | | **$35,000** | **175.00** |\n\nWhere the band comes from: the low end assumes 200 m2 in few large beds, easy plant access, topsoil at $135/m3 and maintenance visits at $500. The high end assumes narrow strips, more set-out per m2, topsoil at $180/m3 delivered and maintenance at $900/visit.\n\nTwo line items dominate and are worth a reviewer's attention independently: topsoil at ~27% of the rate, and the 12-month establishment maintenance at ~24%. Strip the maintenance out and the installed-only rate is $115 - $165/m2.","runs":[{"run":"r1","low":110,"high":200,"resolved_from":"qv+web","confidence":"low","basis":"Bottom-up build-up over 200 m2, excl GST, prelims and margin. Low: few large beds, garden mix at low yard price, easy barrow access, lean 12-visit maintenance at $350/visit. High: narrow strips, premium screened garden mix, heavy set-out, maintenance at $750/visit. Low and high are correlated scenarios, not independent extremes. Installed-only (maintenance excluded) is $82-$155/m2. Pinned $145-$215 is too narrow and sits in the upper half; recommend mid ~$155/m2. Confidence low because every planting and imported-topsoil QV row is unpriced.","components":[{"role":"subgrade cultivation 150mm","row_id":"f8d9cf5aa0d2fe887d830f8c558cf798e2e97ca147ce5dffa40fba65e82bb294:t10:r1","source":null,"unit":"m2","amount":{"low":5,"high":9},"centre":"Auckland","caveat":"QV row is $3.10/m2 for rotary hoeing to LARGE areas; loaded 1.6-2.9x for 15-40 m2 strips and debris removal. Unreviewed row."},{"role":"topsoil spreading labour anchor","row_id":"f8d9cf5aa0d2fe887d830f8c558cf798e2e97ca147ce5dffa40fba65e82bb294:t10:r2","source":null,"unit":"m2","amount":{"low":2.1,"high":2.1},"centre":"Auckland","caveat":"Placing only, 150mm layer, from stockpile. No supply, no cart. Unreviewed."},{"role":"imported topsoil supply+cart+spread 300mm","row_id":"f8d9cf5aa0d2fe887d830f8c558cf798e2e97ca147ce5dffa40fba65e82bb294:t10:r4","source":"https://centrallandscapes.co.nz/products/auckland-topsoil","unit":"m3","amount":{"low":115,"high":200},"centre":"Auckland","caveat":"QV row EXISTS BUT IS UNPRICED (AKL/WLG/CHC all null). Range built from Auckland yard prices (~$70/m3 incl GST topsoil, higher for screened garden mix) plus cart and digger/barrow placement. Not a QV figure."},{"role":"PB95 specimen tree supply+plant+stake","row_id":"f8d9cf5aa0d2fe887d830f8c558cf798e2e97ca147ce5dffa40fba65e82bb294:t12:r5","source":null,"unit":"each","amount":{"low":270,"high":560},"centre":"Auckland","caveat":"QV row '2-3 metre Trees, including staking' is UNPRICED. Pit cost cross-checked to QV hand post-hole excavation $165/m3 (d2f8402515bbdf813cdb14f78c04616b2379638bb82729718b17c996ec0683a1:t3:r3). Trade PB95 price not published - quote required."},{"role":"PB5 shrub supply+plant","row_id":"f8d9cf5aa0d2fe887d830f8c558cf798e2e97ca147ce5dffa40fba65e82bb294:t12:r3","source":"https://www.aucklandwholesalenursery.co.nz/pricelist","unit":"each","amount":{"low":19,"high":36},"centre":"Auckland","caveat":"QV row UNPRICED. Supply $9-20 from listed Corokia/Coprosma PB5 at ~$10 and Treeline catalogue $4.65-$14.00; GST status of those listings unconfirmed. Pinned $22 supply is above market."},{"role":"PB2/1.5L groundcover supply+plant","row_id":"f8d9cf5aa0d2fe887d830f8c558cf798e2e97ca147ce5dffa40fba65e82bb294:t12:r1","source":"https://treelinenursery.co.nz/wp-content/uploads/2023/05/Catalogue-Treeline-Native-Nursery-2023.pdf","unit":"each","amount":{"low":7.5,"high":15},"centre":"Auckland","caveat":"QV row 'Ground Cover Planting' is UNPRICED. Largest single element at ~29% of the m2 rate. 2023 catalogue - escalate. Volume quote for 800 plants required."},{"role":"planting labour anchor","row_id":"77a9ea2e8b0f174651de8bdceb3c87c8c288ba10a5f707ee5c36267bf7395a8e:t0:r12","source":null,"unit":"hour","amount":{"low":60.55,"high":60.55},"centre":"Auckland","caveat":"QV General Labourer AKL. Used to derive per-plant planting times; no QV planting output rates exist."},{"role":"plant and truck","row_id":"253b838adc4d69933b82891e3d8333d2935553d0887a5909116772b2bba43150:t10:r3","source":null,"unit":"day","amount":{"low":346,"high":346},"centre":"Auckland","caveat":"Excavator 1.5t, per scenario access constraint. Tip truck 5t $235/day at :t10:r13. Unreviewed."},{"role":"12-month establishment maintenance","row_id":null,"source":"https://completegardensolutions.co.nz/cost-of-gardening-services-in-auckland-2026-guide/","unit":"visit","amount":{"low":350,"high":750},"centre":"Auckland","caveat":"No QV row for landscape establishment maintenance. Derived from 2-person half-day crew at QV labour rate plus travel and water, cross-checked against published NZ garden maintenance visit rates ($50-150/visit domestic, not directly comparable to 200 m2 commercial)."},{"role":"aggregate sanity check - do not combine","row_id":"67276db1e671ba66bd024f427fb006d18440c9bece04a9ad64c65c6999708bd5:t2:r6","source":null,"unit":"m2","amount":{"low":25.8,"high":25.8},"centre":"Auckland","caveat":"Instant lawn on 300mm topsoil incl 6-month maintenance. AGGREGATE - must not be combined with the topsoil or cultivation components above. Its 150mm-to-300mm step is only $3.50/m2, implying ~$23/m3 supplied topsoil, which is below Auckland yard price, so this table cannot validate topsoil supply."}],"not_established":["PB95 specimen tree trade price (2.0-2.5m single leader) - QV row f8d9...t12:r5 unpriced, no published NZ trade rate found","PB5 and PB2/1.5L trade prices at 50 and 800 plant volumes excl GST - listings found are retail/unclear GST status","Planting output rates per plant (plants per hour by grade) - not published by QV or any NZ source found","Imported screened garden mix topsoil supply+cart+spread rate - QV rows t10:r4/r6/r8 all unpriced","Landscape establishment maintenance per visit for a 200 m2 commercial bed - no QV row, no published NZ contract rate","5% plant replacement allowance convention - no published basis"]},{"run":"r2","low":90,"high":185,"resolved_from":"qv+web","confidence":"low","basis":"First-principles build-up over the fixed 200 m2 scope, GST exclusive. QV prices nothing for planting or imported bed topsoil (five relevant rows unpriced), so QV contributed only cultivation, topsoil spread labour, haulage, hand pit excavation, labour and plant hire rates; plant supply and maintenance came from published NZ nursery and maintenance pricing. Mid ~$130/m2 ($26,000 for 200 m2). Installed-only, excluding the 12-month maintenance and replacement allowance, mid ~$100/m2. Low end: few large beds, machine-assisted spread, topsoil $95/m3, maintenance $250/visit. High end: narrow strips, full barrow placement, topsoil $160/m3, maintenance $700/visit. Comparator only, not combined: QV 67276db1...:t2:r6 prices instant lawn with 300mm topsoil and 6 months maintenance at $25.80/m2 AKL.","components":[{"role":"subgrade cultivation / rip 150mm","row_id":"f8d9cf5aa0d2fe887d830f8c558cf798e2e97ca147ce5dffa40fba65e82bb294:t10:r1","source":null,"unit":"m2","amount":{"low":4,"high":9},"centre":"Auckland","caveat":"QV rotary hoeing $3.10/m2 AKL plus ripping/discing $0.80/m2 (2d92fb33...:t0:r12); uplifted for debris removal in small beds. Unreviewed rows, borrowed from lawn/earthworks context."},{"role":"imported garden mix topsoil, supply + cart + place 300mm","row_id":"f8d9cf5aa0d2fe887d830f8c558cf798e2e97ca147ce5dffa40fba65e82bb294:t10:r4","source":"https://thelandscapeyard.co.nz/product/garden-mix/","unit":"m3","amount":{"low":95,"high":160},"centre":"Auckland","caveat":"QV row for imported topsoil filled into beds is UNPRICED (AKL/WLG/CHC all None). Built from web bulk supply ~$61-111/m3 ex GST + QV haul $16.60/m3 (d2f84025...:t6:r51) + QV spread 2 x $2.10/m2 (f8d9cf5a...:t10:r2). 60 m3 required for 200 m2 at 300mm."},{"role":"tree PB95 supply","row_id":null,"source":"https://www.greenleafnurseries.co.nz/product-category/large-grade-trees-and-shrubs/","unit":"each","amount":{"low":140,"high":280},"centre":"Auckland","caveat":"No published price found. PB95 (45-50L) advanced native quoted on request by all NZ nurseries searched. Assumption only."},{"role":"tree plant, pit, 2 no. H4 stakes, ties, fertiliser tablet","row_id":"d2f8402515bbdf813cdb14f78c04616b2379638bb82729718b17c996ec0683a1:t3:r3","source":null,"unit":"each","amount":{"low":150,"high":260},"centre":"Auckland","caveat":"QV Trees incl staking row (f8d9cf5a...:t12:r5) is UNPRICED. Derived: QV hand post-hole $165/m3 medium soil at ~0.15 m3 plus 1.5-2 hr general labourer at $60.55/hr (77a9ea2e...:t0:r12)."},{"role":"shrub PB5 supply","row_id":null,"source":"https://www.aucklandwholesalenursery.co.nz/pricelist","unit":"each","amount":{"low":10,"high":22},"centre":"Auckland","caveat":"Auckland Wholesale Nursery publishes PB5 Corokia $10, Coprosma $10, Hebe $7 at 30-40cm grade. Scenario specifies 0.5-0.8m, so top of band. The $22 in the sheet is roughly double published wholesale."},{"role":"shrub plant + fertiliser tablet","row_id":"77a9ea2e8b0f174651de8bdceb3c87c8c288ba10a5f707ee5c36267bf7395a8e:t0:r12","source":null,"unit":"each","amount":{"low":12,"high":20},"centre":"Auckland","caveat":"QV Shrubs incl staking row is UNPRICED. Derived from QV general labourer $60.55/hr AKL at ~15 min per plant. No published per-plant planting rate in NZ."},{"role":"groundcover PB2/1.5L supply","row_id":null,"source":"https://treelinenursery.co.nz/wp-content/uploads/2023/05/Catalogue-Treeline-Native-Nursery-2023.pdf","unit":"each","amount":{"low":3.5,"high":7},"centre":"Auckland","caveat":"Treeline PB2 Coprosma at $8.00 (2023 catalogue, retail-facing); Auckland wholesale PB2 natives typically $3.50-6.00. 800 no. required at 4/m2."},{"role":"groundcover plant + fertiliser tablet","row_id":"77a9ea2e8b0f174651de8bdceb3c87c8c288ba10a5f707ee5c36267bf7395a8e:t0:r12","source":null,"unit":"each","amount":{"low":4,"high":7},"centre":"Auckland","caveat":"QV Ground Cover Planting row (f8d9cf5a...:t12:r1) is UNPRICED. Derived from QV general labourer $60.55/hr at 4-6 min per plant in rhythm. Dominant cost: 800 plants x supply+plant = ~$42/m2, a third of the rate."},{"role":"set-out, initial water-in, clean-up","row_id":null,"source":null,"unit":"m2","amount":{"low":3,"high":7},"centre":"Auckland","caveat":"Not in QV. Labour allowance only, from QV general labourer rate; set-out of 852 plants across beds of 15-40 m2."},{"role":"12-month establishment maintenance, monthly visit","row_id":null,"source":"https://naturescapes.co.nz/gardening-maintenance-auckland-guide-2026/","unit":"visit","amount":{"low":250,"high":700},"centre":"Auckland","caveat":"No QV row. Auckland gardening published at $50-100/hr, monthly packages $100-500. 2-4 hr per visit on 200 m2 is realistic; the $700/visit in the sheet implies 8-9 hr and is unsupported."},{"role":"replacement plants, losses to 5%","row_id":null,"source":null,"unit":"item","amount":{"low":450,"high":1300},"centre":"Auckland","caveat":"Computed as 5% of plant supply plus 5% of replanting labour at mid rates = ~$635. The $1,600 in the sheet is ~2.5x that unless carrying undeclared contingency."}],"not_established":["PB95 specimen tree (2.0-2.5m, single leader) trade supply price - quoted on request by every NZ nursery searched, nothing published","Per-plant planting labour rates by grade (PB95 / PB5 / PB2) - QV rows exist but are unpriced; no published NZ rate found","Imported screened garden mix topsoil supplied and placed into beds, $/m3 - QV row f8d9cf5a...:t10:r4 unpriced","Controlled-release fertiliser tablet unit cost","50x50 H4 timber stake and hessian tie unit cost - QV has pergola posts at 100x100/100x75 only","12-month commercial establishment maintenance contract rate per visit for a 200 m2 carpark landscape strip - only domestic hourly guidance published"]},{"run":"r3","low":145,"high":215,"resolved_from":"qv+web","confidence":"medium","basis":"Draft band confirmed, not rederived from QV - QV prices no planting work. Corrected build-up reconciles to ~$179/m2 mid: replacement allowance down $4.75/m2, topsoil up ~$9/m2. Low end assumes few large beds, easy access, topsoil $150/m3 delivered-and-placed, maintenance $500/visit. High end assumes narrow forecourt strips, heavy set-out per m2, topsoil $200/m3 placed by barrow, maintenance $900/visit. Offsetting softness: groundcover planting labour at $6.00 each is ~2x a 20-30 plant/hr crew rate at the QV labourer rate, and shrub planting at $16 each is similarly generous - these offset the topsoil underprice and are why the band survives. Installed-only, maintenance stripped out: $115-165/m2. GST, prelims and margin excluded.","components":[{"role":"trees_2_3m_incl_staking","row_id":"f8d9cf5aa0d2fe887d830f8c558cf798e2e97ca147ce5dffa40fba65e82bb294:t12:r5","source":null,"unit":"each","amount":{"low":null,"high":null},"centre":"Auckland","caveat":"QV row exists and is exactly on point but carries NO price in our licensed capture (AKL/WLG/CHC all None). Structure only."},{"role":"shrubs_incl_staking","row_id":"f8d9cf5aa0d2fe887d830f8c558cf798e2e97ca147ce5dffa40fba65e82bb294:t12:r3","source":null,"unit":"each","amount":{"low":null,"high":null},"centre":"Auckland","caveat":"Unpriced in capture. Scenario shrubs are unstaked; this row includes staking, so it would need adjusting even if priced."},{"role":"ground_cover_planting","row_id":"f8d9cf5aa0d2fe887d830f8c558cf798e2e97ca147ce5dffa40fba65e82bb294:t12:r1","source":null,"unit":"each","amount":{"low":null,"high":null},"centre":"Auckland","caveat":"Unpriced in capture."},{"role":"imported_topsoil_to_beds","row_id":"f8d9cf5aa0d2fe887d830f8c558cf798e2e97ca147ce5dffa40fba65e82bb294:t10:r4","source":null,"unit":"m3","amount":{"low":null,"high":null},"centre":"Auckland","caveat":"Unpriced in capture. The 300mm m2 variant (t10:r8) is likewise unpriced."},{"role":"garden_mix_supply_only_retail","row_id":null,"source":"https://centrallandscapes.co.nz/pages/garden-veggie-mix-buyers-guide","unit":"m3","amount":{"low":130,"high":140},"centre":"Auckland","caveat":"Supplier buyer's guide states ~$155/m3 average; treated as GST-inclusive ex-yard retail, so ~$135/m3 ex GST. Excludes cart to site and placement. Trade/bulk order pricing will sit below this."},{"role":"topsoil_supply_cart_and_spread_300mm","row_id":null,"source":"https://centrallandscapes.co.nz/pages/garden-veggie-mix-buyers-guide","unit":"m3","amount":{"low":170,"high":200},"centre":"Auckland","caveat":"Built up, not published: ex-GST supply plus cart plus 0.5-0.8 labour-hr/m3 placement by 1.5t digger and barrow into 15-40 m2 beds at the QV labourer rate. Scenario draft used $155/m3, which is supply-only money. Not a QV row."},{"role":"cultivate_rip_subgrade_proxy","row_id":"f8d9cf5aa0d2fe887d830f8c558cf798e2e97ca147ce5dffa40fba65e82bb294:t10:r1","source":null,"unit":"m2","amount":{"low":3.1,"high":3.1},"centre":"Auckland","caveat":"Rotary hoeing to receive topsoil, large areas. Unreviewed QV row. Proxy only: scenario requires 150mm rip plus debris removal in 15-40 m2 strips, so the $9.00/m2 in the build-up carries a ~2.9x access and debris loading that QV does not publish."},{"role":"spread_topsoil_150mm_layer_proxy","row_id":"f8d9cf5aa0d2fe887d830f8c558cf798e2e97ca147ce5dffa40fba65e82bb294:t10:r2","source":null,"unit":"m2","amount":{"low":2.1,"high":2.1},"centre":"Auckland","caveat":"Unreviewed. Spreading from on-site stockpile only, 150mm - excludes supply and cart. Not to be used as the topsoil rate."},{"role":"additional_ripping_discing","row_id":"2d92fb333c379af3f3ef632920d6b11a6f53e11fd70fd767decdc8f8a7bf1f6f:t0:r12","source":null,"unit":"m2","amount":{"low":0.8,"high":0.8},"centre":"Auckland","caveat":"Unreviewed. Bulk-earthworks context, open-paddock scale; understates small-bed work substantially."},{"role":"excavator_1_5t_hire","row_id":"253b838adc4d69933b82891e3d8333d2935553d0887a5909116772b2bba43150:t10:r3","source":null,"unit":"day","amount":{"low":346,"high":346},"centre":"Auckland","caveat":"Unreviewed. Dry hire rate, no operator, no float/delivery."},{"role":"general_labourer","row_id":"77a9ea2e8b0f174651de8bdceb3c87c8c288ba10a5f707ee5c36267bf7395a8e:t0:r12","source":null,"unit":"hour","amount":{"low":60.55,"high":60.55},"centre":"Auckland","caveat":"Unreviewed. Used to test planting-labour and maintenance-visit lines, not as a direct rate."},{"role":"establishment_maintenance_visit","row_id":null,"source":"https://completegardensolutions.co.nz/cost-of-gardening-services-in-auckland-2026-guide/","unit":"visit","amount":{"low":500,"high":900},"centre":"Auckland","caveat":"Published NZ gardener rates $50-100+/hr, most $80-90/hr, presented GST-inclusive and residential. Commercial contract maintenance with reporting is not published. $700/visit mid is a two-hander full day for 200 m2 - generous."},{"role":"replacement_plants_5pct","row_id":null,"source":null,"unit":"item","amount":{"low":340,"high":650},"centre":"Auckland","caveat":"ARITHMETIC CORRECTION: draft carried $1,600, which is 24% of plant supply. 5% of supply = $333; 5% of supply plus replant labour = $635. Use $650."},{"role":"qv_aggregate_crosscheck_lawn_300mm","row_id":"67276db1e671ba66bd024f427fb006d18440c9bece04a9ad64c65c6999708bd5:t2:r3","source":null,"unit":"m2","amount":{"low":57,"high":57},"centre":"Auckland","caveat":"SANITY CHECK ONLY - DO NOT BUILD UP FROM. Aggregate covering topsoil, seed, water and 6-month maintenance; combining it with the component rows above would double-count. The 150/300mm delta implies $156/m3 topsoil, but the instant-lawn pair (t2:r5/r6) implies $23/m3 - the two disagree 7x, so neither derivation is usable."}],"not_established":["Per-grade NZ nursery pricing for PB95, PB5 and PB2/1.5L stock - no published trade schedule found; retail indications only (Pittosporum $20-$350; PB2 grasses $2.99-$8.60+GST). Ring Naturally Native, Awapuni Nurseries, NZ Native Plant Centre, Southern Woods for an 850-plant schedule; expect 25-40% off retail at thi
