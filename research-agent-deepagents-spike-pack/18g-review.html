tiliser tablet unit cost","Imported screened garden mix topsoil supplied and placed into beds, $/m3 - QV row f8d9cf5a...:t10:r4 unpriced","Imported screened garden mix topsoil supply+cart+spread rate - QV rows t10:r4/r6/r8 all unpriced","Landscape establishment maintenance per visit for a 200 m2 commercial bed - no QV row, no published NZ contract rate","PB5 and PB2/1.5L trade prices at 50 and 800 plant volumes excl GST - listings found are retail/unclear GST status","PB95 specimen tree (2.0-2.5m, single leader) trade supply price - quoted on request by every NZ nursery searched, nothing published","PB95 specimen tree trade price (2.0-2.5m single leader) - QV row f8d9...t12:r5 unpriced, no published NZ trade rate found","Per-grade NZ nursery pricing for PB95, PB5 and PB2/1.5L stock - no published trade schedule found; retail indications only (Pittosporum $20-$350; PB2 grasses $2.99-$8.60+GST). Ring Naturally Native, Awapuni Nurseries, NZ Native Plant Centre, Southern Woods for an 850-plant schedule; expect 25-40% off retail at this volume.","Per-plant planting labour rates by grade (PB95 / PB5 / PB2) - QV rows exist but are unpriced; no published NZ rate found","Planting output rates per plant (plants per hour by grade) - not published by QV or any NZ source found","Whether the Central Landscapes $155/m3 garden mix figure is GST-inclusive - the buyer's guide does not state it. Treated as inclusive, which is the conservative reading for a retail page."],"review":{"state":"pending","decision":null,"reviewer":null,"note":null,"decided_at":null},"record_sha256":"44f4c55f7bf8dc39"},{"scenario_id":"glass-kitchen-splashback","title":"Glass splashback supply install","family":"fitout","unit":"m2","claims_covered":7,"status":"agreed","range":{"min":600,"max":850},"consensus":{"low":620,"high":790},"agreement":{"low_ratio":1.033,"high_ratio":1.334,"runs_with_band":3,"runs_total":3},"currency":"NZD","gst_basis":"exclusive","centre":"Auckland","as_of":"2026-09-22","basis":"QV row t24:r32 (glazed splashback, colourbacked low-iron toughened, supply and install) as the low; the 6mm Colourbak toughened row t4:r24 as the upper bound on the 5mm-to-6mm thickness step (+4.6%, giving ~$628/m2 for the specified 6mm). Covers glass supply and silicone-bed installation of plain panels only. Total on 4.32 m2 = $2,590-$2,750, GST exclusive, excludes prelims and margin. This is NOT the all-in rate for the scenario: the 3 factory cutouts, the template visit, CBD delivery and two-person handling, and the small-quantity loading at 4.32 m2 are all in scope, are unpublished, and can only add. The pinned band of $460-620/m2 sits below QV's own Auckland installed splashback row before any of those additions, and its $330/m2 glass supply and ~$48/hr labour lines are each about half the corresponding QV figure.","pinned_scope":"SCENARIO\nid: glass-kitchen-splashback-pinned\ntitle: Glass splashback supply install\nfamily: fitout\ncatalogue unit: m2 (per square metre of finished splashback face measured on the wall)\n\nSCOPE - FIXED. Do not substitute your own.\n  product:          6mm toughened low-iron float glass, back-painted single solid colour\n  finish:           polished flat edges all round, no bevel, no printed or digital graphic\n  panel sizing:     600mm high x 2400mm long panels, 3 panels, butt-jointed\n  nominal quantity: 4.32 m2 total (3 panels x 0.6m x 2.4m), one Auckland CBD office kitchenette\n  substrate:        13mm standard plasterboard on timber framing, level 4 stopped, plumb\n                    and flat within 3mm in 2m, ready to receive glass\n  cutouts:          3 cutouts total - 2 x double GPO (flush plate) and 1 x 40mm dia. tap\n                    penetration, all factory cut and polished before toughening\n  install:          neutral-cure silicone bed to the wall plus temporary support,\n                    ground floor, normal hours access\n\nINCLUDED, amortised over the 4.32 m2 nominal quantity:\n  - toughened back-painted glass panels, supplied to size\n  - site template / check measure visit, amortised over the 4.32 m2\n  - all 3 factory cutouts with polished arrises, amortised over the 4.32 m2\n  - delivery to an Auckland CBD site and two-person handling to a ground floor kitchenette\n  - neutral-cure silicone adhesive fixing and colour-matched perimeter silicone seal\n  - protection and clean off on completion\n\nEXCLUDED - do not price:\n  - GST, preliminaries, margin, design and consent fees\n  - the plasterboard substrate, its stopping, painting or any wall making-good\n  - removal of an existing splashback or tiling\n  - benchtops, joinery, appliances, electrical or plumbing fit-off\n  - scaffold, hoist, after-hours access or live-site restrictions\n  - custom colour matching outside the supplier's standard range, digital print or mirror glass\n\nPRICE\n\nBand, this exact scope: **$460 - $620 /m2**, midpoint approximately $530/m2.\n\nTotal for the 4.32 m2 nominal quantity: **$1,990 - $2,680**, midpoint approximately $2,290.\n\nBuild-up at the midpoint (NZD, excl GST, excl margin):\n\n| item | basis | total | $/m2 |\n|---|---|---|---|\n| 6mm toughened back-painted low-iron glass, polished edges | 4.32 m2 @ ~$330/m2 | $1,425 | $330 |\n| 3 cutouts (2 GPO, 1 tap) | $85 ea | $255 | $59 |\n| template / check measure visit | 1 visit, 1.5 hr + travel | $180 | $42 |\n| delivery and 2-person handling, CBD ground floor | lump | $150 | $35 |\n| install labour, silicone fixing and seal | 2 people x 3 hr @ ~$48/hr | $288 | $67 |\n| **total** | | **$2,298** | **$532** |\n\nWhy the band is wide at this size: the templating visit, delivery and the minimum install crew charge are nearly fixed, so they carry $144/m2 of the midpoint rate \u2014 about 27%. At 4.32 m2 you are close to most Auckland glaziers' minimum job charge (commonly $1,500-$1,800), which is why the bottom of the band does not fall further. A 15-20 m2 run of the identical specification would land nearer $380-$420/m2.\n\nConfidence: medium-high on the glass supply rate, medium on the fixed components, which vary most between suppliers. Figures are current Auckland market rates for a mid-market commercial fitout, subcontractor price to a main contractor.","runs":[{"run":"r1","low":600,"high":637,"resolved_from":"qv","confidence":"medium","basis":"QV row t24:r32 (glazed splashback, colourbacked low-iron toughened, supply and install) as the low; the 6mm Colourbak toughened row t4:r24 as the upper bound on the 5mm-to-6mm thickness step (+4.6%, giving ~$628/m2 for the specified 6mm). Covers glass supply and silicone-bed installation of plain panels only. Total on 4.32 m2 = $2,590-$2,750, GST exclusive, excludes prelims and margin. This is NOT the all-in rate for the scenario: the 3 factory cutouts, the template visit, CBD delivery and two-person handling, and the small-quantity loading at 4.32 m2 are all in scope, are unpublished, and can only add. The pinned band of $460-620/m2 sits below QV's own Auckland installed splashback row before any of those additions, and its $330/m2 glass supply and ~$48/hr labour lines are each about half the corresponding QV figure.","components":[{"role":"glazed splashback, supply and install, per m2 of face","row_id":"2dc5b4497e75a669b63791e1bce6bc7b6b7822720171a44ad93080bdfe1b8237:t24:r32","source":null,"unit":"m2","amount":{"low":600,"high":600},"centre":"Auckland","caveat":"UNREVIEWED QV row. Reads 'Colourbacking on 5mm Low Iron Toughened glass' - 5mm, not the 6mm specified. Supply-and-fix basis inferred from table neighbours (mirror cladding, balustrades, showers, pool fencing all installed), not stated. Flat across AKL/WLG/CHC. Excludes cutouts, templating, delivery, small-quantity loading. Aggregate row - components not added to it."},{"role":"thickness step 5mm to 6mm, back-painted toughened (adjustment basis only)","row_id":"2dc5b4497e75a669b63791e1bce6bc7b6b7822720171a44ad93080bdfe1b8237:t4:r24","source":null,"unit":"m2","amount":{"low":637,"high":637},"centre":"Auckland","caveat":"UNREVIEWED QV row. Colourbak standard colours on clear float TOUGHENED glass, 6mm, minimum charge 0.5m2. Clear float, not low iron. Paired with t4:r23 (5mm, AKL 609.00) this gives a +4.6% thickness step. Used as the upper bound and as the 5mm-to-6mm adjustment; NOT added to t24:r32."},{"role":"cross-check that Glazing:Other rates are installed","row_id":"2dc5b4497e75a669b63791e1bce6bc7b6b7822720171a44ad93080bdfe1b8237:t24:r3","source":null,"unit":"m2","amount":{"low":400,"high":400},"centre":"Auckland","caveat":"UNREVIEWED QV row. Mirror Cladding, 6mm Silver Mirror with polished edges, described as 'approximate rates'. Used only as evidence of the basis of table t24. Not part of the band."},{"role":"reference - polished flat edge (already inside the aggregate, NOT added)","row_id":"2dc5b4497e75a669b63791e1bce6bc7b6b7822720171a44ad93080bdfe1b8237:t20:r17","source":null,"unit":"m","amount":{"low":8.2,"high":8.2},"centre":"Auckland","caveat":"UNREVIEWED QV row. Flat Polished Edge Straight, 3-6mm thick glass. 18.0m of edge on 3 panels = $148, or $34/m2. Listed for transparency only - a component of the t24:r32 aggregate and deliberately excluded from the band."},{"role":"reference - arrised corners (already inside the aggregate, NOT added)","row_id":"2dc5b4497e75a669b63791e1bce6bc7b6b7822720171a44ad93080bdfe1b8237:t21:r2","source":null,"unit":"each","amount":{"low":4.6,"high":4.6},"centre":"Auckland","caveat":"UNREVIEWED QV row. Rough Arrised Corners, 3-6mm thick glass. 12 corners = $55. Component of the aggregate; excluded from the band. Note table t21 is titled 'Corners, Notches and Holes' but publishes corner rows only - no notch or hole rates exist."},{"role":"reference - glazier labour (basis for critiquing the pinned rate)","row_id":"77a9ea2e8b0f174651de8bdceb3c87c8c288ba10a5f707ee5c36267bf7395a8e:t0:r16","source":null,"unit":"hour","amount":{"low":96.4,"high":96.4},"centre":"Auckland","caveat":"UNREVIEWED QV row. Glazier, AKL 96.40 / WLG 85.4 own.\n  wall type:        64mm steel stud at 600mm centres, one layer 13mm standard\n                    plasterboard each face, R1.8 glasswool acoustic infill\n  rating:           no fire rating, no formal STC certification (non-rated office\n                    partition, tenancy-internal)\n  height:           2700mm floor to underside of suspended ceiling grid,\n                    head deflection track to soffit above, no plasterboard above ceiling\n  nominal quantity: 120 m2 of wall elevation, approximately 44 lineal metres,\n                    in one Auckland CBD office fitout, level 3, lift access\n  stopping:         Level 4 to AS/NZS 2589, ready for paint\n  openings:         THREE standard 980 x 2100mm door openings, steel stud jambs,\n                    trimmers and lintels only - no doors, frames or hardware\n  substrate:        level concrete slab, bottom track fixed by powder-actuated pin\n\nINCLUDED, amortised over the 120 m2 where not already per-unit:\n  - steel studs, top and bottom track, deflection head track, noggings, fixings\n  - 13mm standard plasterboard both faces, supplied and fixed\n  - R1.8 glasswool acoustic infill to the full stud cavity\n  - Level 4 stopping to both faces, all internal and external corners, corner bead\n  - acoustic sealant to head, base and abutments both faces\n  - framing to the three door openings, amortised across the 120 m2\n  - set-out, mobile scaffold or trestles to 2700mm, and offcut waste removal to skip\n\nEXCLUDED - do not price:\n  - GST, preliminaries, margin, design, consent fees\n  - painting, wallpaper or any decoration\n  - doors, door frames, hardware, glazing or vision panels\n  - any fire-rated or acoustic-rated system, and any fire or acoustic test report\n  - electrical, data, plumbing rough-in, and penetration patching for services\n  - skirting, cornice, bulkheads and plasterboard continuing above the ceiling line\n\nGive the band as $/m2 of wall elevation for this exact scope, and state the total for the\n120 m2 so the amortisation is auditable. Split the rate into framing, linings and\ninsulation, and stopping, so a reviewer can reject one part without the others.\n\nPrice it, or tell us honestly why you cannot.","runs":[{"run":"r1","low":190,"high":233,"resolved_from":"qv+web","confidence":"medium","basis":"Sum of the eleven components above, priced on the gross 120 m2 of wall elevation with no deduction for the three door openings (44 lm x 2.7m = 118.8 m2; openings total 6.17 m2, so net area is ~113.8 m2 and the gross measure over-states by ~5%, which roughly offsets the opening-framing extra-over). Total for 120 m2: $22,800 - $27,960. Midpoint ~$211/m2, ~$25,350. GST exclusive. Excludes preliminaries, margin, overhead, design, consent, painting, doors/frames/hardware, any fire or acoustic rating or test report, services rough-in, skirting, cornice, bulkheads, board above the ceiling line, and level 3 lift access / CBD hoisting. Sanity-checked against QV row ffb6248b...:t3:r3 (timber framed partition, 100x50 studs at 600, lined 2/1/10mm GIB, AKL $170/m2, no insulation or sealant) - consistent once 13mm board, insulation, sealant, scaffold and skip are added.","components":[{"role":"framing_base","row_id":"ffb6248bf6086c84825d2625b9c211d958dca5e8aa70e3a759aeaafe6d1664ff:t2:r4","source":null,"unit":"m2","amount":{"low":41.0,"high":41.0},"centre":"Auckland","caveat":"Aggregate row: 64mm partition, 0.55mm steel frame, dpc, studs at 600 crs, non load bearing. Includes top and bottom track. Unreviewed QV row. Do not also add separate track component rows."},{"role":"framing_nogging","row_id":"ffb6248bf6086c84825d2625b9c211d958dca5e8aa70e3a759aeaafe6d1664ff:t2:r12","source":null,"unit":"m2","amount":{"low":8.2,"high":8.2},"centre":"Auckland","caveat":"Add-extra per m2 for one row of 64mm steel nogging. One row assumed at 2700mm height."},{"role":"framing_deflection_head","row_id":null,"source":null,"unit":"m2","amount":{"low":0.0,"high":12.6},"centre":"Auckland","caveat":"DERIVED, NOT A QV ROW. High end substitutes Flex C Trac 64mm top track (row 1c18ef10...:t0:r38, $47.80/m) for 0.55BMT top track (row 1c18ef10...:t0:r7, $13.50/m): $34.30/m over 44 lm = $1509 over 120 m2. Low end assumes deep-leg track at no meaningful extra. QV publishes no deflection-head partition row. Largest single uncertainty in the framing rate."},{"role":"framing_door_openings","row_id":null,"source":null,"unit":"m2","amount":{"low":3.25,"high":5.0},"centre":"Auckland","caveat":"DERIVED, NOT A QV ROW. Extra-over per opening $130-$200, built from 64mm stud 0.70BMT (1c18ef10...:t0:r12, $16.90/m) and 64mm nogging 0.70BMT (1c18ef10...:t0:r32, $22.10/m) for boxed jambs, head trimmer and cripple. 3 openings amortised over 120 m2. QV has no steel stud opening-framing row."},{"role":"linings_supply_and_fix","row_id":"81f882b7bf5ec0b591c9f43b1a7882792b7e4308a0c638a2643cbb7a3000a8e2:t1:r7","source":null,"unit":"m2","amount":{"low":63.0,"high":63.0},"centre":"Auckland","caveat":"QV row is $55.00/m2 per face and BUNDLES supply, fix and L4 stopping. Decomposed by me as supply ~$15.40 (row 81f882b7...:t0:r7, retail, excl trade discount and margin) + fix ~$16.00 = ~$31.40/face, x2 faces. THE DECOMPOSITION IS MINE, NOT QV. Combined lining+stopping at face value is $110.00/m2 of wall elevation."},{"role":"insulation","row_id":"9bd8f998e94fb5e52699ed2b20902f0ecc410fad78bb9c156213c3ff5b2a2711:t27:r12","source":null,"unit":"m2","amount":{"low":13.8,"high":20.0},"centre":"Auckland","caveat":"SCOPE CONFLICT. Low end is the scope as written: R1.8 Pink Batts fitted between studs, but the only priced R1.8 wall product is 90mm thick and will not sit uncompressed in a 64mm cavity. QV publishes no R1.8 at 60-75mm. High end is Pink Batts Silencer 75mm to walls (row 9bd8f998...:t27:r25, $20.00/m2), which carries no stated R value. Product decision required before this rate is firm."},{"role":"acoustic_sealant","row_id":"81f882b7bf5ec0b591c9f43b1a7882792b7e4308a0c638a2643 l product combination; no published rate exists because the product does not.","Skip / bin hire and construction waste removal - absent from all 9816 indexed QV rows; sourced from Auckland vendor web pricing","Skip hire and construction waste disposal for an Auckland CBD fitout - no published QV row. Ring Waste Management NZ, EnviroWaste or Green Gorilla.","Skip or bin hire, and construction waste removal. No QV row anywhere in the index.","Standalone Level 4 stopping rate - QV rows 81f882b7...:t9:r2 and :t9:r4 exist but carry null prices for all three centres, so the lining/stopping split could not be sourced and had to be decomposed by judgement","Standalone Level 4 stopping rate to walls - QV row 81f882b7...:t9:r2 exists but is unpriced (null in AKL, WLG and CHC), so the framing / linings / stopping split the scenario asks for cannot be taken cleanly from QV. Stopping is bundled inside t1:r7.","Steel stud door opening framing (jambs, trimmers, lintels) - no QV row at any unit; built up from member rates","Trestle or hop-up hire for work to 2700mm. Only a 4m mobile scaffold tower is published."],"review":{"state":"pending","decision":null,"reviewer":null,"note":null,"decided_at":null},"record_sha256":"b6bd2a1db973af43"},{"scenario_id":"metering-control-instrumentation-wiring","title":"Metering and control wiring installation","family":"electrical","unit":"m","claims_covered":7,"status":"agreed","range":{"min":40.0,"max":85},"consensus":{"low":49.0,"high":69.0},"agreement":{"low_ratio":1.25,"high_ratio":1.269,"runs_with_band":3,"runs_total":3},"currency":"NZD","gst_basis":"exclusive","centre":"Auckland","as_of":"2026-09-22","basis":"First-principles build-up over 200m route / 8 runs / 16 terminations / 8 points / 1 BMS cabinet. Materials $9.20-17.45/m + labour 90-149hr @ QV Electrician $83.65 + scaffold 1.5-2.5wk @ QV $397. 200m total $10,000-$17,000 ex GST, ex prelims, ex margin. Cross-checks against QV conduited-circuit add-extra of $32.50/m.","pinned_scope":"SCENARIO\nid: metering-control-instrumentation-wiring-pinned\ntitle: Metering and control wiring installation\nfamily: electrical\ncatalogue unit: m (per lineal metre of installed control/instrumentation cable, measured along the cable route including containment)\n\nSCOPE - FIXED. Do not substitute your own.\n  cable:            2 pair 0.5mm2 overall-screened instrumentation cable, PVC/PVC,\n                    tinned copper drain wire, 300/500V (e.g. Belden 8723 equivalent)\n  containment:      20mm heavy-duty orange PVC conduit, saddled to existing concrete\n                    block wall / steel structure at 1.2m centres, surface run,\n                    accessible plant-room and covered-walkway environment\n  nominal quantity: 200 lineal metres total, made up of 8 field runs averaging 25m each\n  terminations:     16 field-end terminations (2 per run: device end and cabinet end),\n                    ferruled and landed on DIN-rail terminals, screened and earthed\n                    at the panel end only\n  field devices:    8 devices - 4 pulse-output water meters, 2 irrigation controller\n                    stations, 2 4-20mA pressure transmitters (devices supplied by others)\n  BMS interface:    ONE existing BMS field controller cabinet, 8 points landed to\n                    existing spare terminals, point-to-point continuity and loop\n                    testing per point\n  location:         Auckland, single-storey commercial site, work at 2.5m maximum\n                    height off a mobile scaffold or podium step\n\nINCLUDED, amortised over the 200m nominal quantity where not already per-unit:\n  - supply and install the instrumentation cable, drawn into conduit\n  - supply and install 20mm PVC conduit, saddles, bends, couplings and glands\n  - 16 terminations, ferrules, gland plates and cable identification at both ends\n  - screen earthing and continuity of the drain wire to the panel earth bar\n  - cable schedule markup and as-installed labelling of each run\n  - point-to-point continuity and insulation testing, 4-20mA loop injection on 2 loops\n  - the single BMS cabinet interface labour, amortised across the 200m\n  - mobile scaffold / podium step hire for the duration of the cable install\n\nEXCLUDED - do not price:\n  - GST, preliminaries, margin, design, consent fees\n  - the field devices, water meters, irrigation controllers and transmitters\n  - the BMS controller, any BMS software, point mapping, graphics or commissioning\n  - any new switchboard, panel, enclosure, circuit protection or 230V power supply\n  - underground trenching, directional drilling, core drilling or concrete penetrations\n  - after-hours work, live-site isolation permits, asbestos or working above 3m\n\nGive the band as $/m of installed cable route for this exact scope. State the total\nfor the 200m nominal quantity as well, so the amortisation is auditable.\n\nPrice it, or tell us honestly why you cannot.","runs":[{"run":"r1","low":50,"high":85,"resolved_from":"qv+web","confidence":"low","basis":"First-principles build-up over 200m route / 8 runs / 16 terminations / 8 points / 1 BMS cabinet. Materials $9.20-17.45/m + labour 90-149hr @ QV Electrician $83.65 + scaffold 1.5-2.5wk @ QV $397. 200m total $10,000-$17,000 ex GST, ex prelims, ex margin. Cross-checks against QV conduited-circuit add-extra of $32.50/m.","components":[{"role":"installation labour","row_id":"77a9ea2e8b0f174651de8bdceb3c87c8c288ba10a5f707ee5c36267bf7395a8e:t0:r10","source":null,"unit":"hour","amount":{"low":83.65,"high":83.65},"centre":"Auckland","caveat":"QV unreviewed labour cost rate for Electrician. Excludes prelims, margin, supervision. Hours applied (90-149 total) are my own constants, not published by QV."},{"role":"access plant","row_id":"253b838adc4d69933b82891e3d8333d2935553d0887a5909116772b2bba43150:t10:r46","source":null,"unit":"week","amount":{"low":397,"high":397},"centre":"Auckland","caveat":"QV unreviewed. Mobile Scaffold 2.4x1.2x4m. Index shows a bleed group label 'Generator Three phase, silenced' - verify against printed page. 1.5-2.5 weeks allowed."},{"role":"instrumentation cable supply","row_id":null,"source":"https://nz.rs-online.com/web/p/twisted-pair-multicore-data-cable/2824102","unit":"m","amount":{"low":3.5,"high":7.0},"centre":"Auckland","caveat":"Published anchor is Belden 8723, 152m reel, NZ$1020.61 ex GST = NZ$6.72/m, but it is 22AWG/0.34mm2 not 0.5mm2. NZ 0.5mm2 equivalents (Maser MAS5002ESCS, Firstflex) are trade-priced and unpublished. Band spans local equivalent to imported branded."},{"role":"20mm HD orange conduit, saddles, bends, couplings, glands","row_id":null,"source":"https://www.bunnings.co.nz/deta-heavy-duty-rigid-conduit-20mm_p4330850","unit":"m","amount":{"low":4.0,"high":7.0},"centre":"Auckland","caveat":"Retail-shelf inference. No NZ supplier publishes a per-metre trade rate. QV has no conduit row in Cable Carriers (t3) or anywhere else."},{"role":"termination consumables (ferrules, DIN terminals, gland plate, labels)","row_id":null,"source":null,"unit":"each","amount":{"low":12,"high":25},"centre":"Auckland","caveat":"Not published anywhere. 16 off. My own allowance."},{"role":"cross-check only - NOT a component of the band","row_id":"ac5fef027b3b97701b4e6d5f0228aeef6bc2088d99f06141256ba95cd2e107b0:t10:r10","source":null,"unit":"m","amount":{"low":32.5,"high":32.5},"centre":"Auckland","caveat":"QV 'add extra for PVC conduited circuit, based on 12m of conduit', $390 each. Used ONLY to sanity-check my conduit+draw-in build-up of $29-45/m. It is an add-extra over a light-point rate and must not be added to the build-up."}],"not_established":["QV publishes no rate for screened instrumentation / control cable of any size - Cable: Copper (t7) covers TPS and XLPE power cable only","QV publishes no per-metre rate for 20mm PVC conduit surface-run and saddled - Cable Carriers (t3) is tray, ladder and trunking only","QV publishes no rate for instrumentation terminations, ferruling, gland plates or screen earthing","QV publishes no rate for BMS point landing, point-to-point continuity testing or 4-20mA loop injection","No published NZ trade price per metre for 2pr 0.5mm2 overall-screened instrumentation cable - ring Maser NZ 09 414 0330, Ideal Electrical, Corys Electrical, Cable Supply Co","No published NZ trade price per metre for 20mm heavy-duty orange rigid conduit or saddles - ring Ideal Electrical, Corys, JA Russell, Iplex (Volta)","Labour constants (hr/m for conduit fixing and draw-in, hr per termination, hr per point tested) are my own and are not published by QV or any NZ source"]},{"run":"r2","low":49.0,"high":69.0,"resolved_from":"qv+web","confidence":"medium","basis":"Sum of six components, GST exclusive, NZD. Excludes preliminaries, margin, design, consent fees, field devices, BMS controller and software, any switchboard or 230V supply, penetrations and trenching, after-hours and permits, per the fixed scope. Total for the 200m nominal quantity: $9,800 - $13,800. Only the conduit line is anchored on a published QV rate; cable, terminations, testing and BMS interface are QS build-ups off QV Auckland electrician $83.65/hr. Auckland labour rate used throughout (AKL $83.65/hr vs WLG $68.70, CHC $80.60 - a Wellington version of this scenario would fall roughly 8-12% lower).","components":[{"role":"20mm PVC conduit, supply and install, saddled to block wall / steel, surface run","row_id":"ac5fef027b3b97701b4e6d5f0228aeef6bc2088d99f06141256ba95cd2e107b0:t4:r3","source":null,"unit":"m","amount":{"low":28.0,"high":36.0},"centre":"Auckland","caveat":"QV AKL $34.70/m unreviewed. Group header lost in capture; table t4 has a second block (r14-r16) at $60/m for 20mm, almost certainly galvanised steel, so r3 is read as PVC - verify against the licence. QV basis is 'fixed to concrete masonry, cast into concrete or installed in roof space', not surface-saddled at 1.2m centres. Banded +/-20% because the implied productivity (~2.6 m/hr) is slower than many Auckland subbies achieve on surface runs. Largest single sensitivity in the total."},{"role":"2pr 0.5mm2 overall-screened instrumentation cable, supply and draw into conduit","row_id":"ac5fef027b3b97701b4e6d5f0228aeef6bc2088d99f06141256ba95cd2e107b0:t35:r8","source":"https://nz.rs-online.com/web/p/twisted-pair-multicore-data-cable/8124772","unit":"m","amount":{"low":7.5,"high":11.0},"centre":"Auckland","caveat":"QV publishes no instrumentation cable row. Draw-in labour inferred from coax row t35:r8 ($5.80/m incl coax material) netted to ~$4/m labour and sundries - coax is a proxy, not this cable. Material $3.50-6.00/m ex GST extrapolated from RS NZ 1-pair 0.5mm2 at $3.45/m (1-off) / $2.84/m (5+), scaled 1.5-1.8x for 2-pair; NZ trade stockists (ASI, Maser, Firstflex) are login-gated with no public per-metre price. Includes ~5% waste."},{"role":"16 field-end terminations, ferruled, glanded, landed on DIN terminals, screen earthed at panel end","row_id":"77a9ea2e8b0f174651de8bdceb3c87c8c288ba10a5f707ee5c36267bf7395a8e:t0:r10","source":null,"unit":"m (amortised over 200m)","amount":{"low":6.0,"high":9.3},"centre":"Auckland","caveat":"No QV row for cable terminations exists. Build-up only: 0.6-0.85 hr per termination at QV Auckland electrician $83.65/hr (row unreviewed) plus $25-45 per termination for ferrules, glands, gland plate and markers. The hours are my assumption, not a published rate. Absolute $1,200-$1,860 over 16 terminations."},{"role":"Point-to-point continuity and insulation testing, 4-20mA loop injection on 2 loops, cable schedule markup and as-installed labelling","row_id":"77a9ea2e8b0f174651de8bdceb3c87c8c288ba10a5f707ee5c36267bf7395a8e:t0:r10","source":null,"unit":"m (amortised over 200m)","amount":{"low":3.35,"high":5.45},"centre":"Auckland","caveat":"No QV row for electrical testing or commissioning of light-current circuits. Build-up only: 8-13 hr at QV Auckland electrician $83.65/hr. Assumes loop calibrator is owned plant, not hired. Absolute $670-$1,090."},{"role":"BMS field controller cabinet interface, 8 points to existing spare terminals - attendance, panel earth bar, panel schedule","row_id":"77a9ea2e8b0f174651de8bdceb3c87c8c288ba10a5f707ee5c36267bf7395a8e:t0:r10","source":null,"unit":"m (amortised over 200m)","amount":{"low":1.25,"high":2.1},"centre":"Auckland","caveat":"No QV row for BMS interface labour. Build-up only: 3-5 hr at $83.65/hr. Covers cabinet access, wire-way management, drain wire to panel earth bar and schedule update ONLY - the 8 cabinet-end terminations themselves sit in the terminations component, so there is no double-count. Excludes BMS controller, software, point mapping, graphics and commissioning per scope."},{"role":"Mobile scaffold / podium step hire for duration of cable install","row_id":"253b838adc4d69933b82891e3d8333d2935553d0887a5909116772b2bba43150:t10:r46","source":null,"unit":"m (amortised over 200m)","amount":{"low":3.0,"high":5.0},"centre":"Auckland","caveat":"QV AKL $397/week for mobile scaffold 2.4 x 1.2 x 4m, unreviewed. Row is misfiled under a 'Generator Three phase, silenced' group header in the capture - description is unambiguous but the grouping is a capture artefact. 1.5-2.5 weeks assumed for 200m at 2.5m height. QV publishes no podium step rate; a podium would be cheaper than this."}],"not_established":["Instrumentation cable material price ex a New Zealand wholesaler - ASI Automation, Maser NZ, Firstflex and Ideal Electrical all gate per-metre pricing behind trade login; the only public NZ datapoint found is a 1-pair variant at RS NZ, scaled by assumption","Termination labour per cable end for ferruled screened instrumentation cable - no published NZ rate in QV or on the web; hours are a QS assumption","Continuity, insulation and 4-20mA loop testing labour - no published NZ rate; hours are a QS assumption","BMS field controller cabinet interface labour per point - no published NZ rate; hours are a QS assumption","Podium step hire rate - QV publishes mobile scaffold only","Whether QV table t4 rows r3-r5 are PVC and r14-r16 are galvanised steel - the group headers did not survive the local capture"]},{"run":"r3","low":40.0,"high":67.0,"resolved_from":"qv+web","confidence":"low","basis":"Composite build-up of seven components, each amortised over the 200m nominal quantity (8 runs x 25m). Total for 200m: $8,060 to $13,380 ex GST. Cross-checked against a first-principles hours estimate: approx 93 electrician hours at QV AKL $83.65/hr = $7,780 labour, plus approx $2,200 material and approx $800 access = approx $10,780, which sits at the midpoint of the band. Excludes GST, preliminaries, margin, design, consent fees, the field devices, the BMS controller and all BMS software or commissioning, any new switchboard or 230V supply, trenching or penetrations, after-hours work and work above 3m.","components":[{"role":"20mm HD PVC conduit, surface, saddled at 1.2m ctrs, incl bends/couplings/fixings and draw-in allowance","row_id":"ac5fef027b3b97701b4e6d5f0228aeef6bc2088d99f06141256ba95cd2e107b0:t10:r10","source":null,"unit":"m","amount":{"low":22.0,"high":33.0},"centre":"Auckland","caveat":"UNREVIEWED QV row, unit 'each' at AKL $390.00; $32.50/m derived by dividing by the 12m basis stated in the row's own description. Priced as an add-extra on a commercial LIGHTING subcircuit, so it embeds power-cable draw-in - proxy only, not a published 20mm conduit rate."},{"role":"2 pair 0.5mm2 OS instrumentation cable supplied and drawn into conduit","row_id":null,"source":"https://nz.rs-online.com/web/p/twisted-pair-multicore-data-cable/0822995","unit":"m","amount":{"low":7.5,"high":12.0},"centre":"Auckland","caveat":"QV publishes no screened instrumentation cable. RS NZ lists Belden 8723 at NZ$6.84/m INCL GST on a 304m reel (~$5.95 ex) but at 0.33mm2, not the specified 0.5mm2. Trade buy from Ideal/Cory's/JA Russell will differ. Includes draw-in labour at 15-25 m/hr and 10% waste."},{"role":"16 field terminations - ferrules, DIN-rail lan loop injection","QV publishes no rate for instrumentation terminations, ferruling, gland plates or screen earthing","QV publishes no rate for point-to-point continuity or 4-20mA loop injection testing per point - the Balancing and Commissioning table is mechanical plant only","QV publishes no rate for screened instrumentation / control cable of any size - Cable: Copper (t7) covers TPS and XLPE power cable only","QV publishes no row for 2 pair 0.5mm2 overall-screened instrumentation cable, or any screened instrumentation cable - the Cable: Copper table (72 rows) is power cable only and the only screened item in the book is 75-ohm coax","QV publishes no standalone rate for 20mm PVC conduit, surface run and saddled - the Cable Carriers table (14 rows) covers tray, ladder and trunking only","Termination labour per cable end for ferruled screened instrumentation cable - no published NZ rate in QV or on the web; hours are a QS assumption","Whether QV table t4 rows r3-r5 are PVC and r14-r16 are galvanised steel - the group headers did not survive the local capture"],"review":{"state":"pending","decision":null,"reviewer":null,"note":null,"decided_at":null},"record_sha256":"a7fcdafc1093df65"},{"scenario_id":"steel-connection-fabrication","title":"Structural steel connection fabrication upgrades","family":"structure","unit":"ea","claims_covered":7,"status":"disputed","range":{"min":180,"max":430},"consensus":{"low":195,"high":293},"agreement":{"low_ratio":1.278,"high_ratio":1.509,"runs_with_band":3,"runs_total":3},"currency":"NZD","gst_basis":"exclusive","centre":"Auckland","as_of":"2026-09-22","basis":"GST exclusive, NZD, Auckland. Excludes GST, preliminaries, margin, design/PS1/consent, the incoming members, galvanising, fire protection, finish coat, site welding, temporary works, propping, crane hire, scaffolding, edge protection, traffic management and NDT remedials. Also excludes shop IZS primer and CC2/MPI inspection, neither of which is published. 40 connections = $7,200-$11,400.","pinned_scope":"SCENARIO\nid: steel-connection-fabrication-pinned\ntitle: Structural steel connection fabrication upgrades\nfamily: structure\ncatalogue unit: ea (per completed connection, one member end to one supporting member)\n\nSCOPE - FIXED. Do not substitute your own.\n  connection type:  bolted flexible end plate / fin plate cleat, secondary beam to\n                    primary beam web, 310UB40 to 460UB74\n  plate:            10mm Grade 300 steel plate, 200 x 300mm, one per connection\n  welds:            6mm continuous fillet, both sides of plate, approx 600mm weld run,\n                    E48XX electrode, shop welded\n  bolts:            4 no. M20 8.8/S property class, galvanised, snug tight, site bolted\n  nominal quantity: 40 connections, one building, one delivery\n  work split:       plates cut, drilled and welded in the shop; bolting up on site off\n                    an existing EWP\n  finish:           shop primed 75 microns inorganic zinc silicate, touch up on site\n  inspection:       100% visual to AS/NZS 5131 CC2, plus 10% magnetic particle test\n                    on the fillet welds\n\nINCLUDED, amortised over the 40 connections where not already per-unit:\n  - plate supply, profile cut, drill and shop weld to the incoming member\n  - shop primer to the fabricated connection and site touch-up after bolting\n  - bolts, nuts and washers, supplied and installed\n  - shop detailing and CNC setup for the plate, amortised over the 40\n  - freight from an Auckland fabricator to an Auckland site, one delivery, amortised\n  - site labour to lift, land and bolt the connection, EWP hire amortised over the 40\n  - CC2 visual inspection and the 10% MPI, amortised over the 40\n\nEXCLUDED - do not price:\n  - GST, preliminaries, margin, design, PS1 and consent fees\n  - the incoming steel members themselves, already in the contract\n  - hot dip galvanising or any applied fire protection or finish coat\n  - site welding, temporary works, propping or crane hire\n  - scaffolding, edge protection and traffic management\n  - remedial work arising from failed NDT\n\nGive the band as $/ea for this exact scope, and state the total for the 40 connections\nso the amortisation is auditable.\n\nPrice it, or tell us honestly why you cannot.","runs":[{"run":"r1","low":180,"high":285,"resolved_from":"qv","confidence":"medium","basis":"GST exclusive, NZD, Auckland. Excludes GST, preliminaries, margin, design/PS1/consent, the incoming members, galvanising, fire protection, finish coat, site welding, temporary works, propping, crane hire, scaffolding, edge protection, traffic management and NDT remedials. Also excludes shop IZS primer and CC2/MPI inspection, neither of which is published. 40 connections = $7,200-$11,400.","components":[{"role":"plate supply, profile cut, drill, shop weld, shop detailing","row_id":"52d4a068b2aced2722dab3e921b35879d1a60fc34fe3b6d61a4a3aec5c10b994:t2:r45 / :t2:r44","source":null,"unit":"ea","amount":{"low":85,"high":130},"centre":"Auckland","caveat":"Aggregate build-up rows $20.80-$31.80/kg at 120-200 hrs fab/tonne x 4.71 kg plate; divided by 1.15 to strip the 15% margin embedded per :t2:r20. Still contains $1.60/kg crane/plant/overhead. Do not also add :t2:r19 shop drawings - already inside. Unreviewed."},{"role":"bolts, 4 no. M20 8.8 supply","row_id":"52d4a068b2aced2722dab3e921b35879d1a60fc34fe3b6d61a4a3aec5c10b994:t8:r20","source":null,"unit":"ea","amount":{"low":38,"high":55},"centre":"Auckland","caveat":"$9.60 ea x 4. QV row is ungalvanised HSFG grade 8.8; galvanised 8.8/S snug-tight not published. High end carries gal uplift. Row may be supply-and-fix, risking partial overlap with the erector line."},{"role":"site labour to lift, land and bolt","row_id":"77a9ea2e8b0f174651de8bdceb3c87c8c288ba10a5f707ee5c36267bf7395a8e:t0:r31","source":null,"unit":"ea","amount":{"low":46,"high":73},"centre":"Auckland","caveat":"Steel Erector $91.50/hr x 0.5-0.8 man-hr. Output rate is my assumption, not a QV row."},{"role":"EWP hire amortised over 40","row_id":"253b838adc4d69933b82891e3d8333d2935553d0887a5909116772b2bba43150:t8:r5 / :t8:r12","source":null,"unit":"ea","amount":{"low":12,"high":18},"centre":"Auckland","caveat":"Electric scissor 12m $163/day to articulated electric boom 15m $237/day; 3 days assumed over 40 connections. Day count is my assumption."},{"role":"freight Auckland fabricator to Auckland site, amortised","row_id":"52d4a068b2aced2722dab3e921b35879d1a60fc34fe3b6d61a4a3aec5c10b994:t2:r8","source":null,"unit":"ea","amount":{"low":1,"high":2},"centre":"Auckland","caveat":"Cartage and unloading $0.30/kg x 4.71 kg of added connection steel on a load already carrying the excluded members."},{"role":"site touch-up primer after bolting","row_id":"a4bbf7211339ad80044429f4a2aa721d5ac5c61f6fe4a34f6afb9ccae5475570:t3:r8","source":null,"unit":"ea","amount":{"low":1,"high":3},"centre":"Auckland","caveat":"Enamel touch-up primer $6.40/m2 x ~0.13 m2 plate area. Not a zinc silicate touch-up rate; nearest published proxy."},{"role":"shop primer 75 micron inorganic zinc silicate","row_id":"52d4a068b2aced2722dab3e921b35879d1a60fc34fe3b6d61a4a3aec5c10b994:t12:r7","source":null,"unit":"m2","amount":{"low":null,"high":null},"centre":"Auckland","caveat":"QV carries the row but every rate in the surface-treatments table is blank in all three centres. No NZ $/m2 published. Excluded from the band."},{"role":"CC2 visual inspection and 10% MPI, amortised","row_id":null,"source":null,"unit":"ea","amount":{"low":null,"high":null},"centre":"Auckland","caveat":"No QV row and no NZ published rate. NDT is quoted per callout with a half-day minimum, so 4 tested welds is a lump sum that does not amortise cleanly. Sits on top of the band."}],"not_established":["Shop primer, 75 micron inorganic zinc silicate, $/m2 - QV row 52d4a068...:t12:r7 exists but is unpriced in AKL, WLG and CHC; no NZ rate published on the web","CC2 visual inspection to AS/NZS 5131, $/connection or $/visit","10% magnetic particle test on fillet welds, $/weld or $/callout - NZ NDT firms quote per job, no published schedule","Shop fillet weld, 5/6mm, $/m - QV rows 52d4a068...:t6:r9 and :t6:r11 both blank in all centres","Galvanised M20 8.8/S structural bolt, supply - QV only carries ungalvanised HSFG 8.8 and galvanised grade 4.6"]},{"run":"r2","low":195,"high":293,"resolved_from":"qv","confidence":"medium","basis":"Sum of the six established components. Total for 40 connections = $7,800 to $11,720. Band INCLUDES the ~13% fabricator margin embedded in the QV plate rate, which your scope excludes; strip it and the band is $182-$274/ea, $7,280-$10,960 for 40. Band EXCLUDES the CC2 visual and 10% MPI line entirely. GST exclusive.","components":[{"role":"plate supply, profile cut, drill, shop weld, shop detailing/CNC amortised, shop plant","row_id":"52d4a068b2aced2722dab3e921b35879d1a60fc34fe3b6d61a4a3aec5c10b994:t2:r49 / :t2:r44","source":null,"unit":"ea (4.71 kg plate @ $20.80-$31.80/kg)","amount":{"low":98.0,"high":149.8},"centre":"Auckland","caveat":"Rate is $/kg supply-and-erect. Low uses brackets at 120 hrs/tonne, high uses connection plates at 200 hrs/tonne; 200 hrs/t (~0.94 hr/plate) is the better fit for cut + 4 holes + 600mm double fillet. Embeds 15% margin and 7.5% shop drawings per build-up rows :t2:r16-:t2:r20, both of which your scope excludes. Weld is INSIDE this rate - do not add :t6:r9."},{"role":"bolts, 4 no. M20, supplied and installed","row_id":"52d4a068b2aced2722dab3e921b35879d1a60fc34fe3b6d61a4a3aec5c10b994:t8:r21 / :t8:r10","source":null,"unit":"ea (4 bolts)","amount":{"low":43.2,"high":52.4},"centre":"Auckland","caveat":"No QV row is M20 8.8/S galvanised. Low = 4 x $10.80 (8.8 HSFG M20x75, galvanising not stated); high = 4 x $13.10 (galvanised grade 4.6 M20x100) as a galvanising/length proxy. Unstated whether rate is supply-only or supply-and-fix, so possible small overlap with erector labour."},{"role":"site labour to lift, land and bolt the connection","row_id":"77a9ea2e8b0f174651de8bdceb3c87c8c288ba10a5f707ee5c36267bf7395a8e:t0:r31","source":null,"unit":"ea (0.5-0.8 man-hr @ $91.50/hr)","amount":{"low":45.75,"high":73.2},"centre":"Auckland","caveat":"QV publishes the Steel Erector hourly rate only; the 0.5-0.8 man-hr allowance is my judgement for a 2-man crew off an EWP, not a QV output. Plates build-up carries no site erection line (unlike UB build-up :t2:r9), so no double count."},{"role":"EWP hire, amortised over 40 connections","row_id":"253b838adc4d69933b82891e3d8333d2935553d0887a5909116772b2bba43150:t8:r3 / :t8:r5","source":null,"unit":"ea (2-3 days / 40)","amount":{"low":6.0,"high":12.25},"centre":"Auckland","caveat":"Electric scissor 10m compact $120/day to 12m $163/day. Day count is my allowance from the labour hours, not published. Excludes delivery/pickup of the EWP."},{"role":"freight, Auckland fabricator to Auckland site, one delivery, amortised","row_id":"52d4a068b2aced2722dab3e921b35879d1a60fc34fe3b6d61a4a3aec5c10b994:t2:r8","source":null,"unit":"ea","amount":{"low":0.0,"high":1.41},"centre":"Auckland","caveat":"$0.30/kg cartage-and-unloading row is from the universal beam build-up, applied here to plate weight. True incremental freight is near nil because the plates travel shop-welded to members already in the delivery."},{"role":"shop primer 75 micron inorganic zinc silicate plus site touch-up","row_id":"a4bbf7211339ad80044429f4a2aa721d5ac5c61f6fe4a34f6afb9ccae5475570:t3:r7 / :t3:r8","source":null,"unit":"ea (~0.15 m2)","amount":{"low":2.0,"high":4.0},"centre":"Auckland","caveat":"PROXY ONLY, low confidence. QV's correct IZS row :t12:r7 exists but every price cell is null. Substituted interior metalwork zinc phosphate primer $8.60/m2 and touch-up primer $6.40/m2, which is a cheaper system than IZS - expect the real shop rate to exceed this."},{"role":"CC2 visual inspection and 10% MPI, amortised","row_id":null,"source":null,"unit":"ea","amount":{"low":null,"high":null},"centre":"Auckland","caveat":"NOT ESTABLISHED. QV indexes no NDT or weld inspection rows. No NZ NDT provider publishes a rate card. PayScale's NZ$42/hr MT figure is a wage, not a charge-out rate, and does not establish a price."}],"not_established":["CC2 visual inspection and 10% magnetic particle testing on the fillet welds - no QV row, no published NZ rate card","shop-applied 75 micron inorganic zinc silicate primer - QV row 52d4a068...:t12:r7 carries the right description but null prices in all three centres; priced here by proxy only","shop fillet weld 5/6mm as a standalone m rate - QV row 52d4a068...:t6:r9 is null-priced (not needed here, it is inside the per-kg fabrication rate)","drill bolt holes as a standalone each rate - QV row 52d4a068...:t6:r2 is null-priced","an exact M20 8.8/S galvanised structural bolt assembly rate"]},{"run":"r3","low":230,"high":430,"resolved_from":"qv","confidence":"medium","basis":"Sum of the six components above, rounded. 40 connections = $9,200 to $17,200 excl GST. Excludes the 10% MPI and the shop IZS primer, neither of which is established. Add 20% (QV :t2:r2, quantities below 1000 kg) if the 188 kg of connection plate is let as a standalone parcel rather than inside a larger steel package.","components":[{"role":"fabricated plate: supply, profile cut, drill, shop weld, shop detailing/CNC, plant, fabricator margin","row_id":"52d4a068b2aced2722dab3e921b35879d1a60fc34fe3b6d61a4a3aec5c10b994:t2:r45 / :t2:r44 / :t2:r46","source":null,"unit":"ea (4.71 kg plate)","amount":{"low":98,"high":182},"centre":"Auckland","caveat":"Aggregate supply-and-erect rate per kg (120/200/250 fab hr per tonne). Per the same table's build-up rows r16-r21 it already includes steel supply, shop fab, crane/plant/overheads, 7.5% shop drawings and 15% fabricator margin - do not add its own components. Unreviewed row."},{"role":"bolts, 4 no. M20 x 75 grade 8.8, supply and install","row_id":"52d4a068b2aced2722dab3e921b35879d1a60fc34fe3b6d61a4a3aec5c10b994:t8:r21","source":null,"unit":"ea (4 bolts)","amount":{"low":43,"high":56},"centre":"Auckland","caveat":"QV row reads 'High Strength Friction Grip Bolt Grade 8.8' - does not state galvanised, and category is /TF not /S snug tight. High end uplifted using galvanised 4.6 row :t8:r10 ($13.10) as a proxy. Unreviewed row."},{"role":"site labour to lift, land and bolt the connection","row_id":"77a9ea2e8b0f174651de8bdceb3c87c8c288ba10a5f707ee5c36267bf7395a8e:t0:r31","source":null,"unit":"ea","amount":{"low":69,"high":137},"centre":"Auckland","caveat":"QV Steel Erector AKL $91.50/hr is the published figure; the 0.75-1.5 man-hr per connection is my allowance, not published."},{"role":"EWP hire amortised over 40 connections","row_id":"253b838adc4d69933b82891e3d8333d2935553d0887a5909116772b2bba43150:t8:r3 / :t8:r11","source":null,"unit":"ea","amount":{"low":15,"high":25},"centre":"Auckland","caveat":"Electric scissor 10m compact $120/day to articulated electric boom 12m $202/day; 5 days assumed over 40 connections. Partly overlaps the $1.60/kg crane/plant/overheads already inside the plate rate (~$7/ea)."},{"role":"site touch-up primer after bolting","row_id":"77a9ea2e8b0f174651de8bdceb3c87c8c288ba10a5f707ee5c36267bf7395a8e:t0:r22","source":null,"unit":"ea","amount":{"low":7,"high":14},"centre":"Auckland","caveat":"QV Painter AKL $70.25/hr applied at 0.1-0.2 hr per connection; the hours are my allowance. QV touch-up primer row a4bbf721...:t3:r8 at $6.40/m2 gives under $1 on 0.13 m2, which understates the visit."},{"role":"freight, Auckland fabricator to Auckland site, one delivery amortised","row_id":null,"source":null,"unit":"ea","amount":{"low":0,"high":15},"centre":"Auckland","caveat":"No QV row for a dedicated steel delivery. 188 kg of plate welded to members already being freighted under the contract is a near-nil marginal cost; high end allows a separate truck charge. QV :t2:r8 cartage $0.30/kg exists but is a component of the UB/UC build-up and must not be mixed with the plate aggregate."}],"not_e ble rate. Ring Altex Coatings, Patton Engineering, Hamilton Blast and Paint.","Shop primer, 75 micron inorganic zinc silicate, $/m2 - QV row 52d4a068...:t12:r7 exists but is unpriced in AKL, WLG and CHC; no NZ rate published on the web","an exact M20 8.8/S galvanised structural bolt assembly rate","drill bolt holes as a standalone each rate - QV row 52d4a068...:t6:r2 is null-priced","shop fillet weld 5/6mm as a standalone m rate - QV row 52d4a068...:t6:r9 is null-priced (not needed here, it is inside the per-kg fabrication rate)","shop-applied 75 micron inorganic zinc silicate primer - QV row 52d4a068...:t12:r7 carries the right description but null prices in all three centres; priced here by proxy only"],"review":{"state":"pending","decision":null,"reviewer":null,"note":null,"decided_at":null},"record_sha256":"a2dab0904ea787cb"},{"scenario_id":"interior-finishes-to-schedule","title":"Interior finishes to schedule","family":"fitout","unit":"sum","claims_covered":6,"status":"agreed","range":{"min":135000,"max":207000},"consensus":{"low":137000,"high":197000},"agreement":{"low_ratio":1.022,"high_ratio":1.084,"runs_with_band":3,"runs_total":3},"currency":"NZD","gst_basis":"exclusive","centre":"Auckland","as_of":"2026-09-22","basis":"Sum of the twelve components above at the stated scope quantities (220 m2 vinyl WC, 340 m2 paint, 640 m2 carpet tile, 90 m2 LVT, 24 m2 batten wall, 260 m MDF skirting, 730 m2 latex smoothing, plus five package lines). Excl GST, preliminaries, margin, design and consent fees per scope. Midpoint ~$171,000 = $214/m2 over 800 m2 NLA. Band is driven mainly by the carpet tile spread ($85-120/m2 = +/-$11,200), the unpublished out-of-hours loading ($12,000 spread) and the latex smoothing rate ($10,200 spread).","pinned_scope":"SCENARIO\nid: interior-finishes-to-schedule-pinned\ntitle: Interior finishes to schedule\nfamily: fitout\ncatalogue unit: sum (for the whole finishes-schedule package on one tenancy floor)\n\nSCOPE - FIXED. Do not substitute your own.\n  building / area:   Auckland CBD office tenancy fitout, one floor, 800 m2 NLA,\n                     level 4 of an existing multi-storey building, lift access only\n  wall finish A:     vinyl wall covering, Type II 20 oz/lin yd commercial, to\n                     plasterboard - 220 m2 (reception, lift lobby, meeting room walls)\n  wall finish B:     acrylic feature paint to plasterboard, 2 coats over sealer,\n                     low-sheen, one accent colour - 340 m2\n  floor finish:      loose-lay carpet tile, 500x500mm, solution-dyed nylon,\n                     EN 1307 Class 33 heavy commercial, ~800 g/m2 pile - 640 m2\n  hard floor finish: LVT plank, 2.5mm gauge, 0.55mm wear layer, loose-lay, to\n                     tea point and circulation - 90 m2\n  feature finish:    vertical timber batten wall, 42x19mm pine battens at 60mm\n                     centres, clear lacquer, on painted MDF substrate - 24 m2\n  skirting / trim:   MDF skirting 100x18mm, painted, 260 lineal metres\n\nINCLUDED, amortised over the nominal quantity where not already per-unit:\n  - supply and install of all six finishes listed above, to the stated quantities\n  - substrate preparation: sanding, stopping and sealing of already-lined and\n    stopped plasterboard; latex smoothing compound to 100% of floor area\n  - adhesives, trims, edge strips, carpet-to-LVT transition strips, nosings\n  - the timber batten substrate (painted MDF backing) and its fixing\n  - protection of finished surfaces to practical completion\n  - offcut waste allowance and rubbish removal from site to skip\n  - one site measure and one set of shop-standard setout drawings\n  - out-of-hours access loading for a live building, amortised over the package\n\nEXCLUDED - do not price:\n  - GST, preliminaries, margin, design fees, consent fees\n  - plasterboard linings, partitions, framing, stopping to Level 4 (base build trade)\n  - ceilings, acoustic tile, suspended grid and ceiling paint\n  - joinery, benchtops, splashbacks, glazing film and signage\n  - floor levelling beyond latex smoothing compound - no grinding or self-levelling screed\n  - asbestos survey, removal of existing finishes, or make-good of existing substrates\n  - scaffolding, hoists and permanent lift protection\n\n**Price: $148,000 - $196,000 excl GST for the whole package.** Midpoint $170,000, which is $213/m2 over the 800 m2 NLA.\n\nAuditable build-up at the midpoint:\n\n| Item | Qty | Rate (excl GST) | Total |\n|---|---|---|---|\n| Vinyl wall covering, Type II | 220 m2 | $88/m2 | $19,400 |\n| Acrylic feature paint, 2 coats + sealer | 340 m2 | $38/m2 | $12,900 |\n| Carpet tile, Class 33 SDN | 640 m2 | $105/m2 | $67,200 |\n| LVT plank, 0.55mm wear layer | 90 m2 | $145/m2 | $13,100 |\n| Timber batten feature wall incl. MDF substrate | 24 m2 | $560/m2 | $13,400 |\n| MDF skirting, supplied and painted | 260 m | $42/m | $10,900 |\n| Latex smoothing compound, 100% of floor | 730 m2 | $22/m2 | $16,100 |\n| Trims, transitions, nosings, protection, waste | package | \u2014 | $9,800 |\n| Site measure, setout, out-of-hours access loading | package | \u2014 | $7,200 |\n| **Total** | | | **$170,000** |\n\nBand drivers: carpet tile is the largest single line, and the $80\u2013$135/m2 supply-and-lay range for Class 33 solution-dyed nylon alone swings the package by \u00b1$16,000. The vinyl wall covering and batten wall carry the next-widest spread, because both are labour-dominant and sensitive to how much of the work falls outside normal hours.\n\nNext: if your real schedule has different quantities, swap the six quantity lines and keep the rates \u2014 the build-up is linear except for the two package lines.","runs":[{"run":"r1","low":135000,"high":207000,"resolved_from":"qv+web","confidence":"medium","basis":"Sum of the twelve components above at the stated scope quantities (220 m2 vinyl WC, 340 m2 paint, 640 m2 carpet tile, 90 m2 LVT, 24 m2 batten wall, 260 m MDF skirting, 730 m2 latex smoothing, plus five p aveat":"UNREVIEWED QV row. 'Underground Service Main, Factory, Heavy 500A/Phase'. Used as the HIGH bound since 420A sits between the 300A and 500A brackets. Aggregate rate - do not decompose alongside its own cable components."},{"role":"LV service cabling subtotal, 25m","row_id":null,"source":null,"unit":"sum","amount":{"low":20250,"high":30000},"centre":"Auckland","caveat":"25m x $810-$1,200/m, interpolating the two QV Service Mains brackets above. Equivalent to $67.50-$100/kVA over 300 kVA. Trenching excluded per scope and likely excluded from the QV rate."},{"role":"Vector design fee, complex connection","row_id":null,"source":"https://vector.co.nz/our-services/electricity/complex-connection","unit":"each","amount":{"low":3000,"high":3000},"centre":"Auckland","caveat":"Published Vector fee, GST exclusive, payable to proceed to detailed design. Scope excludes design fees, so include or exclude per the reviewer's reading. Application/assessment fee and ICP creation are not separately published."},{"role":"Coordination and energisation attendance, labour rate only","row_id":"77a9ea2e8b0f174651de8bdceb3c87c8c288ba10a5f707ee5c36267bf7395a8e:t0:r10","source":null,"unit":"hour","amount":{"low":83.65,"high":83.65},"centre":"Auckland","caveat":"UNREVIEWED QV Labour Rates row, Electrician AKL. Rate only - the scope does not state coordination hours, so no total is offered. Not extended to avoid inventing a quantity."},{"role":"Vector capital contribution incl. network-owned 300 kVA transformer and HV protection","row_id":null,"source":"https://blob-static.vector.co.nz/blob/vector/media/vector/160122_v1-0_policy-for-determining-capital-contributions_electricity-distribution.pdf","unit":"sum","amount":{"low":null,"high":null},"centre":"Auckland","caveat":"Not published. Vector's policy states the method (incremental 'but for' cost plus development contribution) but no rate. Firm price only via Customer Works Agreement after detailed design. Renamed 'one-off connection charg overed":6,"status":"disputed","range":{"min":35,"max":75},"consensus":{"low":45,"high":68},"agreement":{"low_ratio":1.371,"high_ratio":1.25,"runs_with_band":3,"runs_total":3},"currency":"NZD","gst_basis":"exclusive","centre":"Auckland","as_of":"2026-09-22","basis":"QV per-head build-up (t4:r4 + t4:r3 + t8:r4) gives $31.24/m2 = $93,724, but omits the alarm valve set, 65-150mm mains, seismic restraint and commissioning, none of which QV prices. Two QV aggregates bracket from above: dry-pipe system t7:r1 at $68/m2 (dry, and includes excluded mains) and all-fire-services t0:r16 at $97/m2 (includes excluded detection/alarm). Band spans the adjusted floor to the sprinkler-only share of the all-services rate. Total 3,000 m2 = $135,000 to $225,000, GST exclusive.","pinned_scope":"SCENARIO\nid: sprinkler-system-installation-pinned\ntitle: Fire sprinkler system installation\nfamily: fire\ncatalogue unit: m2 (per square metre of sprinklered floor area)\n\nSCOPE - FIXED. Do not substitute your own.\n  standard:         NZS 4541:2020, wet pipe, single occupancy classification\n  hazard class:     Ordinary Hazard Group 3 (OH3) - warehouse/retail back-of-house\n  nominal area:     3,000 m2 sprinklered floor area on one level, single building\n  building type:    single-storey tilt-slab warehouse/light industrial, 8.0m to underside\n                    of portal, no in-rack or high-piled storage\n  head type:        pendent quick-response, 68degC, 15mm K80, chrome rosette, to a\n                    suspended grid over 400 m2 of office only; exposed upright elsewhere\n  head spacing:     4.0m x 3.0m maximum, 12 m2 per head coverage - approx 250 heads\n  pipework:         grooved/screwed galvanised steel to AS 1074 medium, threaded rod\n                    and clip hangers to steel purlins\n  valve set:        ONE alarm valve set with flow switch, drain, test connection and\n                    bell, amortised over the 3,000 m2\n\nINCLUDED, amortised over the nominal quantity where not already per-unit:\n  - all sprinkler heads, escutcheons and head guards where exposed\n  - distribution, range and main pipework, fittings, hangers and seismic restraint\n    (sway bracing and flexible drops) to NZS 4541\n  - the single alarm valve set, flow switch and external bell, amortised over 3,000 m2\n  - block plan, signage, hydraulic verification of the existing design, flushing,\n    pressure test and wet commissioning\n  - sprinkler monitoring interface to the fire alarm panel (terminals only)\n  - EWOF-supporting documentation: as-builts and Form 6A/PS3 for the sprinkler works\n  - scissor lift / EWP access within the warehouse for installation\n\nEXCLUDED - do not price:\n  - GST, preliminaries, margin, hydraulic design, PS1 and consent fees\n  - fire pump, pump shed, tanks, town main upgrade and incoming connection\n  - fire alarm panel, detection, sounders and any electrical supply or containment\n  - in-rack sprinklers, ESFR heads, dry/pre-action systems and antifreeze loops\n  - penetration fire-stopping through rated walls/floors and structural steel modifications\n  - after-hours work, staged occupied-building handovers and builder's work in existing ceilings\n\nGive the band as $/m2 of sprinklered floor area for this exact scope, and state the total\nfor the 3,000 m2 so the amortisation is auditable.\n\nPrice it, or tell us honestly why you cannot.","runs":[{"run":"r1","low":45,"high":75,"resolved_from":"qv","confidence":"low","basis":"QV per-head build-up (t4:r4 + t4:r3 + t8:r4) gives $31.24/m2 = $93,724, but omits the alarm valve set, 65-150mm mains, seismic restraint and commissioning, none of which QV prices. Two QV aggregates bracket from above: dry-pipe system t7:r1 at $68/m2 (dry, and includes excluded mains) and all-fire-services t0:r16 at $97/m2 (includes excluded detection/alarm). Band spans the adjusted floor to the sprinkler-only share of the all-services rate. Total 3,000 m2 = $135,000 to $225,000, GST exclusive.","components":[{"  test connection, external bell) - no QV row; Viking NZ and Tyco publish no list price. Ring Viking Sales and Services, Penrose, 09 525 0233.","Alarm valve set assembly with flow switch, drain, test connection and bell - no QV row; t6:r10 150mm flanged gate valve at $1,780 is a component inside the set, not the set","Alarm valve set \u2014 150mm wet alarm valve, trim, flow switch, drains, test connection, external bell. No QV row; Viking NZ and Tyco publish no NZ price. Single item amortised over 3,000 m2, so materially affects the rate.","Any published NZ wet-pipe sprinkler rate expressed per m2 of sprinklered area - QV publishes a dry-pipe per-m2 row only.","Distribution and main pipework 65mm-150mm - QV galvanised fire pipe table t5 stops at 50mm (t5:r5, $108/m AKL); extrapolation to mains sizes refused","Flushing, pressure test, wet commissioning, block plan and signage, as-builts and Form 6A/PS3 - no QV row.","Flushing, pressure test, wet commissioning, block plan, signage and Form 6A/PS3 documentation as separate items \u2014 not separately published in QV.","Mains, riser and distribution pipework 65mm to 150mm galvanised steel to AS 1074. QV Fire Pipework table t5 stops at 50mm for galvanised steel.","No NZ-published $/m2 sprinkler rate found on the web; no NZ alarm valve set pricing published","Seismic restraint to NZS 4541 - sway bracing and flexible drops. No QV row for services seismic restraint.","Seismic restraint to NZS 4541 \u2014 sway bracing, flexible drops, purlin attachment. No QV row exists.","Seismic restraint, sway bracing and flexible drops to NZS 4541 - no QV row for services seismic restraint","Sprinkler monitoring interface terminals to fire alarm panel - no QV row at terminals-only scope","Sprinkler monitoring interface terminals to the fire alarm panel - no QV row at terminals-only scope.","Wet commissioning, flushing, pressure test, block plan, signage, as-builts and Form 6A/PS3 - no QV row","Wet-pipe-specific system rate per m2 \u2014 QV publishes dry pipe only."],"review":{"state":"pending","decision":null,"reviewer":null,"note":null,"decided_at":null},"record_sha256":"3cfab10491999f22"},{"scenario_id":"data-rack-and-network-hardware","title":"Data rack and network hardware","family":"electrical","unit":"ea (per completed comms rack, 96 certified links)","claims_covered":5,"status":"agreed","range":{"min":24000,"max":42000},"consensus":{"low":28000,"high":42000},"agreement":{"low_ratio":1.25,"high_ratio":1.105,"runs_with_band":3,"runs_total":3},"currency":"NZD","gst_basis":"exclusive","centre":"Auckland","as_of":"2026-09-22","basis":"Bottom-up rebuild of the pinned scope using web-verified NZ vendor pricing for rack, switches, switched PDUs and leads, plus a QV-benchmarked labour rate and an unpublished per-link build-up for termination/labelling/certification. Low case: trade buying, Dynamix-grade panels, CBS350 at approx $3100, 5% contingency. High case: branded panels and leads, switch at approx $4600, 32hr labour at $125/hr, 10% contingency. Centre approx $30,000, or $313/link. GST, prelims, margin, design and consent excluded per scope. Sits below the pinned $36,000-$48,000 band principally because the pinned $7600/switch is roughly double NZ published pricing for the specified 740W PoE+ 4x10G SFP+ unit, partly offset by the pinned $900 switched PDU being below the $1527 published rate.","pinned_scope":"SCENARIO\nid: data-rack-and-network-hardware-pinned\ntitle: Data rack and network hardware\nfamily: electrical\ncatalogue unit: ea (per completed comms rack, fully populated and tested)\n\nSCOPE - FIXED. Do not substitute your own.\n  rack:             42RU floor-standing, 800mm wide x 1000mm deep, perforated front\n                    and rear doors, black, static load 800kg, on plinth\n  nominal quantity: ONE rack serving 96 copper outlets (48 workstation positions)\n  patching:         4 x 24-port Cat6A UTP patch panels, 1RU, rear-punchdown, plus\n                    2 x 1RU brush cable managers and 2 x 1RU horizontal managers\n  switching:        2 x 48-port Gigabit managed L2/L3 access switches, 4 x 10G SFP+\n                    uplinks, full PoE+ 30W on all ports (740W budget each), 1RU\n  power:            2 x 1RU 8-way C13 rack PDU, 16A, switched, plus UPS excluded\n  cabling:          96 x Cat6A U/UTP terminations at the rack end ONLY, dressed and\n                    labelled; 100 x 2m Cat6A patch leads (96 + 4 spare)\n  testing:          permanent-link certification to TIA-568.2-D / ISO Class EA on\n                    all 96 links, Fluke DSX-class tester, PDF results per link\n\nINCLUDED, amortised over the one rack / 96 links:\n  - rack, plinth, doors, earth kit, rack-to-MEB earth bond, levelling and fixdown\n  - patch panels, cable managers, PDUs, blanking panels, supply and install\n  - 2 x 48-port PoE+ switches, supply, rack-mount, power up, factory default only\n  - rack-end termination of 96 Cat6A links onto the patch panels\n  - 100 x 2m Cat6A patch leads, installed rack-side and floor-side\n  - labelling to AS/NZS 3084 at rack, panel port and outlet\n  - certification testing of all 96 permanent links, PDF report and as-built schedule\n  - one 2-hour handover and results walkthrough\n\nEXCLUDED - do not price:\n  - GST, preliminaries, margin, design, consent fees\n  - the horizontal cable runs, outlet-end terminations, faceplates, containment,\n    catenary, ceiling or floor access (priced under the cabling scenario)\n  - switch configuration: VLANs, routing, stacking, licensing, network integration\n  - UPS, dedicated power circuits, RCBOs, the supply to the rack PDUs\n  - fibre backbone, patch panels, splicing, OTDR testing\n  - room works: air conditioning, fire rating, access control, plywood backboards\n\n**Price for this exact scope - one 42RU rack, 96 certified Cat6A links, 2 x 48-port PoE+ switches, Auckland, mid-market commercial, excl. GST**\n\nBand: **$36,000 to $48,000 per rack**, most likely **$41,500**\n\nBuild-up at the midpoint, so the amortisation is auditable:\n\n| Item | Qty | Rate | Total |\n|---|---|---|---|\n| 42RU 800x1000 rack, plinth, doors, earth kit, installed | 1 | $3,200 | $3,200 |\n| Cat6A patch panels 24-port, supply + fix | 4 | $420 | $1,680 |\n| Cable managers, blanking panels, rack accessories | 1 lot | $650 | $650 |\n| Switched 16A PDU, 8-way C13 | 2 | $900 | $1,800 |\n| 48-port Gigabit PoE+ managed switch, 4x SFP+ | 2 | $7,600 | $15,200 |\n| Cat6A rack-end termination, punchdown + dress | 96 | $38 | $3,648 |\n| Cat6A 2m patch leads | 100 | $22 | $2,200 |\n| Labelling and as-built schedule | 96 | $9 | $864 |\n| Certification test, permanent link, incl. report | 96 | $32 | $3,072 |\n| Install labour: rack build, panel fit, switch mount, dress | 26 hr | $105 | $2,730 |\n| Commissioning, handover, spares reconciliation | 6 hr | $105 | $630 |\n| **Subtotal (excl. GST, prelims, margin)** | | | **$35,674** |\n| Contingency on switch pricing and lead variance, ~16% | | | $5,800 |\n| **Most likely** | | | **$41,474** |\n\nPer-link amortisation, so the rate can be checked against a different port count: rack + panels + PDUs + accessories = $7,330 fixed, or **$76/link** at 96 links. Per-link variable (termination, lead, label, test) = **$101/link**. Switches = $15,200, or **$158/link**. Labour = $3,360, or **$35/link**. Total **$370/link** before contingency, **$432/link** at the most-likely figure.\n\nWhat moves the band: the switches are 37% of the cost and the single largest driver. A tier-2 vendor (e.g. Ubiquiti, Netgear M4250-class) lands the pair near $4,800 and drops the rack to $30,000; a tier-1 with 3-year support (Cisco Catalyst 9200L, Aruba 6100) reaches $22,000 for the pair and pushes the rack to $48,000. The $7,600 each pinned above sits mid-market \u2014 Aruba Instant On 1960/1930-class or Cisco CBS350 with basic support.\n\nNext: if this catalogue line will be used against tier-1-specified jobs, split the switch out as its own scenario so the rack rate stops carrying a $17,000 swing.","runs":[{"run":"r1","low":24000,"high":38000,"resolved_from":"qv+web","confidence":"medium","basis":"Bottom-up rebuild of the pinned scope using web-verified NZ vendor pricing for rack, switches, switched PDUs and leads, plus a QV-benchmarked labour rate and an unpublished per-link build-up for termination/labelling/certification. Low case: trade buying, Dynamix-grade panels, CBS350 at approx $3100, 5% contingency. High case: branded panels and leads, switch at approx $4600, 32hr labour at $125/hr, 10% contingency. Centre approx $30,000, or $313/link. GST, prelims, margin, design and consent excluded per scope. Sits below the pinned $36,000-$48,000 band principally because the pinned $7600/switch is roughly double NZ published pricing for the specified 740W PoE+ 4x10G SFP+ unit, partly offset by the pinned $900 switched PDU being below the $1527 published rate.","components":[{"role":"labour_rate_benchmark","row_id":"77a9ea2e8b0f174651de8bdceb3c87c8c288ba10a5f707ee5c36267bf7395a8e:t0:r10","source":null,"unit":"hour","amount":{"low":83.65,"high":83.65},"centre":"Auckland","caveat":"QV row UNREVIEWED. Bare electrician labour cost, not contractor charge-out; supports but does not establish the $105/hr applied. No comms-technician row exists in QV."},{"role":"aggregate_crosscheck_do_not_combine","row_id":"ac5fef027b3b97701b4e6d5f0228aeef6bc2088d99f06141256ba95cd2e107b0:t32:r1","source":null,"unit":"m2","amount":{"low":11.0,"high":11.0},"centre":"Auckland","caveat":"QV row UNREVIEWED and is a whole-building m2 AGGREGATE for telephone/data reticulation that already embeds rack-end work. Must NOT be added to any component below."},{"role":"aggregate_crosscheck_do_not_combine","row_id":"e1ff7e963e91c35573874d517724a27a1c78ba246a86001e942ab32470747a38:t0:r19","source":null,"unit":"m2","amount":{"low":169.0,"high":169.0},"centre":"Auckland","caveat":"QV row UNREVIEWED. Whole-of-electrical-services m2 aggregate, offices basic 1-3 storey. Order-of-magnitude sanity check only."},{"role":"switch_48port_poe_plus_4x10G_SFP","row_id":null,"source":"https://acquire.co.nz/p/cisco/switches/cisco-cbs350-managed-48-port-ge-full-poe-4x10g-cbs350-48fp-4x-au-6216546","unit":"ea","amount":{"low":3100,"high":4600},"centre":"Auckland","caveat":"Cisco CBS350-48FP-4X matches the pinned spec exactly (48x PoE+ 740W, 4x10G SFP+, 1RU). $3781.59 excl GST retail at Acquire; PriceMe best NZ $3552.96 (incl GST, approx $3090 excl). High end covers HPE Instant On 1960 48G PoE (JL809A) at NZ retail plus freight; no NZ-published price located for JL809A. Retail, not trade; 63-day lead time quoted. Pinned $7600 ea is not supported for this spec."},{"role":"rack_42RU_800x1000_plus_plinth","row_id":null,"source":"https://acquire.co.nz/p/dynamix/cabinets-racks-accessories/dynamix-42ru-server-cabinet-1000mm-d-800mm-w-vertical-rsr42-8x10-2057627","unit":"ea","amount":{"low":2900,"high":3900},"centre":"Auckland","caveat":"Dynamix RSR42-8X10 $2917.39 excl GST, supply only. Plinth (RSPL8X10) and earth kit extra, no NZ price published for either. Static load 800kg and perforated-door spec not individually verified against this SKU."},{"role":"pdu_switched_1RU_16A_8xC13","row_id":null,"source":"https://www.pbtech.co.nz/product/PDUAPC79212/APC-RACK-PDU-Switched-1U-16A-208-230V-8C13","unit":"ea","amount":{"low":1100,"high":1530},"centre":"Auckland","caveat":"APC AP7921B $1526.96 excl GST retail. Low end is assumed trade discount, NOT published. Pinned $900 ea buys an UNSWITCHED unit only (StarTech PDU08C13AU $133.91 excl GST); scope specifies switched, so this line rises."},{"role":"patch_panel_cat6a_24port","row_id":null,"source":"https://cablingforu.co.nz/data-cabling-cost-auckland-2026-pricing-guide/","unit":"ea","amount":{"low":300,"high":450},"centre":"Auckland","caveat":"Installer guide quotes $120-180 for a 24-port panel, grade unstated and likely Cat6 unloaded. Range here adds Cat6A keystone jacks and fixing to reach the scoped rear-punchdown loaded panel. Not a vendor list price."},{"role":"patch_lead_cat6a_2m","row_id":null,"source":"https://www.pbtech.co.nz/product/CABDNX0327/Dynamix-PLW-C6A-2-2m-Cat6-White-UTP-Patch-Lead-T56","unit":"ea","amount":{"low":6,"high":22},"centre":"Auckland","caveat":"Dynamix 2m leads $5.15 excl GST at the UTP end of the range; $22 holds only for branded Panduit/Legrand S/FTP. Pinned $22 sits at the top of the band."},{"role":"rack_end_termination_label_and_certification_per_link","row_id":null,"source":"https://cablingforu.co.nz/cabling-pricing/","unit":"link","amount":{"low":65,"high":94},"centre":"Auckland","caveat":"NOT PUBLISHED as a standalone rate anywhere in NZ. Installers quote whole drops at $200-400/outlet all-in and bundle Fluke DSX certification (described as approx 5% of job value). This band is my own build-up of the pinned $38 termination + $9 label + $32 test, flexed +/-; treat as an estimate requiring a quote, not a market rate."}],"not_established":["Rack-end-only Cat6A termination rate as a standalone published NZ rate (installers quote whole drops only)","Permanent-link certification cost per link to TIA-568.2-D / ISO Class EA as a separately published rate; Fluke DSX testing is bundled into NZ drop pricing","Labelling to AS/NZS 3084 as a per-port published rate","Dynamix RSPL8X10 plinth NZ price (SKU confirmed, no price published)","Rack earth kit and rack-to-MEB earth bond as a priced item","1RU brush and horizontal cable manager NZ prices (SKUs exist on dynamix.co.nz, prices not published to search)","HPE Instant On 1960 48G PoE JL809A NZ price (PB Tech listing located, price not published to search)","Any QV CostBuilder coverage of comms racks, patch panels, Cat6A, rack PDUs, network switches or structured-cabling certification - none exists in the 9,816 indexed rows","Blanking panel rates","Handover/results walkthrough as a published rate"]},{"run":"r2","low":30000,"high":42000,"resolved_from":"qv+web","confidence":"medium","basis":"Web-established equipment supply (rack $2,917-3,602; 2 x CBS350-48FP-4X at $3,553-3,847; 2 x switched PDU at $1,021-1,527) totalling $12,650-14,350, plus QV electrician labour at $83.65/hr on-charged, plus the unpublished per-link variable and labour content (termination, patch leads, labelling, permanent-link certification, panel loading, plinth and accessories) carried at the pinned rates because nothing is published to test them. Approx $365/link at the $35,000 most-likely. Mid-market commercial, excl GST, prelims, margin, design and consent. Replaces the pinned $36,000-48,000, which only holds for a tier-1 switch pair with support; the pinned 16% contingency double-counts a switch risk that is in fact published.","components":[{"role":"install labour, electrician/comms technician","row_id":"77a9ea2e8b0f174651de8bdceb3c87c8c288ba10a5f707ee5c36267bf7395a8e:t0:r10","source":null,"unit":"hour","amount":{"low":83.65,"high":83.65},"centre":"Auckland","caveat":"UNREVIEWED QV row. Bare trade labour rate, excludes overhead and margin. A comms subcontractor charge-out of $95-120/hr is not published anywhere; the pinned $105/hr is consistent with on-charging this row."},{"role":"42RU 800x1000 floor-standing rack, supply only","row_id":null,"source":"https://www.pbtech.co.nz/product/CHADNX4208/Dynamix-42RU-Server-Cabinet-1000mm-deep-800x1000x2","unit":"ea","amount":{"low":2917,"high":3602},"centre":"Auckland","caveat":"Retail/reseller supply only. Excludes plinth, earth kit, levelling, fixdown and install labour. Perforated doors and 800kg static load not individually confirmed against the Dynamix spec. No QV row exists."},{"role":"48-port managed switch, full PoE+ 740W, 4x10G SFP+, 1RU","row_id":null,"source":"https://acquire.co.nz/p/cisco/switches/cisco-cbs350-managed-48-port-ge-full-poe-4x10g-cbs350-48fp-4x-au-6216546","unit":"ea","amount":{"low":3553,"high":3847},"centre":"Auckland","caveat":"Cisco CBS350-48FP-4X-AU, exact spec match. High = Acquire NZ stated ex GST. Low = PriceMe cheapest NZ offer, GST treatment unconfirmed and may be inclusive (ex GST would be ~$3,090). Excludes support contract, licensing and configuration. Pinned $7,600 each is roughly double this."},{"role":"rack PDU, 1RU 8-way C13, 16A, switched","row_id":null,"source":"https://www.upspower.co.nz/product/689-apc-rack-pdu-switched-1u-16a-8-c13-outlets","unit":"ea","amount":{"low":1021,"high":1527},"centre":"Auckland","caveat":"Genuinely switched/managed units only. Low = RackPower NZ, high = APC via PB Tech. A basic non-switched 8xC13 unit is ~$134 but does not meet the pinned scope. Pinned $900 each is below the switched range."},{"role":"Cat6A 24-port patch panel, 1RU, shielded, UNLOADED","row_id":null,"source":"https://www.4cabling.co.nz/1ru-24-port-ftp-patch-panel-unloaded.html","unit":"ea","amount":{"low":36.96,"high":42.5},"centre":"Auckland","caveat":"Unloaded chassis only - 24 Cat6A jacks are extra and their NZ trade price is not published. Not a substitute for the pinned loaded rear-punchdown panel. Loaded Cat6A panel pricing at Ideal and Atlas Gentech is behind a trade login."}],"not_established":["loaded Cat6A 24-port rear-punchdown patch panel, NZ trade price (trade login only at Ideal and Atlas Gentech)","Cat6A U/UTP 2m patch lead, NZ price per lead (only a Cat6 2m at $5.15 ex GST was visible)","rack-end Cat6A termination and dressing, rate per link","permanent-link certification to TIA-568.2-D / ISO Class EA, rate per link including PDF report","labelling to AS/NZS 3084, rate per port","rack plinth, earth kit and rack-to-MEB earth bond, supply and install","1RU brush and horizontal cable managers, blanking panels","comms subcontractor charge-out rate, Auckland","2-hour handover and results walkthrough"]},{"run":"r3","low":28000,"high":42000,"resolved_from":"qv+web","confidence":"medium","basis":"One 42RU rack, 96 certified Cat6A links, 2 x 48-port PoE+ switches, mid-market commercial, excl GST, prelims, margin and design. Most likely ~$34,000. Rebuilt from t
