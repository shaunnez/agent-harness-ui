                   Auckland, occupied tenancy, normal hours access\n  nominal quantity: 40 fittings total - 28 maintained LED emergency downlights\n                    (3W LED, 90 min integral LiFePO4 battery, non-maintained\n                    changeover, recessed, IP20, 100mm cut-out, white bezel)\n                    and 12 maintained LED exit signs (single/double-sided\n                    blade, 24m viewing distance, green pictogram to AS/NZS 2293.1,\n                    ceiling or wall mount, integral 90 min battery)\n  test facility:    manual test switch per fitting, NOT addressable or\n                    self-testing / DALI monitored\n  wiring:           1.5mm2 TPS on a dedicated emergency sub-circuit, clipped and\n                    cable-tray / ceiling-void run, average 12m of run per fitting,\n                    3 x 16A circuits from an existing distribution board with\n                    spare ways\n  certification:    initial 90-minute discharge test, AS/NZS 2293.2 log book,\n                    CoC and ESC for the emergency circuits\n  procurement:      mid-market NZ-stocked brand (equivalent to Legrand/Clevertronics\n                    standard range), trade-supplied, not specified imported premium\n\nINCLUDED, amortised over the 40 fittings where not already per-unit:\n  - luminaire or exit sign supplied and installed, including ceiling cut-out\n    and grid-tile trim\n  - 12m average of 1.5mm2 emergency sub-circuit cable per fitting, clipped, plus\n    junction/loop connections and terminations\n  - 3 circuit breakers and board terminations, amortised across the 40\n  - scissor lift / trestle access to 3.0m ceiling, amortised across the 40\n  - initial 90-minute discharge test of every fitting, witnessed\n  - AS/NZS 2293.2 log book, fitting schedule and as-built marked-up plan,\n    amortised across the 40\n  - CoC and ESC issue for the emergency circuits, amortised across the 40\n\nEXCLUDED - do not price:\n  - GST, preliminaries, margin, design, consent and BWOF/IQP fees\n  - the initial IQP/BWOF inspection and Compliance Schedule entry\n  - ongoing 6-monthly and annual re-testing beyond the initial discharge test\n  - central battery, inverter, addressable or self-test monitoring systems\n  - new distribution board, sub-main, or board upgrade works\n  - ceiling grid alteration, patching, plasterboard cutting or redecoration\n  - fire alarm interface, exit door hardware or illuminated signage to signage plan\n\n**Price: $315 \u2013 $430 per fitting. Nominal 40 fittings = $12,600 \u2013 $17,200.**\n\nBreakdown at midpoint ($370/ea, $14,800 total):\n\n| Component | $/ea | 40-off total |\n|---|---|---|\n| Fitting supply (28 downlights @ ~$95, 12 exit signs @ ~$135) | $107 | $4,280 |\n| Cable + accessories, 12m avg 1.5mm\u00b2 TPS | $48 | $1,920 |\n| Install labour, ~1.6 hr/fitting @ $95/hr | $152 | $6,080 |\n| Breakers + board terminations (3 circuits, ~$550) | $14 | $550 |\n| Access equipment (lift hire 3 days, ~$900) | $23 | $900 |\n| 90-min discharge test + log book + CoC/ESC (~$1,070) | $27 | $1,070 |\n\nBand drivers: the low end assumes clear ceiling void, short cable pulls and a single continuous install visit; the high end assumes congested void, out-of-hours access in an occupied tenancy and split visits. Confidence: moderate \u2014 fitting supply and test/certification are well-bounded; the 12m average cable run is the single largest source of drift and is pinned here specifically to stop it.","runs":[{"run":"r1","low":350,"high":480,"resolved_from":"qv","confidence":"medium","basis":"Sum of QV rows above at Auckland rates, GST exclusive, trade cost. Excludes margin, preliminaries, design, consent, BWOF/IQP fees, ongoing retesting, central battery or self-test systems, board upgrade, ceiling making good, and fire alarm interface, per the fixed scope. Weighted 28 downlights to 12 exit signs. Band low assumes clear void, 12m runs, single continuous visit; high assumes congested void, 15m runs, split visits. Band rises to $435-600 if QV table t20 is supply-only rather than supply-and-fix.","components":[{"role":"emergency LED downlight, 3W recessed, supplied and fixed","row_id":"ac5fef027b3b97701b4e6d5f0228aeef6bc2088d99f06141256ba95cd2e107b0:t20:r6","source":null,"unit":"ea","amount":{"low":208,"high":236},"centre":"Auckland","caveat":"High end is t20:r7 'with mounting kit'. Unverified whether table t20 is supply-only or supply-and-fix; if supply-only add 1.0-1.5hr fix labour. No integral-battery, 90min, IP20 or cut-out dimension stated in the row."},{"role":"LED exit sign, maintained, supplied and fixed","row_id":"ac5fef027b3b97701b4e6d5f0228aeef6bc2088d99f06141256ba95cd2e107b0:t20:r11","source":null,"unit":"ea","amount":{"low":208,"high":347},"centre":"Auckland","caveat":"Row reads '2.3W, surface mounted or suspended' - not a blade sign, no viewing distance or AS/NZS 2293.1 pictogram stated. High end is t20:r12 (5W surface). Proxy row, not a match."},{"role":"1.5mm2 two core + earth flat TPS, installed, 12-15m per fitting","row_id":"ac5fef027b3b97701b4e6d5f0228aeef6bc2088d99f06141256ba95cd2e107b0:t7:r71","source":null,"unit":"m","amount":{"low":6.6,"high":6.6},"centre":"Auckland","caveat":"Row is 'installed in roof space', not cable tray or ceiling void clipped - closest available. 12m low / 15m high gives $79-99 per fitting. Not combined with t10:r9 additional light point, which carries its own cable allowance."},{"role":"loop and termination labour at each fitting, 0.25-0.5hr","row_id":"77a9ea2e8b0f174651de8bdceb3c87c8c288ba10a5f707ee5c36267bf7395a8e:t0:r10","source":null,"unit":"hour","amount":{"low":83.65,"high":83.65},"centre":"Auckland","caveat":"Bare QV labour rate. Hours are my assumption, not published. WLG 68.70, CHC 80.60."},{"role":"16A single pole MCB, 3 off amortised over 40","row_id":"ac5fef027b3b97701b4e6d5f0228aeef6bc2088d99f06141256ba95cd2e107b0:t29:r33","source":null,"unit":"ea","amount":{"low":53,"high":53},"centre":"Auckland","caveat": site touch-up of 7.5 m2 plus one trade visit amortised = $2-5. Total ~$94-173/m2, rounded to $95-175/m2. 150 m2 batch = $14,250-$26,250, mid ~$20,250. GST, prelims, margin, the joinery itself, delivery and install excluded. NOT a published rate \u2014 QV holds no factory 2-pack spray row and no NZ per-m2 rate is published anywhere; replace with three joinery-shop quotes before tender.","pinned_scope":"SCENARIO\nid: joinery-finishing-painting-pinned\ntitle: Joinery finishing and painting\nfamily: joinery\ncatalogue unit: m2 (per m2 of finished joinery face area, measured over the visible painted/coated surface: fronts, exposed ends, shelf tops and bottoms; carcase interiors excluded from the measure)\n\nSCOPE - FIXED. Do not substitute your own.\n  substrate:        18mm MDF, E0, moisture-resistant grade, machined and edge-sealed\n  item type:        commercial fitout joinery \u2014 reception counter, tea-point cabinetry,\n                    open shelving; flat and shaped edges, no curved or veneered panels\n  system:           2-pack polyurethane, pigmented, satin 30% gloss level\n                    (Resene Uracryl / Dulux Duratec equivalent), 1 sealer + 2 topcoats\n  application:      FACTORY spray, off-site in a controlled spray booth, sanded between\n                    coats, wrapped for transport\n  nominal quantity: 150 m2 of finished face area, in one production batch, one colour\n  site allowance:   5% of the area (7.5 m2) touched up on site after installation\n  location:         Auckland, single-storey commercial fitout, normal working hours\n\nINCLUDED, amortised over the 150 m2 where not already per-unit:\n  - sanding, filling, edge-sealing and preparation of the raw MDF\n  - one pigmented 2-pack sealer coat plus two satin topcoats, both faces where exposed\n  - denib and sand between coats\n  - booth setup, colour mix, gun clean-down and single colour change, amortised\n  - masking of hardware cut-outs and unpainted zones\n  - protective wrap and stacking for transport\n  - on-site touch-up of 5% of the area after install, including one trade visit\n  - spray booth consumables, extraction and waste paint disposal\n\nEXCLUDED - do not price:\n  - GST, preliminaries, margin, design, consent fees\n  - the joinery itself \u2014 sheet material, machining, edging, assembly, hardware\n  - delivery, cartage, hoisting and installation of the joinery\n  - stain, clear lacquer, two-tone or multi-colour work, and any second colour\n  - benchtops, laminate, veneer, melamine or pre-finished panel products\n  - scaffolding, site protection, site painting of walls or ceilings\n  - metallic, textured, anti-graffiti or fire-rated coating systems\n\nGive the band as $/m2 of finished face area for this exact scope, and state the total\nfor the 150 m2 batch so the amortisation is auditable.\n\nPrice it, or tell us honestly why you cannot.","runs":[{"run":"r1","low":null,"high":null,"resolved_from":"not_established","confidence":"low","basis":"No published NZ rate for factory booth-applied 2-pack pigmented polyurethane on MDF joinery, per m2 of finished face area. QV painting rows are site-applied single-pack systems on timber and are not substitutable. Deriving a band would require assuming a booth output constant and a 2-pack material cost, neither of which is published.","components":[{"role":"floor_proxy_site_applied_single_pack","row_id":"a4bbf7211339ad80044429f4a2aa721d5ac5c61f6fe4a34f6afb9ccae5475570:t0:r12","source":null,"unit":"m2","amount":{"low":37.9,"high":37.9},"centre":"Auckland","caveat":"Interior Painting Timber, enamel prime + 1 undercoat + 1 topcoat, general surfaces. SITE-applied, single-pack, brush/roller. NOT the scoped system. Use as a lower bound only \u2014 factory booth 2-pack pigmented spray exceeds this. Unreviewed QV row."},{"role":"alt_floor_proxy_polyurethane_site","row_id":"a4bbf7211339ad80044429f4a2aa721d5ac5c61f6fe4a34f6afb9ccae5475570:t0:r24","source":null,"unit":"m2","amount":{"low":36.6,"high":36.6},"centre":"Auckland","caveat":"Stain, seal and two coats polyurethane, general surfaces. Site-applied and stain-based, not pigmented 2-pack. Scope excludes stain. Indicative only. Unreviewed QV row."},{"role":"painter_labour_rate","row_id":"77a9ea2e8b0f174651de8bdceb3c87c8c288ba10a5f707ee5c36267bf7395a8e:t0:r22","source":null,"unit":"hour","amount":{"low":70.25,"high":70.25},"centre":"Auckland","caveat":"Site painter hourly rate. A factory joinery spray finisher is a different labour class; no output constant published for booth spray on MDF, so this cannot be converted to $/m2 without inventing a rate. Unreviewed QV row."}],"not_established":["$/m2 for factory spray-booth applied pigmented 2-pack polyurethane, 1 sealer + 2 satin topcoats, on machined and edge-sealed 18mm MR MDF joinery","total for the 150 m2 batch","booth setup, colour mix, gun clean-down and single colour change, amortised over a 150 m2 batch","raw MDF preparation, edge-sealing and filling as a separate factory operation","denib and sand between coats as a priced operation","protective wrap and stacking for transport","on-site touch-up of 7.5 m2 plus one trade visit","spray booth consumables, extraction and waste paint disposal","Resene Uracryl 402/403 trade cost per litre and practical spread rate on sealed MDF","Dulux Duratec trade cost per litre and spread rate"]},{"run":"r2","low":95,"high":175,"resolved_from":"qv+web","confidence":"low","basis":"First-principles build-up: 2K pigmented sealer + 2 satin topcoats materials $38-56, consumables $8-15, labour 0.5-0.9 hr/m2 at $65-75/hr = $33-68, booth overhead/extraction/colour change/waste amortised over 150 m2 = $10-23, wrap and stack $3-6, site touch-up of 7.5 m2 plus one trade visit amortised = $2-5. Total ~$94-173/m2, rounded to $95-175/m2. 150 m2 batch = $14,250-$26,250, mid ~$20,250. GST, prelims, margin, the joinery itself, delivery and install excluded. NOT a published rate \u2014 QV holds no factory 2-pack spray row and no NZ per-m2 rate  for transport","raw MDF preparation, edge-sealing and filling as a separate factory operation","spray booth consumables, extraction and waste paint disposal","total for the 150 m2 batch"],"review":{"state":"pending","decision":null,"reviewer":null,"note":null,"decided_at":null},"record_sha256":"8aa13e89f36a6968"},{"scenario_id":"site-electrical-reticulation","title":"Site electrical reticulation and services","family":"electrical","unit":"sum","claims_covered":5,"status":"disputed","range":{"min":74400,"max":146000},"consensus":{"low":78500,"high":110500},"agreement":{"low_ratio":1.304,"high_ratio":1.325,"runs_with_band":3,"runs_total":3},"currency":"NZD","gst_basis":"exclusive","centre":"Auckland","as_of":"2026-09-22","basis":"Sum of trenching and reinstatement ($12,700-$26,000), conduit and cable ($61,300-$78,300) and board and spurs ($4,470-$6,244). Implied $314-$442 per lineal metre over the 250m nominal route. EXCLUDES the 10 pits, sub-main terminations, spur glands, galvanised plinth and testing/commissioning/CoC, none of which are published. Also excludes GST, preliminaries, margin, design, consent fees, incoming supply and network connection, poles and luminaires, rock, contamination, dewatering and traffic management per the fixed scope. The conduit rows drive most of the total and are the least reliable component.","pinned_scope":"SCENARIO\nid: site-electrical-reticulation-pinned\ntitle: Site electrical reticulation and services\nfamily: electrical\ncatalogue unit: sum (for the whole external reticulation installation, one site)\n\nSCOPE - FIXED. Do not substitute your own.\n  site area:      3,000 m2 external sealed car park and service yard, flat, Auckland\n  nominal route:  250 lineal metres of trench, 450mm wide x 750mm deep, 100mm sand bed\n                  and surround with marker tape; 200m in grass/unsealed ground, 50m\n                  through existing 150mm concrete or asphalt hardstand\n  conduits:       2 x 63mm and 1 x 32mm orange heavy-duty PVC to AS/NZS 2053, laid the\n                  full 250m, draw cord to every way\n  sub-main:       180 lineal metres of 4-core 25mm2 copper XLPE/PVC 0.6/1kV, drawn into\n                  one 63mm way, terminated both ends\n  pits:           8 no. 450 x 450 polymer concrete pits, Class B lids (light vehicle),\n                  plus 2 no. 600 x 600 pits, Class C lids\n  distribution:   one external IP66 100A TP&N 12-way distribution board, RCBO protected,\n                  on a hot-dip galvanised steel frame plinth\n  lighting spurs: 10 no. 4mm2 drops from pit to lighting pole base, 6m average each,\n                  cable and gland only\n\nINCLUDED, amortised over the 250m nominal route where not already per-unit:\n  - machine trench excavation, sand bed and surround, backfill and compaction\n  - sawcut, break out and reinstate the 50m of concrete/asphalt hardstand to match\n  - all conduit, draw cord, bends and couplers, supplied and laid\n  - the 180m sub-main, supplied, drawn in and terminated at both ends\n  - all 10 pits, supplied, set to level, surround and lids\n  - the external distribution board, plinth, mounting and terminations\n  - the 10 lighting pole base drops, amortised across the sum\n  - testing, commissioning, electrical certificate of compliance and as-built mark-up\n\nEXCLUDED - do not price:\n  - GST, preliminaries, margin, design, consent fees\n  - the incoming supply, network connection, transformer, main switchboard or metering\n  - lighting poles, pole footings, luminaires, controls or CCTV/comms active equipment\n  - rock excavation, contaminated spoil, dewatering, traffic management\n  - any second sub-main run, generator feed or EV charger provision\n  - paving, kerbing, landscaping or turf reinstatement beyond the trench line\n\nGive the band as a lump sum for this exact scope, broken into the trenching and\nreinstatement, the conduit and cable, the pits, and the board and spurs, so a reviewer\ncan reject one part without the others. State the implied $/lineal metre over the 250m\nnominal route as well, so the amortisation is auditable.\n\nPrice it, or tell us honestly why you cannot.","runs":[{"run":"r1","low":78500,"high":110500,"resolved_from":"qv","confidence":"low","basis":"Sum of trenching and reinstatement ($12,700-$26,000), conduit and cable ($61,300-$78,300) and board and spurs ($4,470-$6,244). Implied $314-$442 per lineal metre over the 250m nominal route. EXCLUDES the 10 pits, sub-main terminations, spur glands, galvanised plinth and testing/commissioning/CoC, none of which are published. Also excludes GST, preliminaries, margin, design, consent fees, incoming supply and network connection, poles and luminaires, rock, contamination, dewatering and traffic management per the fixed scope. The conduit rows drive most of the total and are the least reliable component.","components":[{"role":"trench excavation, 250m","row_id":"915613f8a816d7765d17ab80b3f84417d8a74eda796620a26ab02c98421b1e70:t0:r3 / :r17","source":null,"unit":"m","amount":{"low":16.2,"high":35.9},"centre":"Auckland","caveat":"Rows are for 1.5m total / 1m average depth, deeper than the 750mm specified; lost sub-headings mean no row states trench width. Taken as including backfill with excavated material."},{"role":"sand bed and surround","row_id":"915613f8a816d7765d17ab80b3f84417d8a74eda796620a26ab02c98421b1e70:t0:r72","source":null,"unit":"m3","amount":{"low":155,"high":155},"centre":"Auckland","caveat":"Imported clean sand including cart-away of spoil; 30-39 m3 assumed for 100mm bed plus surround over 250m."},{"role":"imported metal backfill under hardstand","row_id":"915613f8a816d7765d17ab80b3f84417d8a74eda796620a26ab02c98421b1e70:t0:r74","source":null,"unit":"m3","amount":{"low":138,"high":138},"centre":"Auckland","caveat":"All passing 65mm rock; 10-12 m3 over the 50m hardstand length only."},{"role":"sawcut 150mm reinforced concrete","row_id":"3012e40c988aa035c47e34ff2ff827c2bcb29af24240a7bd826ab798d7476014:t17:r40 mpact in two 150mm layers","row_id":"2d92fb333c379af3f3ef632920d6b11a6f53e11fd70fd767decdc8f8a7bf1f6f:t2:r4","source":null,"unit":"m3 compacted","amount":{"low":101.0,"high":138.0},"centre":"Auckland","caveat":"Low = civil imported GAP40 fill carted <=20km levelled and compacted $75.00; high = building-works GAP40 supply/spread/consolidate to open areas $112.00 (d2f84\u2026:t8:r12), which suits a 150m3 two-patch job better. Both plus a derived $26.00 TNZ40-over-GAP40 supply differential (:t8:r5 $76 less :t8:r3 $50) \u2014 a derived uplift, not a published laid rate for TNZ M/4."},{"role":"trim and level formation to receive basecourse","row_id":"2d92fb333c379af3f3ef632920d6b11a6f53e11fd70fd767decdc8f8a7bf1f6f:t1:r1","source":null,"unit":"m3 in-situ","amount":{"low":6.67,"high":6.67},"centre":"Auckland","caveat":"$2.00/m2 over 500m2 amortised over 150m3."},{"role":"extra compaction and water for 95% MDD","row_id":"2d92fb333c379af3f3ef632920d6b11a6f53e11fd70fd767decdc8f8a7bf1f6f:t0:r25","source":null,"unit":"m3 compacted","amount":{"low":0.0,"high":3.4},"centre":"Auckland","caveat":"Row is a 90% fill-compaction add-extra used as a proxy for extra roller passes to 95% MDD; the AP40 rate above already states 'levelled and compacted', so the low end is nil to avoid double count."},{"role":"proof roll and two Scala / plate-bearing test sets","row_id":"3012e40c988aa035c47e34ff2ff827c2bcb29af24240a7bd826ab798d7476014:t5:r3","source":"https://penetrometer.co.nz/products/scala-penetrometer-kit-hire","unit":"m3 in-situ","amount":{"low":2.67,"high":5.33},"centre":"Auckland","caveat":"No QV row for soil compaction testing. Proxy is a concrete technician site visit within 20km at $362; Scala kit hire $95/day +GST. $400-800 total assumed for two sets. Get a fee from a testing house."},{"role":"excavator and roller mobilisation to site","row_id":null,"source":null,"unit":"m3 in-situ","amount":{"low":0.0,"high":0.0},"centre":"Auckland","caveat":"NOT ESTABLISHED and excluded from the const KEY="research-review-decisions-v1";
let dec={}; try{dec=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(dec))}catch(e){}};
const S=FEED.scenarios, ASKS=(FEED.asks||[]);
let filter="all", sel=null;

const money=(n)=>n==null?"—":Number(n).toLocaleString("en-NZ",{maximumFractionDigits:0});
const esc=(s)=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

document.getElementById("hdr").textContent =
  `${FEED.generated_at} · ${FEED.model} · ${FEED.auth} · ${FEED.runs_per_scenario} runs per scenario · ${FEED.source_catalogue}`;

function counts(){
  const c=FEED.counts;
  const done=S.filter(s=>dec[s.scenario_id]?.decision).length;
  document.getElementById("counts").innerHTML =
    `<span><b>${c.scenarios}</b> scenarios</span><span><b>${c.claims_covered}</b> claims</span>`+
    `<span style="color:var(--ok)"><b>${c.agreed}</b> agreed</span>`+
    `<span style="color:var(--warn)"><b>${c.disputed}</b> disputed</span>`+
    `<span style="color:var(--none)"><b>${c.not_established}</b> no band</span>`+
    `<span style="color:var(--acc)"><b>${done}</b>/${c.scenarios} reviewed</span>`;
}
const FILTERS=[["all","All"],["agreed","Agreed"],["disputed","Disputed"],["not_established","No band"],["undecided","Not yet reviewed"]];
document.getElementById("filters").innerHTML=FILTERS.map(([k,l])=>
  `<button class="f${k==="all"?" on":""}" data-f="${k}">${l}</button>`).join("");
document.getElementById("filters").onclick=e=>{
  const b=e.target.closest("[data-f]"); if(!b)return;
  filter=b.dataset.f;
  [...document.querySelectorAll("#filters .f")].forEach(x=>x.classList.toggle("on",x===b));
  rows();
};

function rows(){
  const list=S.filter(s=> filter==="all" ? true
      : filter==="undecided" ? !dec[s.scenario_id]?.decision : s.status===filter);
  document.getElementById("rows").innerHTML=list.map(s=>{
    const d=dec[s.scenario_id]?.decision;
    const band=s.consensus?`${money(s.consensus.low)}–${money(s.consensus.high)}`:"no band";
    const ag=s.agreement.low_ratio?`agree ${s.agreement.low_ratio.toFixed(2)}× / ${s.agreement.high_ratio.toFixed(2)}×`:"";
    return `<div class="row${sel===s.scenario_id?" sel":""}" data-id="${s.scenario_id}">
      <div class="t">${esc(s.title)}</div>
      <div class="b">${band}</div>
      <div class="s"><span class="badge ${s.status}">${s.status.replace("_"," ")}</span>
        ${d?`<span class="decided d-${d}">${d}</span>`:""}
        <span>${s.claims_covered} claims</span><span>${esc(s.unit||"")}</span><span>${ag}</span></div>
    </div>`}).join("") || `<div class="empty">Nothing matches.</div>`;
  counts();
}
document.getElementById("rows").onclick=e=>{
  const r=e.target.closest("[data-id]"); if(!r)return;
  sel=r.dataset.id; rows(); detail();
  document.getElementById("detail").scrollTop=0;
};

function detail(){
  const s=S.find(x=>x.scenario_id===sel); if(!s)return;
  const d=dec[s.scenario_id]||{};
  const runs=s.runs.filter(r=>r.low!=null);
  const el=document.getElementById("detail");
  el.innerHTML=`
  <h2>${esc(s.title)}</h2>
  <div class="sub">${esc(s.family)} · ${s.claims_covered} unpriced claims across the tenders · <span class="hash">${s.record_sha256}</span></div>

  <div class="dis">
    <span>${s.currency}</span><span>GST ${s.gst_basis}</span>
    <span>${esc(s.centre||"—")}</span><span>as of ${s.as_of}</span>
  </div>

  ${s.consensus?`<div class="big">${money(s.consensus.low)} – ${money(s.consensus.high)} <small>${esc(s.unit||"")}</small></div>
    <div class="basis">Outer envelope across all runs ${money(s.range.min)} – ${money(s.range.max)}.
    Agreement ${s.agreement.low_ratio.toFixed(2)}× low, ${s.agreement.high_ratio.toFixed(2)}× high,
    from ${s.agreement.runs_with_band} of ${s.agreement.runs_total} runs.</div>`
   :`<div class="big">No band <small>— no run would price this</small></div>`}

  ${s.basis?`<h3>What the band includes</h3><div class="card basis">${esc(s.basis)}</div>`:""}

  ${runs.length>1?`<h3>The ${runs.length} runs</h3><div class="card"><table>
    <tr><th>run</th><th>low</th><th>high</th><th>from</th><th>confidence</th></tr>
    ${runs.map(r=>`<tr><td>${esc(r.run)}</td><td class="n">${money(r.low)}</td><td class="n">${money(r.high)}</td>
      <td>${esc(r.resolved_from||"")}</td><td>${esc(r.confidence||"")}</td></tr>`).join("")}
    </table>${s.status==="disputed"?`<div class="basis" style="margin-top:10px">These disagree. The gap usually means the scope leaves a price-moving parameter unstated — read the basis lines before rejecting the number.</div>`:""}</div>`:""}

  ${s.qv_sources.length?`<h3>QV rows used (${s.qv_sources.length})</h3><div class="card"><table>
    <tr><th>section / group</th><th>description</th><th>unit</th><th>AKL</th><th>WLG</th><th>CHC</th><th>runs</th></tr>
    ${s.qv_sources.map(q=>`<tr>
      <td><a href="${esc(q.url)}" target="_blank" rel="noopener">${esc(q.section||"")}</a>${q.group?`<br><span style="color:var(--dim)">${esc(q.group)}</span>`:""}</td>
      <td>${esc(q.desc||"")}</td><td class="n">${esc(q.unit||"")}</td>
      <td class="n">${esc((q.regional||{}).Auckland||"—")}</td>
      <td class="n">${esc((q.regional||{}).Wellington||"—")}</td>
      <td class="n">${esc((q.regional||{}).Christchurch||"—")}</td>
      <td class="n">${q.cited_by||1}/3</td></tr>`).join("")}
    </table></div>`:""}

  ${s.web_sources.length?`<h3>Web sources</h3><div class="card"><ul>${s.web_sources.map(u=>`<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a></li>`).join("")}</ul></div>`:""}

  ${s.open_questions.length?`<h3>Open questions (${s.open_questions.length})</h3><div class="card"><ul>${s.open_questions.map(q=>`<li>${esc(q)}</li>`).join("")}</ul></div>`:""}

  ${s.pinned_scope?`<h3>The scope this was priced against</h3><pre>${esc(s.pinned_scope)}</pre>`:""}

  <div class="act">
    <h3 style="margin-top:0">Your decision</h3>
    <div class="btns">
      ${["approved","rejected","rescope"].map(k=>
        `<button data-d="${k}" class="${d.decision===k?"on":""}">${
          k==="approved"?"Approve — usable as a band":k==="rejected"?"Reject — wrong":"Scope is wrong — re-run"}</button>`).join("")}
    </div>
    <textarea rows="3" id="note" placeholder="Why? Especially if rejecting or re-scoping.">${esc(d.note||"")}</textarea>
  </div>`;

  el.querySelector(".btns").onclick=e=>{
    const b=e.target.closest("[data-d]"); if(!b)return;
    dec[s.scenario_id]={decision:b.dataset.d,note:el.querySelector("#note").value,
      decided_at:new Date().toISOString(),record_sha256:s.record_sha256};
    save(); rows(); detail();
  };
  el.querySelector("#note").onblur=e=>{
    if(!dec[s.scenario_id])dec[s.scenario_id]={decision:null};
    dec[s.scenario_id].note=e.target.value;
    dec[s.scenario_id].record_sha256=s.record_sha256; save();
  };
}

document.getElementById("export").onclick=()=>{
  const out={exported_at:new Date().toISOString(),generated_at:FEED.generated_at,
    decisions:Object.entries(dec).map(([id,v])=>({scenario_id:id,...v}))};
  const t=JSON.stringify(out,null,1);
  const w=window.open("","_blank");
  w.document.write("<title>decisions.json</title><pre style='font:12px ui-monospace,monospace;white-space:pre-wrap;padding:20px'>"+
    t.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))+"</pre>");
  w.document.close();
};

rows();
</script>
